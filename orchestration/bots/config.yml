# airflow-bots configuration for vintage-data. Reference: bots/README.md.
# Secrets come from orchestration/airflow.secrets.env: GITHUB_TOKEN, BOTS_API_PASSWORD.

github:
  repo: cdlethem/vintage-data
  base: main

airflow:
  url: http://${AIRFLOW__API__HOST}:${AIRFLOW__API__PORT}
  ui_url: ${AIRFLOW__API__BASE_URL}

state_dir: ${EXTRACT_DATA_ROOT}/state/bots
instructions: instructions.md

agents:
  default:
    # omp resolves the LOCAL role to the llama.cpp server; swap the model or the
    # whole command (claude, codex, aider...) freely. agent.sh keeps this
    # deployment's checkout read-only while the agent runs.
    command: &omp ["{config_dir}/agent.sh", omp, -p, --mode, text, --model, "@LOCAL", --no-title, --auto-approve,
                   --session-dir, "{run_dir}/session", "{prompt}"]
    timeout_minutes: 45
    env: &env [HOME, PATH, USER, LANG, TERM, XDG_CONFIG_HOME, XDG_DATA_HOME, XDG_CACHE_HOME]
    usage: omp
  long:
    # Building a whole new source (research, fetcher, tests, live check) takes the
    # local model well over 40 minutes.
    command: *omp
    timeout_minutes: 120
    env: *env
    usage: omp
  judge:
    # Grades eval runs from the text it is given; with tools it wandered off and
    # split its verdict across messages.
    command: [omp, -p, --mode, text, --model, "@LOCAL", --no-title, --no-tools,
              --session-dir, "{run_dir}/session", "{prompt}"]
    timeout_minutes: 15
    env: *env
    usage: omp

limits:
  daily_runs: 30
  daily_usd: 5
  concurrency: 2
  pool: bots            # shared by healing and jobs: the local llama.cpp server has two slots

heal:
  schedule: "*/15 * * * *"
  lookback_hours: 24
  max_new_per_sweep: 2
  auto_merge:
    enabled: true       # only for fixes the bot calls routine, inside these paths, with CI green
    paths: ["extract/scripts/*", "extract/sources/*", "extract/test_*.py", "extract/tests/*"]

jobs:
  new_source:
    schedule: "30 5 * * *"
    prompt: jobs/new_source.md
    agent: long

evals:
  cases: evals
  judge: judge
