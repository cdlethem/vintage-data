  - The options include at least one alternative to loosening the check (for example trusting the reported total count), with its trade-offs.
  - The summary is understandable without reading the code: names the PokéAPI extract, what broke, and what changed.
notes: Real failure from 2026-09-22 onwards; the reviewed fix changed one comparison in fetch_pokeapi.py plus tests.
