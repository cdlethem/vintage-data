rubric: |
  - Identifies that the API intermittently returns HTTP 500 (and stalls) while the fetcher only retried a narrower set of errors.
  - Any retry it adds is bounded in attempts and total time, so a sustained outage still fails the run visibly.
  - The options weigh retrying transient errors inside the run against letting the run fail and relying on the next scheduled run.
notes: Flapping upstream on 2026-09-29; the bot proposed widening the fetcher's bounded retries (PR #231).
