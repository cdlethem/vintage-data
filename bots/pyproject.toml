[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-bots"
version = "0.1.0"
description = "Self-healing agents for Airflow pipelines: diagnose failures, open issues and PRs, stay within a budget."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.0"]

[project.scripts]
airflow-bots = "airflow_bots.cli:main"

[project.entry-points."airflow.plugins"]
airflow_bots = "airflow_bots.plugin:BotsPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_bots"]

