# Which models this machine can reach, and what to call them.
#
#   cp bots/models.example.yml bots/models.yml
#
# models.yml is gitignored: model choice is a per-operator decision, and mine
# should not be yours. Bot definitions (bots/<name>/bot.yml) name an *alias*
# from this file, never a vendor, endpoint or model id — so switching every
# bot from a local GPU to OpenRouter is one edit here.
#
# API keys are NOT stored here. `api_key_env` names the environment variable
# holding the key:
#   * scheduled runs read it from orchestration/airflow.secrets.env (gitignored,
#     loaded by the systemd units) — add e.g. OPENROUTER_API_KEY=sk-or-...
#   * manual runs read it from your shell.
#
# Providers (bots/providers.py):
#   openai_chat        - any OpenAI-compatible /v1/chat/completions endpoint
#                        (OpenRouter, OpenAI, Groq, Together, DeepSeek, vLLM,
#                        llama-server, Ollama)
#   anthropic_messages - Anthropic's native /v1/messages
#   command            - any local program; prompt on stdin (or {prompt} in argv),
#                        report on stdout, exit 3 = busy/skip

# The alias a bot gets when its bot.yml names no model.
default: openrouter

models:
  openrouter:
    provider: openai_chat
    endpoint: https://openrouter.ai/api/v1/chat/completions
    model: anthropic/claude-sonnet-4.5
    api_key_env: OPENROUTER_API_KEY
    max_tokens: 2000
    temperature: 0
    # Optional, and specific to OpenRouter's dashboard attribution.
    headers:
      X-Title: vintage-data bots

  openai:
    provider: openai_chat
    endpoint: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 2000

  claude:
    provider: anthropic_messages
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 2000

  # A model server on this host (llama-server, vLLM, Ollama, LM Studio).
  # `preflight` runs first and a non-zero exit means "busy": the bot writes a
  # skip report instead of queueing behind a saturated GPU.
  local:
    provider: openai_chat
    endpoint: http://127.0.0.1:8080/v1/chat/completions
    model: local-model
    max_tokens: 2000
    temperature: 0
    timeout_s: 600
    # A reasoning model bills chain-of-thought against max_tokens and can spend
    # the whole budget there, returning no report. `params` is passed through to
    # the request body verbatim, so turn thinking off (Qwen-style template) or
    # raise max_tokens well above the report length.
    params:
      chat_template_kwargs:
        enable_thinking: false
    preflight:
      command: ["bots/bin/free_slots", "http://127.0.0.1:8080/slots"]
      cwd: .

  # A coding-agent CLI already configured on this machine. Anything that reads
  # a prompt and writes text works; use {prompt} when the CLI wants an argument
  # rather than stdin.
  agent_cli:
    provider: command
    model: local
    argv: ["omp", "-p", "--mode", "text", "--model", "{model}",
           "--thinking=low", "--max-time", "6m", "--no-session", "--no-title",
           "{prompt}"]
    timeout_s: 900
