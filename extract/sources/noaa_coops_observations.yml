name: noaa_coops_observations
script: fetch_noaa_coops_observations.py
args: ["--station", "9414290", "--lookback-hours", "24", "--datum", "MLLW", "--units", "metric", "--time-zone", "gmt", "--timeout", "30", "--retries", "2", "--request-delay", "1"]
schedule: "17 */6 * * *"  # UTC; conservative polling with a 24-hour overlap
# Keep disabled until an operator records both a successful live-source smoke and a
# successful Airflow import check. Confined verification must not perform those checks
# or mutate Airflow metadata.
enabled: false
retries: 1
timeout_minutes: 5
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "six-hour snapshots of NOAA CO-OPS water-level observations and predictions for station 9414290; each bounded request covers the trailing 24 hours"
rate_limit: "two requests per run, one second apart; HTTP 429 and 5xx responses retry twice with bounded exponential backoff"
licence: "United States government work; attribute NOAA/NOS/Center for Operational Oceanographic Products and Services and the named station"
attribution_required: true
