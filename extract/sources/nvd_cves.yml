name: nvd_cves
script: fetch_nvd_cves.py
args: ["modified"]
schedule: "12,42 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "polling the MODIFIED feed (not published) captures CVE revision history — the more valuable series"
rate_limit: "keyless: ~5 req/30s; script sleeps 6s between requests"
licence: "NVD — US Government work, public domain"
attribution_required: false
