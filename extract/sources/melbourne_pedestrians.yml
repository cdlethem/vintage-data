name: melbourne_pedestrians
script: fetch_melbourne_pedestrians.py
args: []
schedule: "8-59/30 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 15
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "minute-level pedestrian counts; publisher refreshes ~15 min and exposes a rolling window only. Checkpoints the newest sensing_datetime, so each run emits only genuinely new minutes (verified: 2596 records cold, 0 on immediate re-run). --minutes only bounds the cold start."
rate_limit: "paged OpenDataSoft walk, newest-first, stops at the stored watermark"
licence: "City of Melbourne open-data terms"
attribution_required: true
