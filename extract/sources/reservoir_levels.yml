name: reservoir_levels
script: fetch_reservoir_levels.py
args: ["all"]
schedule: "15 8 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily storage/inflow/outflow for CA's major reservoirs; daily data changes once/day"
rate_limit: "no published limit; batch stations/sensors into one request"
licence: "California DWR — public domain, attribution requested"
attribution_required: true
