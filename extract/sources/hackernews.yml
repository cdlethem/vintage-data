name: hackernews
script: fetch_hackernews.py
args: ["updates"]
schedule: "*/5 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "/v0/updates.json changed-set poll — the efficient way to track score trajectories"
rate_limit: "officially none; one request per hydrated item, so be decent"
licence: "HN Firebase API — public"
attribution_required: false
