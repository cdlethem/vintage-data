name: nextstrain
script: fetch_nextstrain.py
args: []
schedule: "15 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "builds rebuild on the order of days; polling faster than daily is pure waste"
rate_limit: "no published limit; large builds, be gentle"
licence: "Nextstrain data CC-BY; GISAID-sourced builds carry GISAID's stricter terms — check meta.data_provenance"
attribution_required: true
