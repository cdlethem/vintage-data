name: open_meteo_weather
script: fetch_open_meteo_weather.py
args: ["--forecast-days", "7", "--batch-size", "10", "--timeout", "30", "--request-delay", "1"]
schedule: "43 */6 * * *"  # UTC; forecasts change, but six-hour collection is conservative
# Keep disabled until an operator completes the first approved live-source load and
# warehouse synchronization through the analytics_engineer workflow.
enabled: false
retries: 1
timeout_minutes: 5
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "six-hour UTC snapshots of a fixed five-location basket, eight hourly variables, and a bounded seven-day forecast horizon; one batched API request per run"
rate_limit: "the non-commercial public API documents limits of 600 calls/minute, 5,000 calls/hour, and 10,000 calls/day; this disabled source is configured for one batched request every six hours when approved"
licence: "CC BY 4.0; attribute Open-Meteo (https://open-meteo.com/) and preserve attribution to its upstream national weather providers where required"
attribution_required: true
