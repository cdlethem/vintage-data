name: noaa_ndbc_observations
script: fetch_noaa_ndbc_observations.py
args: ["--timeout", "30"]
schedule: "7 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 15
sink: local

# Algorithmic scheduling cadence: the load layer steps `schedule` between
# these bounds from what each run actually brought back (load/README.md).
# stations ingest every 10-30 min; storms move the surface faster, dead-calm
# nights and winter North Atlantic buoys less
cadence:
  auto: true
  min_minutes: 30
  max_minutes: 240

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "latest wind/wave/water/air observation per NDBC surface station (moored buoys, drifters, coastal stations); upstream ingests every 10-30 minutes and is polled hourly. Field units: directions degT (360 = no direction), speeds m/s, wave height m, periods s, pressures hPa, temperatures degC, visibility nmi, tide ft"
rate_limit: "no published limit; one directory listing plus ~950 small range-limited file requests per run, sequential with a descriptive User-Agent"
licence: "NOAA/NDBC data are U.S. Government works and generally public domain"
attribution: "NOAA National Data Buoy Center (NDBC), https://www.ndbc.noaa.gov/"
attribution_required: true
