name: bls_public_api
script: fetch_bls_public_api.py
# Keyless BLS requests use inclusive year bounds and may span at most 10 calendar years.
# The scheduled run defaults to the current UTC year; use --start-year/--end-year for
# bounded historical retrieval without adding registration keys or credentials.
args: []
schedule: "1 16 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Keep the declared daily schedule fixed; BLS revisions and releases are not an
# activity signal for adaptive scheduling.
cadence:
  auto: false

# Proposed enablement: do not merge or deploy until an authorized operator records
# a live BLS smoke covering all five configured series and a read-only Airflow
# import check of this candidate DAG; offline tests mock HTTP and do not read or mutate Airflow metadata.
# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily check after typical BLS release times; adaptive cadence disabled"
rate_limit: "anonymous public API: 25 queries/day and at most 10 inclusive calendar years per query"
licence: "US Bureau of Labor Statistics public data"
attribution: "U.S. Bureau of Labor Statistics, https://www.bls.gov/"
attribution_required: true
