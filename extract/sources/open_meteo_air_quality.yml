name: open_meteo_air_quality
script: fetch_open_meteo_air_quality.py
args: ["--past-days", "1", "--forecast-days", "2", "--timeout", "30"]
schedule: "13 19 * * *"  # UTC; CAMS model runs land every ~12h (global) / ~24h (Europe), so daily is well below the data's change rate
enabled: true
retries: 1
timeout_minutes: 5
sink: local

# Model revisions are not an activity signal; a fixed daily snapshot is the point.
cadence:
  auto: false

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily UTC snapshots of a fixed five-location basket, nine hourly variables, and a bounded four-day window (one past day, two forecast days); one batched API request per run"
rate_limit: "the non-commercial public API documents limits of 600 calls/minute, 5,000 calls/hour, and 10,000 calls/day; this source is configured for one batched request per day"
licence: "CC BY 4.0; attribute Open-Meteo (https://open-meteo.com/) and the CAMS/Copernicus Atmosphere Monitoring Service upstream"
attribution_required: true
