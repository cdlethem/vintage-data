name: open_meteo_air_quality
script: fetch_open_meteo_air_quality.py
args: ["--history-days", "3", "--batch-size", "10", "--timeout", "30", "--request-delay", "1"]
schedule: "35 8 * * *"  # UTC; the CAMS global model re-runs once per day, so a daily poll is conservative
enabled: true
retries: 1
timeout_minutes: 5
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily UTC snapshots of a fixed five-location basket (Beijing, Delhi, London, Los Angeles, Mexico City), eight hourly variables over a bounded three-day window ending today; one batched API request per run"
rate_limit: "the non-commercial public API documents limits of 600 calls/minute, 5,000 calls/hour, and 10,000 calls/day; this source is configured for one batched request per day"
licence: "CC BY 4.0; attribute Open-Meteo (https://open-meteo.com/) and its upstream Copernicus Atmosphere Monitoring Service"
attribution_required: true
