name: coingecko_markets
script: fetch_coingecko_markets.py
args: ["--per-page", "250", "--timeout", "30", "--retries", "2", "--retry-delay", "20"]
schedule: "27 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "top-250 coin prices/volumes/market caps move continuously; one snapshot per hour is enough for the series"
rate_limit: "free tier: ~100 calls/min with a 10,000 calls/month cap; 24 calls/day stays far under it"
licence: "CoinGecko free API — data as-is; free tier requires attribution"
attribution_required: true
