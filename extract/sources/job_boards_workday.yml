name: job_boards_workday
dag_factory: job_boards
provider: workday
script: fetch_job_boards.py
args: ["--providers", "workday", "--max-per-board", "10000", "--workers", "12"]
schedule: "15 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 120
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "Named-company Workday tenants provide the largest non-tech/global expansion: major employers, universities, hospitals and public agencies; live-verified 2026-09-04; independent provider task; poll daily. Full live run 2026-09-04: 875 tenants, 867 succeeded, 221,965 postings in 45 minutes, so the timeout allows generous headroom."
rate_limit: "public paginated endpoint; four concurrent HTTP requests maximum with a 150ms global request gap; daily polling"
licence: "public ATS board endpoints"
attribution_required: false
