name: usgs_earthquakes
script: fetch_usgs_earthquakes.py
args: []
schedule: "7,22,37,52 * * * *"  # UTC; proposed 15-minute schedule while disabled
enabled: false
retries: 2
timeout_minutes: 10
sink: local

# Do not enable until an operator records a successful live USGS source smoke and
# Airflow import checks. Confined verification is offline and must not mutate Airflow.
# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "all-day earthquake snapshots every 15 minutes; the official feed updates every minute"
rate_limit: "one bounded request per run to the non-paginated official GeoJSON feed"
licence: "USGS-authored data are public domain in the United States"
attribution: "U.S. Geological Survey (USGS) Earthquake Hazards Program, https://earthquake.usgs.gov/"
attribution_required: true
