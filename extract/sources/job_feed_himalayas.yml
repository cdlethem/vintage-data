name: job_feed_himalayas
script: fetch_job_feeds.py
args: ["himalayas", "--max-pages", "100"]
schedule: "45 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 30
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "Official cursor-paginated feed with roughly 102,000 indexed remote roles; pull the newest 2,000 daily, including geographic/timezone restrictions and structured pay. Live-verified 2026-09-04."
rate_limit: "100 sequential cursor requests once daily"
licence: "public Himalayas jobs API"
attribution_required: true
