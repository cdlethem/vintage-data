name: swpc_space_weather
script: fetch_swpc_space_weather.py
args: []
schedule: "5 */3 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "planetary K-index updates every 3 hours; the file is a trailing window (~58 rows) so every poll re-served rows already collected. Now checkpoints the newest ts per feed: verified 58 records cold, 0 on immediate re-run."
rate_limit: "one request per run; emits only rows past the stored watermark"
licence: "NOAA SWPC — public domain"
attribution_required: false
