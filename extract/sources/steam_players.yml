name: steam_players
script: fetch_steam_players.py
# The script's built-in basket is only 3 games; a wider basket makes a much
# richer concurrent-players time series. Positional args are Steam appids.
# CS2, Dota 2, PUBG, TF2, GTA V, Rust, Apex, Destiny 2, Helldivers 2,
# War Thunder, Baldur's Gate 3, Elden Ring.
args: ["730", "570", "578080", "440", "271590", "252490", "1172470", "1085660", "553850", "236390", "1086940", "1245620"]
schedule: "3-53/10 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Algorithmic scheduling cadence: the load layer steps `schedule` between
# these bounds from what each run actually brought back (load/README.md).
# a concurrent-players gauge always moves, so this pins to its floor by design
cadence:
  auto: true
  min_minutes: 10
  max_minutes: 60

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "genuinely continuous; strong daily/weekly rhythm plus release-day spikes"
rate_limit: "unpublished; poll a handful of games every few minutes, not in a tight loop"
licence: "unstated"
attribution_required: false
