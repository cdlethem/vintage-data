name: open_meteo_marine
script: fetch_open_meteo_marine.py
args: ["--past-days", "1", "--forecast-days", "1", "--batch-size", "10", "--timeout", "30", "--request-delay", "1"]
schedule: "27 * * * *"  # UTC; hourly, staggered; wave and SST fields revise with each model run
enabled: true
retries: 1
timeout_minutes: 5
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "hourly UTC snapshots of a fixed ten-point ocean basket (the open basins plus Mediterranean, North Sea and Barents Sea), six hourly variables over a 48-hour sliding window (24h analysis + 24h forecast); each (point, hour) is captured twice, first as forecast and then as analysis, so revisions show up as distinct records"
rate_limit: "keyless public API; Open-Meteo documents non-commercial limits of 600 calls/minute, 5,000 calls/hour and 10,000 calls/day; one batched request per hourly run (24/day) is far below them"
licence: "CC BY 4.0; attribute Open-Meteo (https://open-meteo.com/) and preserve attribution to its upstream model providers where required"
attribution: "Open-Meteo Marine API, https://open-meteo.com/ (wave fields from the Global Wave Forecast Model)"
attribution_required: true
