name: job_feed_arbeitnow
script: fetch_job_feeds.py
args: ["arbeitnow", "--max-pages", "8"]
schedule: "33 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 30
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "Public job-board API with strong Germany/Europe coverage and remote flags; newest roughly 1,400 roles daily. Live-verified 2026-09-04."
rate_limit: "eight sequential pages once daily; live testing observed 429 on the tenth rapid page, so the run stays below that threshold"
licence: "public Arbeitnow Job Board API"
attribution_required: true
