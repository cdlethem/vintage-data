rate_limit: "no documented limit on the keyless Gamma API (Cloudflare-fronted); ~40-60 requests per daily run"
licence: "no explicit data licence published; keyless public API mirroring on-chain (Polygon) trading records"
attribution: "Polymarket (Polymarket US Inc.), https://polymarket.com/"
attribution_required: true
