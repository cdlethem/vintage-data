name: socrata_civic
script: fetch_socrata_civic.py
args: []
schedule: "2-57/5 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Algorithmic scheduling cadence: the load layer steps `schedule` between
# these bounds from what each run actually brought back (load/README.md).
# publisher documents ~5 minute refreshes; a quiet night should not cost 288 empty polls
cadence:
  auto: true
  min_minutes: 5
  max_minutes: 60

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "Seattle Fire 911 feed is documented as updated ~every 5 minutes"
rate_limit: "anonymous throttled/shared pool; a free app token raises the limit"
licence: "Socrata/SODA — per-city open data licence"
attribution_required: false
