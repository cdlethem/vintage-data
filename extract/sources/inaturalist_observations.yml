name: inaturalist_observations
script: fetch_inaturalist_observations.py
# Taxon 3 is Aves. This is an explicitly bounded newest-first snapshot: at most
# 2 pages x 100 observations, not a historical or globally complete export.
args: ["--taxon-id", "3", "--per-page", "100", "--max-pages", "2", "--timeout", "30", "--retries", "2", "--retry-backoff", "1"]
schedule: "17 6 * * *"  # UTC; staggered daily rather than at midnight
# Deferred activation: keep paused until trusted review/merge evidence and the
# separately authorized --live integration gate are recorded for that revision.
enabled: false
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "staggered daily bounded snapshot of the newest 200 observations for configured taxon 3; not complete history"
rate_limit: "public keyless API; serial requests, at most 2 pages/run by configuration (hard maximum 10), 30-second timeout, bounded retries, and Retry-After handling"
licence: "observation and photo licences vary by record; preserve licence_code and photo attribution/licence metadata and follow iNaturalist terms"
attribution: "iNaturalist observers and media contributors; retain source uri and per-record attribution/licence metadata"
attribution_required: true
coverage_note: "Newest-first taxon-filtered snapshot only. Public coordinates may be obscured by iNaturalist; private locations are never requested. Media URLs/files are not collected. iNaturalist observations can overlap GBIF, so downstream modelling must deduplicate across sources."
