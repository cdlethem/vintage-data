name: statuspage_incidents
script: fetch_statuspage_incidents.py
args: []
schedule: "11-59/15 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Algorithmic scheduling cadence: the load layer steps `schedule` between
# these bounds from what each run actually brought back (load/README.md).
# incident history is mostly static between incidents
cadence:
  auto: true
  min_minutes: 15
  max_minutes: 720
  # Every incident record embeds the whole status page object, whose
  # `updated_at` moves on every poll: without excluding it, 50 unchanged
  # incidents measure as 100% new and the cadence never slows down.
  volatile_keys: [fetched_at, page.updated_at]

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "GitHub public statuspage incident history; sibling pages openai/dropbox via --page"
rate_limit: "keyless; documented as not rate-limited; five-minute floor"
licence: "public status page"
attribution_required: false
