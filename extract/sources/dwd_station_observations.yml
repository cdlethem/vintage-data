name: dwd_station_observations
script: fetch_dwd_station_observations.py
args: ["--retries", "2", "--retry-delay", "5", "--timeout", "30"]
schedule: "31 5 * * *"  # UTC
enabled: true
retries: 2
timeout_minutes: 20
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "hourly synoptic surface observations per station; DWD republishes the poi directory roughly every 10 minutes, so a daily poll at 05:31 UTC captures one full 24h window per station; per-station watermarks drop the overlapping hours"
rate_limit: "no published quota; ~974 small files (~7 MB) per run, fetched serially (~0.01 req/s); DWD stores the client IP for a maximum of 7 days per its open data terms"
licence: "DWD open data, free of charge without registration; terms of use https://www.dwd.de/EN/service/legal_notice/legal_notice_node.html"
attribution: "Deutscher Wetterdienst (DWD), synoptic station observations, https://opendata.dwd.de/weather/weather_reports/poi/"
attribution_required: true
