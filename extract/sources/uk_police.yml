name: uk_police
script: fetch_uk_police.py
args: []
schedule: "30 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

backfill:
  unit: month
  start: "2023-08"
  end: "2026-07"
  args: ["--month", "{yyyy}-{mm}"]
  pace_seconds: 5
  timeout_minutes: 10

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "monthly crime/outcome snapshots near Leicester; API currently exposes 36 months (2023-08 onward), configured for a paced historical backfill"
rate_limit: "no published limit"
licence: "Open Government Licence — attribution required"
attribution_required: true
