name: medicaid_open_data
script: fetch_medicaid_open_data.py
args: ["--page-size", "100", "--max-pages", "100", "--timeout", "30"]
schedule: "41 6 * * *"  # UTC; proposed daily catalog snapshot while disabled
enabled: false
retries: 1
timeout_minutes: 10
sink: local

# Disabled until a first live run and its warehouse load have been checked.
# Stateful runs retain exact NDJSON bytes locally and replay them only when payload
# IDs exactly represent every new or changed candidate watermark; unavailable
# historical bytes fail explicitly.
#
# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily complete catalog metadata snapshot; unchanged UUID/modified pairs are suppressed only after the next run verifies the exact prior stdout artifact by digest under the local raw landing path; missing evidence replays the retained byte-identical payload before newer catalog state"
rate_limit: "at most 100 serial requests per run with page-size capped at 100; normal historical catalog size requires only a few requests"
licence: "U.S. Centers for Medicare & Medicaid Services public catalog metadata; linked dataset and distribution terms may vary"
attribution: "Centers for Medicare & Medicaid Services, Medicaid Open Data, https://data.medicaid.gov/"
attribution_required: true
coverage_note: "Catalog metadata and public distribution links only; this extractor does not download distributions and must not be treated as Medicaid analytical measures. The historical count of 243 is not a fixed expected total."
