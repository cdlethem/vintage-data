name: CelesTrak live reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare reviewed CelesTrak table parser with official CSV
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out reviewed fixed-source validator
        uses: actions/checkout@v4
        with:
          ref: 2c6d925c8b0d8c0cb569ad31d9cf6999e09fdf8d
          path: validator
          persist-credentials: false
      - name: Check out reviewed candidate parser
        uses: actions/checkout@v4
        with:
          ref: e1142515d8bb12f127c44c26b61fe1d1f359ebfa
          path: candidate
          persist-credentials: false
      - name: Compare live fixed endpoints and actual candidate records
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import urllib.request
          from pathlib import Path
          from unittest import mock

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          validator = load("validator", Path("validator/extract/scripts/validate_celestrak_socrates.py"))
          candidate = load("candidate", Path("candidate/extract/scripts/fetch_celestrak_socrates.py"))
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), validator.NoRedirect())
          table_text = validator._download(opener, validator.TABLE_URL, {"text/html"}, validator.MAX_TABLE_BYTES)
          csv_text = validator._download(
              opener, validator.BASELINE_URL,
              {"text/csv", "text/plain", "application/octet-stream"}, validator.MAX_CSV_BYTES,
          )
          table = validator._table(table_text)
          baseline, total = validator._baseline(csv_text)
          if validator._coverage(table, "table") != validator._coverage(baseline, "baseline CSV"):
              raise validator.ValidationError("official table and CSV top-100 event coverage differs")
          with mock.patch.object(candidate, "_get", return_value=(table_text, 200, 1, len(table_text), 0.0)):
              parsed_table = list(candidate.fetch_conjunctions("maxProb", 100, "table"))
          with mock.patch.object(candidate, "_get", return_value=(csv_text, 200, 1, len(csv_text), 0.0)):
              parsed_csv = list(candidate.fetch_conjunctions("maxProb", 100, "csv"))
          identity = lambda row: (row["norad_id_1"], row["norad_id_2"], row["tca"])
          if ([identity(row) for row in parsed_table] != table
                  or [identity(row) for row in parsed_csv] != baseline):
              raise validator.ValidationError("reviewed candidate parser differs from official top-100 event coverage")
          print(json.dumps({
              "result": "passed", "table_rows": len(parsed_table), "baseline_rows": total,
              "matched_events": len(table), "candidate_head": "e1142515d8bb12f127c44c26b61fe1d1f359ebfa",
              "validator_head": "2c6d925c8b0d8c0cb569ad31d9cf6999e09fdf8d",
              "table_url": validator.TABLE_URL, "baseline_url": validator.BASELINE_URL,
          }, sort_keys=True))
          PY
