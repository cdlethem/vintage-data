name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRFLOW_HOME: /tmp/vintage-airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            bots/pyproject.toml
            load/requirements.txt
            transform/requirements.txt
      - name: Install test dependencies and the bots package
        run: |
          python -m pip install "apache-airflow==3.3.1" -r load/requirements.txt -r transform/requirements.txt pytest
          python -m pip install -e bots
      - name: Run bots, DAG, and extract suites
        run: python -m pytest -q bots orchestration extract
