version: 2
models:
- name: fct_infodengue_epidemiology
  description: Hourly latest epidemiological surveillance observations from the Infodengue city-alerts
    feed. The physical incremental fact retains one row at the source relation and provider record identifier
    grain, choosing the latest loaded replay for each identifier while preserving raw-load lineage and
    typed epidemiological measures.
  config:
    contract:
      enforced: true
    meta:
      grain: source_relation, record_id
      label: Infodengue epidemiology
      group_label: Infodengue
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: infodengue_observation_key
      vintage:
        visualization:
          dimension: municipality_name
          metric: average_incidence_per_100k
          time: fetched_at
          window_days: 30
          title: Mean observed incidence per 100k by municipality name
          description: Mean observed incidence per 100k by `municipality_name` in the selected observation
            window. Estimated incidence per 100,000 population. Each retained observation has equal weight;
            polling frequency and repeated snapshots can affect the mean. This is not a latest-value measure
            or an additive total.
          detail_fields:
          - fetched_at
          - record_id
          - municipality_name
          - incidence_per_100k
          - source_loaded_at
          sources:
          - '`infodengue` — licence: InfoDengue — attribution required; attribution required: True. Source
            configuration: `extract/sources/infodengue.yml`.'
          analysis:
            headline: how dengue incidence and case estimates move across epidemiological weeks and risk levels.
            event_time: week_start_date
            grain: WEEK
            controls:
            - municipality_name
            - disease
            - alert_level
            - incidence_level
            trends:
            - slug: weekly-incidence
              kind: total
              metric: average_incidence_per_100k
              time: week_start_date
              grain: WEEK
              window_days: 1095
              title: Mean incidence per 100k by epidemiological week
              description: Mean reported incidence per 100,000 across retained municipality observations in
                each epidemiological week over the latest three years. Incidence is a rate and is averaged,
                never summed; weeks with no retained observations are absent rather than zero.
              width: half
            - slug: weekly-municipalities
              kind: total
              metric: distinct_municipalities
              time: week_start_date
              grain: WEEK
              window_days: 1095
              title: Municipalities represented by epidemiological week
              description: Distinct `municipality_name` values represented in each epidemiological week over
                the latest three years. This is coverage of the source observations rather than a case count;
                missing weeks are absent rather than zero.
              width: half
            - slug: incidence-by-alert
              kind: composition
              metric: average_incidence_per_100k
              breakdown: alert_level
              top_n: 4
              time: week_start_date
              grain: WEEK
              window_days: 1095
              title: Incidence mix by alert level
              description: Mean incidence per 100,000 in each epidemiological week stacked by the provider
                `alert_level` over the latest three years. The four alert levels are all retained; segments
                are rates within each level, not additive totals.
              width: full
            - slug: cases-by-incidence-level
              kind: composition
              metric: average_cases_estimate
              breakdown: incidence_level
              top_n: 3
              time: week_start_date
              grain: WEEK
              window_days: 1095
              title: Mean estimated cases by incidence level
              description: Mean provider `cases_estimate` in each epidemiological week stacked by
                `incidence_level` over the latest three years. The three levels are all retained; averages
                describe reported values and must not be read as a sum of cases.
              width: full
  columns:
  - name: infodengue_observation_key
    description: Stable hash of the source relation and provider record identifier.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    config:
      meta:
        dimension:
          type: string
          label: Infodengue observation key
          hidden: true
  - name: source_relation
    description: Raw relation identifier supplied by the load layer.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source relation
          hidden: false
  - name: source_endpoint
    description: Upstream endpoint label that produced the source record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source endpoint
          hidden: false
  - name: record_id
    description: Provider record identifier defining the epidemiological observation grain.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Record id
          hidden: false
  - name: source_row_id
    description: Raw load row identifier for the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source row id
          hidden: true
  - name: source_batch_id
    description: Identifier of the extraction batch that produced the retained raw row.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source batch id
          hidden: true
  - name: source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source file
          hidden: true
  - name: source_file_row_number
    description: One-based row position of the observation within its raw extract file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Source file row number
          hidden: true
          format: '#,##0'
  - name: source_date
    description: Source partition date assigned by the load layer.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: Source date
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: extract_started_at
    description: Timestamp when extraction of the source batch began.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Extract started at
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: load_id
    description: Identifier of the load operation that inserted the retained raw row.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Load id
          hidden: true
  - name: source_loaded_at
    description: Timestamp when the load layer inserted the retained raw row.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: content_hash
    description: Hash of the original raw record content for replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Content hash
          hidden: true
  - name: fetched_at
    description: Timestamp when the upstream endpoint returned the source record.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Fetched at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: week_start_date
    description: Start date of the epidemiological week represented by the record.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: Week start date
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: epidemiological_week
    description: Provider epidemiological-week label.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Epidemiological week
          hidden: false
  - name: disease
    description: Disease represented by the surveillance observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Disease
          hidden: false
  - name: cases_estimate
    description: Estimated case count reported by the provider.
    data_type: double
    config:
      meta:
        metrics:
          average_cases_estimate:
            type: average
            label: Mean estimated cases
            description: Mean provider `cases_estimate` across retained municipality observations in the
              selected epidemiological window. This is an observation-weighted estimate and is not an
              additive case total.
            format: '#,##0.00'
        dimension:
          type: number
          label: Cases estimate
          hidden: false
          format: '#,##0.00'
  - name: cases_estimate_min
    description: Lower bound of the provider case estimate.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Cases estimate min
          hidden: false
          format: '#,##0.00'
  - name: cases_estimate_max
    description: Upper bound of the provider case estimate.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Cases estimate max
          hidden: false
          format: '#,##0.00'
  - name: cases_reported
    description: Reported case count supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Cases reported
          hidden: false
          format: '#,##0.00'
  - name: rt_probability
    description: Provider probability associated with the reproduction-number estimate.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Rt probability
          hidden: false
          format: '#,##0.00'
  - name: incidence_per_100k
    description: Estimated incidence per 100,000 population.
    data_type: double
    config:
      meta:
        metrics:
          average_incidence_per_100k:
            type: average
            label: Mean observed incidence per 100k
            description: Mean observed incidence per 100k by `municipality_name` in the selected observation
              window. Estimated incidence per 100,000 population. Each retained observation has equal
              weight; polling frequency and repeated snapshots can affect the mean. This is not a latest-value
              measure or an additive total.
            format: '#,##0.00'
        dimension:
          type: number
          label: Incidence per 100k
          hidden: false
          format: '#,##0.00'
  - name: locality_id
    description: Provider locality identifier.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Locality id
          hidden: false
  - name: alert_level
    description: Provider alert-level label.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Alert level
          hidden: false
  - name: model_version_date
    description: Date of the provider epidemiological model version.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: Model version date
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: municipality_name
    description: Municipality name published by the provider.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_municipalities:
            type: count_distinct
            label: Distinct municipality
            description: Distinct `municipality_name` values represented in the selected epidemiological
              window. This measures source coverage and does not count repeated weekly observations twice.
            format: '#,##0'
        dimension:
          type: string
          label: Municipality name
          hidden: false
  - name: reproduction_number
    description: Estimated effective reproduction number.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Reproduction number
          hidden: false
          format: '#,##0.00'
  - name: population
    description: Population used by the provider for epidemiological estimates.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Population
          hidden: false
          format: '#,##0.00'
  - name: temperature_min
    description: Minimum temperature measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Temperature min
          hidden: false
          format: '#,##0.00'
  - name: humidity_max
    description: Maximum humidity measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Humidity max
          hidden: false
          format: '#,##0.00'
  - name: receptive_status
    description: Provider receptivity status label.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Receptive status
          hidden: false
  - name: transmission_status
    description: Provider transmission status label.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Transmission status
          hidden: false
  - name: incidence_level
    description: Provider incidence-level label.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Incidence level
          hidden: false
  - name: humidity_mean
    description: Mean humidity measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Humidity mean
          hidden: false
          format: '#,##0.00'
  - name: humidity_min
    description: Minimum humidity measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Humidity min
          hidden: false
          format: '#,##0.00'
  - name: temperature_mean
    description: Mean temperature measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Temperature mean
          hidden: false
          format: '#,##0.00'
  - name: temperature_max
    description: Maximum temperature measure supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Temperature max
          hidden: false
          format: '#,##0.00'
  - name: probable_cases
    description: Probable case count supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Probable cases
          hidden: false
          format: '#,##0.00'
  - name: probable_cases_estimate
    description: Estimated probable case count supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Probable cases estimate
          hidden: false
          format: '#,##0.00'
  - name: probable_cases_estimate_min
    description: Lower bound of the probable-case estimate.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Probable cases estimate min
          hidden: false
          format: '#,##0.00'
  - name: probable_cases_estimate_max
    description: Upper bound of the probable-case estimate.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Probable cases estimate max
          hidden: false
          format: '#,##0.00'
  - name: confirmed_cases
    description: Confirmed case count supplied by the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Confirmed cases
          hidden: false
          format: '#,##0.00'
  - name: notifications_accumulated_year
    description: Notifications accumulated during the year according to the provider.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Notifications accumulated year
          hidden: false
          format: '#,##0.00'
  - name: geocode
    description: Geographic code published by the provider.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Geocode
          hidden: false
