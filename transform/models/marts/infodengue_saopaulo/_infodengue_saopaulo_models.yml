version: 2
models:
- name: fct_infodengue_saopaulo_epidemiology
  description: Hourly typed epidemiological surveillance observations for São Paulo from the Infodengue
    city-alerts feed. This physical incremental fact is at the source relation and provider record identifier
    grain, retaining the latest loaded replay and raw-load lineage for auditability.
  config:
    contract:
      enforced: true
    meta:
      grain: source_relation, record_id
      label: Infodengue saopaulo epidemiology
      group_label: Infodengue saopaulo
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: infodengue_saopaulo_8241bc
      vintage:
        visualization:
          dimension: municipality_name
          metric: average_incidence_per_100k
          time: fetched_at
          window_days: 30
          title: Mean observed incidence per 100k by municipality name
          description: Mean observed incidence per 100k by `municipality_name` in the selected observation
            window. Estimated incidence per 100,000 population. Each retained observation has equal weight;
            polling frequency and repeated snapshots can affect the mean. This is not a latest-value measure
            or an additive total.
          detail_fields:
          - fetched_at
          - record_id
          - municipality_name
          - incidence_per_100k
          - source_loaded_at
          sources:
          - '`infodengue_saopaulo` — see dbt raw-source lineage.'
          analysis:
            headline: Weekly epidemiological estimates show how São Paulo's burden changes, while alert and transmission statuses explain the shifts.
            event_time: week_start_date
            grain: WEEK
            controls:
            - alert_level
            - receptive_status
            - transmission_status
            - incidence_level
            trends:
            - slug: weekly-observations
              kind: total
              metric: distinct_observations
              time: week_start_date
              grain: WEEK
              title: Distinct epidemiological observations per week
              description: Distinct `record_id` values reported for each epidemiological week across the published history. This counts source observations rather than cases; missing weeks are absent rather than zero.
              width: half
            - slug: weekly-cases-estimate
              kind: total
              metric: average_cases_estimate
              time: week_start_date
              grain: WEEK
              title: Mean estimated cases by epidemiological week
              description: Mean provider `cases_estimate` for each epidemiological week across the published history. This is an estimate level, not an additive case total; missing weeks are absent rather than zero.
              width: half
            - slug: weekly-incidence
              kind: total
              metric: average_incidence_per_100k
              time: week_start_date
              grain: WEEK
              title: Mean incidence per 100k by epidemiological week
              description: Mean reported `incidence_per_100k` for each epidemiological week across the published history. Equal row weighting can reflect polling and revision patterns, so this is not a population-weighted rate; missing weeks are absent rather than zero.
              width: half
            - slug: cases-by-alert-level
              kind: breakdown
              metric: average_cases_estimate
              breakdown: alert_level
              top_n: 4
              time: week_start_date
              grain: WEEK
              title: Mean estimated cases by alert level
              description: Mean provider `cases_estimate` per epidemiological week for each `alert_level`. The four observed alert levels are retained; a line is not a sum of cases across statuses, and missing weeks are absent rather than zero.
              width: full
            - slug: cases-by-transmission
              kind: breakdown
              metric: average_cases_estimate
              breakdown: transmission_status
              top_n: 2
              time: week_start_date
              grain: WEEK
              title: Mean estimated cases by transmission status
              description: Mean provider `cases_estimate` per epidemiological week for each `transmission_status`. The two observed statuses are shown as separate trajectories rather than additive totals; missing weeks are absent rather than zero.
              width: full
  columns:
  - name: infodengue_saopaulo_observation_key
    description: Stable hash of the source relation and provider record identifier.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    config:
      meta:
        dimension:
          type: string
          label: Infodengue saopaulo observation key
          hidden: true
          name: infodengue_saopaulo_8241bc
  - name: source_relation
    description: Raw relation identifier that supplied the observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source relation
          hidden: false
  - name: source_endpoint
    description: Upstream endpoint label that produced the source record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source endpoint
          hidden: false
  - name: record_id
    description: Provider record identifier defining the observation grain.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_observations:
            type: count_distinct
            label: Distinct epidemiological observations
            description: Distinct `record_id` values present in each time group. Repeated source rows do not inflate the count.
            format: '#,##0'
        dimension:
          type: string
          label: Record id
          hidden: false
  - name: source_row_id
    description: Raw load row identifier for the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source row id
          hidden: true
  - name: source_batch_id
