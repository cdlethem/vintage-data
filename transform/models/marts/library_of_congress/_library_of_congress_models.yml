version: 2
models:
- name: fct_library_of_congress_item_observation
  description: >-
    Physical observation fact for the bounded Library of Congress robotics books search. Each row is one
    source, stable item identifier, and UTC collection timestamp (`observed_at`). The configured query is a
    changing ranked slice of at most 200 observations per run, not a catalogue census. Repeated snapshots
    preserve later catalogue and ranking changes; `item_date` is free-form source text and is not event time.
  config:
    contract:
      enforced: true
    meta:
      grain: source, item_id, observed_at
      label: Library of Congress item observation
      group_label: Library of Congress
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: library_of_congress_item_observation_key
      vintage:
        visualization:
          dimension: digitized
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct items by reported digitized status
          description: Distinct `item_id` values by the digitized status reported by the Library of Congress
            among observations collected in the past 30 UTC days. Repeated snapshots count once within each
            status, but an item whose status changes can occur in multiple groups; groups are not additive
            and do not represent a catalogue census.
          detail_fields:
          - observed_at
          - item_id
          - title
          - digitized
          - item_date
          - canonical_url
          - source_loaded_at
          sources:
          - 'Data provided by the Library of Congress. `library_of_congress` — licence: Library of Congress
            catalog metadata; attribution required: True. Source configuration:
            `extract/sources/library_of_congress.yml`. Rights for linked collection material vary by item;
            consult the item-specific rights and access statement before reuse.'
          analysis:
            headline: how item and title coverage and reported digitization vary across daily observations
              of the changing bounded robotics search slice.
            event_time: observed_at
            grain: DAY
            controls:
            - digitized
            trends:
            - slug: observed-items
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              window_days: 30
              title: Distinct items by collection day
              description: Distinct `item_id` values present in each UTC `observed_at` collection day during
                the past 30 days. This measures the changing ranked slice, not new catalogue items or a
                catalogue census; missing collection days are absent rather than zero and repeated snapshots
                are not summed.
              width: half
            - slug: observed-titles
              kind: total
              metric: distinct_titles
              time: observed_at
              grain: DAY
              window_days: 30
              title: Distinct titles by collection day
              description: Distinct non-null `title` values present in each UTC `observed_at` collection day
                during the past 30 days. Titles are source labels rather than stable identifiers; missing
                collection days are absent rather than zero and repeated snapshots are not summed.
              width: half
            - slug: digitization-mix
              kind: composition
              metric: distinct_entities
              breakdown: digitized
              top_n: 3
              time: observed_at
              grain: DAY
              window_days: 30
              title: Reported digitized status by collection day
              description: Distinct `item_id` values by reported digitized status for each UTC collection day
                in the past 30 days. Repeated snapshots count once per day and status group; status groups are
                not additive across the window, and missing collection days are absent rather than zero.
              width: full
  columns:
  - name: library_of_congress_item_observation_key
    description: Stable hash of source, item identifier, and observation timestamp defining the row grain.
    data_type: varchar
    data_tests:
    - not_null
    - unique
    config:
      meta:
        dimension:
          type: string
          label: Library of Congress item observation key
          hidden: true
  - name: source
    description: Source identifier supplied by the extractor.
    data_type: varchar
    data_tests:
    - not_null
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: item_id
    description: Stable Library of Congress item identifier returned by the API.
    data_type: varchar
    data_tests:
    - not_null
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct items
            description: Distinct `item_id` values in each selected collection-time and dimension group;
              repeated snapshots count once within a group.
            format: '#,##0'
        dimension:
          type: string
          label: Item id
          hidden: false
  - name: observed_at
    description: UTC collection timestamp when the extractor observed the item; this is not source event time.
    data_type: timestamp with time zone
    data_tests:
    - not_null
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: title
    description: Item title supplied by the Library of Congress API, when present.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_titles:
            type: count_distinct
            label: Distinct titles
            description: Distinct non-null source title values in each selected collection-time and dimension
              group; titles are labels and are not stable item identifiers.
            format: '#,##0'
        dimension:
          type: string
          label: Title
          hidden: false
  - name: item_date
    description: Free-form primary date label supplied by the API, when present; it is not event time.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Item date
          hidden: false
  - name: dates
    description: JSON array of free-form date values associated with the item; these are not an event-time axis.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Dates
          hidden: true
          sql: CAST(${TABLE}.dates AS VARCHAR)
  - name: contributors
    description: JSON array of contributor values associated with the item.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Contributors
          hidden: true
          sql: CAST(${TABLE}.contributors AS VARCHAR)
  - name: subjects
    description: JSON array of subject values associated with the item.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Subjects
          hidden: true
          sql: CAST(${TABLE}.subjects AS VARCHAR)
  - name: digitized
    description: Whether the API reports that the item is digitized, when supplied.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Digitized
          hidden: false
  - name: online_formats
    description: JSON array of online format labels reported for the item.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Online formats
          hidden: true
          sql: CAST(${TABLE}.online_formats AS VARCHAR)
  - name: mime_types
    description: JSON array of MIME types reported for the item.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Mime types
          hidden: true
          sql: CAST(${TABLE}.mime_types AS VARCHAR)
  - name: canonical_url
    description: Canonical Library of Congress item URL returned by the API.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Canonical url
          hidden: false
  - name: resources
    description: Complete JSON resource metadata returned by the API; linked content is not downloaded.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Resources
          hidden: true
          sql: CAST(${TABLE}.resources AS VARCHAR)
  - name: resource_links
    description: JSON array of resource URLs found in API metadata; the extractor does not request them.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Resource links
          hidden: true
          sql: CAST(${TABLE}.resource_links AS VARCHAR)
  - name: raw_item
    description: Complete Library of Congress API item object retained for schema evolution and audit.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Raw item
          hidden: true
          sql: CAST(${TABLE}.raw_item AS VARCHAR)
  - name: source_payload
    description: Complete extractor record retained by the raw loader.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Source payload
          hidden: true
          sql: CAST(${TABLE}.source_payload AS VARCHAR)
  - name: source_row_id
    description: Raw load row identifier for the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source row id
          hidden: true
  - name: source_batch_id
    description: Identifier of the extract batch that supplied the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source batch id
          hidden: true
  - name: source_file
    description: Raw source file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source file
          hidden: true
  - name: source_file_row_number
    description: One-based row position of the retained observation in its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Source file row number
          hidden: true
          format: '#,##0'
  - name: source_date
    description: Source partition date assigned by the load layer.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: Source date
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: extract_started_at
    description: UTC timestamp when extraction of the retained source batch started.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Extract started at
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: load_id
    description: Identifier of the load operation that inserted the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Load id
          hidden: true
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest load timestamp represented by matching mart observations.
  - name: content_hash
    description: Hash of the original raw extractor record for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Content hash
          hidden: true
