          hidden: false
  - name: local_authority_code
    description: Local authority code reported for the establishment.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Local authority code
          hidden: false
  - name: local_authority_name
    description: Local authority name reported for the establishment.
    data_type: varchar
