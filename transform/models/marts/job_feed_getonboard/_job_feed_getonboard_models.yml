version: 2
models:
- name: fct_job_feed_getonboard
  description: Daily physical history of GetOnBoard job observations. Each row represents one GetOnBoard
    job identifier from one extractor observation timestamp; repeated ingestion of the same observation
    is reduced to the latest loaded copy while load-layer lineage remains available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job feed getonboard
      group_label: Job feed getonboard
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_feed_getonboard_key
      vintage:
        visualization:
          dimension: department
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by department
          description: Distinct `job_id` values by `department` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - department
          - source_loaded_at
          sources:
          - '`job_feed_getonboard` — licence: public Get on Board API; attribution required: True. Source
            configuration: `extract/sources/job_feed_getonboard.yml`.'
          analysis:
            headline: how the GetOnBoard catalogue level and department mix change across observation days.
            event_time: posted_at
            grain: DAY
            controls:
            - department
            - location
            - is_remote
            - location_country
            trends:
            - slug: jobs-observed
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Distinct jobs observed per day
              description: Distinct `job_id` values present in the GetOnBoard feed on each observation day. This
                is a level rather than a flow because the feed republishes its catalogue; days with no successful
                extract are absent rather than zero.
              width: half
            - slug: departments-observed
              kind: total
              metric: distinct_departments
              time: observed_at
              grain: DAY
              title: Departments represented per day
              description: Distinct non-null `department` values represented in the feed on each observation day.
                This is a catalogue level, not a count of newly active departments, and absent extract days are
                absent rather than zero.
              width: half
            - slug: jobs-by-department
              kind: breakdown
              metric: distinct_entities
              breakdown: department
              top_n: 8
              time: observed_at
              grain: DAY
              title: Distinct jobs by department
              description: Distinct `job_id` values per observation day split across the eight departments with
                the largest catalogue counts. Remaining departments are excluded rather than aggregated, and the
                lines show catalogue levels rather than new postings.
              width: full
            - slug: source-posted-jobs
              kind: total
              metric: distinct_entities
              time: posted_at
              grain: DAY
              title: Jobs by source publication day
              description: Distinct `job_id` values grouped by the source `posted_at` day. All supplied timestamps
                fall on 1970-01-21, so this is one event-time snapshot rather than a longitudinal posting history;
                it should not be read as current publication volume.
              width: full
  columns:
  - name: job_feed_getonboard_key
    description: Stable hash of the GetOnBoard source, job identifier, and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job feed getonboard key
          hidden: true
  - name: source
    description: Upstream source identifier carried by the GetOnBoard response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: GetOnBoard identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `department` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this job in the GetOnBoard feed.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Provider label carried by the GetOnBoard job record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Department or discipline reported for the job listing.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_departments:
            type: count_distinct
            label: Distinct departments
            description: Distinct non-null `department` values represented on each observation day. This is a
              catalogue level and does not count newly active departments.
            format: '#,##0'
        dimension:
          type: string
          label: Department
          hidden: false
  - name: experience_level
    description: Structured experience or seniority value reported by GetOnBoard.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Experience level
          hidden: true
          sql: CAST(${TABLE}.experience_level AS VARCHAR)
  - name: location
    description: Candidate location text reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: workplace_type
    description: Structured workplace modality reported by GetOnBoard.
    data_type: json
    config:
      meta:
        dimension:
          type: string
          label: Workplace type
          hidden: true
          sql: CAST(${TABLE}.workplace_type AS VARCHAR)
  - name: is_remote
    description: Whether GetOnBoard identifies the job as remote.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is remote
          hidden: false
  - name: posted_at
    description: UTC publication timestamp supplied by GetOnBoard for the job posting.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Public GetOnBoard URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: salary_min
    description: Lower bound of the advertised salary range when supplied.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary min
          hidden: false
          format: '#,##0'
  - name: salary_max
    description: Upper bound of the advertised salary range when supplied.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary max
          hidden: false
          format: '#,##0'
  - name: description
    description: Job description text supplied by GetOnBoard.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Description
          hidden: true
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the retained observation in its raw extract file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
