version: 2
models:
- name: fct_job_feed_remoteok
  description: Daily physical history of Remote OK job observations. Each row represents one Remote OK
    job identifier as observed in one extractor response at an observed timestamp; repeated raw ingestion
    of the same observation is reduced to the latest loaded copy while load-layer lineage is retained
    for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job feed remoteok
      group_label: Job feed remoteok
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_feed_remoteok_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_feed_remoteok` — licence: Remote OK public API terms; attribution required: True. Source
            configuration: `extract/sources/job_feed_remoteok.yml`.'
          analysis:
            headline: how the four-day Remote OK catalogue level and recent posting mix change across companies and locations.
            event_time: posted_at
            grain: DAY
            controls:
            - company
            - department
            - location
            - location_country
            trends:
            - slug: catalogue-level
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Jobs present in the catalogue each day
              description: Distinct `job_id` values present in the feed on each observation day. This is a
                catalogue level rather than a count of new postings because the feed republishes listings
                and repeated observations are deduplicated within each day. Days without a successful extract
                are absent rather than zero.
              width: half
            - slug: posted-day-history
              kind: total
              metric: distinct_entities
              time: posted_at
              grain: DAY
              title: Jobs by publisher posted day
              description: Distinct `job_id` values grouped by the publisher's posted day across retained
                observations. This is not a new-posting count because a listing can recur in later snapshots;
                posted days with no matching records are absent rather than zero.
              width: half
            - slug: company-levels
              kind: breakdown
              metric: distinct_entities
              breakdown: company
              top_n: 6
              time: observed_at
              grain: DAY
              title: Catalogue jobs by leading company
              description: Distinct `job_id` values per observation day for the six companies with the
                largest retained job presence. The remainder is excluded rather than aggregated, and this
                is a catalogue level rather than a flow; days without an extract are absent rather than zero.
              width: half
            - slug: department-mix
              kind: composition
              metric: distinct_companies
              breakdown: department
              top_n: 6
              time: posted_at
              grain: DAY
              title: Hiring-company mix by posting day and department
              description: Distinct non-null `company` values per publisher posted day, stacked by the six
                largest `department` values. The remainder is excluded rather than aggregated; repeated
                listings can recur, so this shows observed mix rather than unique organizations over the
                full history. Posted days with no matching records are absent rather than zero.
              width: full
  columns:
  - name: job_feed_remoteok_key
    description: Stable hash of the upstream source, Remote OK job identifier, and extractor observation
      timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job feed remoteok key
          hidden: true
  - name: source
    description: Upstream source label carried by the Remote OK response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: Remote OK identifier assigned to the job listing.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor fetched this job observation.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Provider or feed label reported by the Remote OK response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Company or organization advertising the job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct hiring company
            description: Distinct non-null `company` values represented in the selected observations. This
              counts organizations rather than postings and can repeat an organization across snapshots.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: title
    description: Job title reported by Remote OK.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Comma-separated department or skill tags reported for the listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Department
          hidden: false
  - name: location
    description: Location text reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when supplied.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: workplace_type
    description: Workplace arrangement reported by Remote OK, such as remote.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Workplace type
          hidden: false
  - name: is_remote
    description: Whether Remote OK marks the job as remote.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is remote
          hidden: false
  - name: posted_at
    description: UTC timestamp when the job was posted according to Remote OK.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Canonical URL for the Remote OK job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: salary_min
    description: Lower bound of the advertised salary range when supplied.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary min
          hidden: false
          format: '#,##0'
  - name: salary_max
    description: Upper bound of the advertised salary range when supplied.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary max
          hidden: false
          format: '#,##0'
  - name: description
    description: Full job description text reported by Remote OK.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Description
          hidden: true
  - name: _batch_id
    description: Identifier of the extract batch that produced the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Identifier of the load job that inserted the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the retained observation in its raw extract file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Load-layer hash of the retained raw record content for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
