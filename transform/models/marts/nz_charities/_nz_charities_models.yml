version: 2
models:
- name: fct_nz_charities
  description: Physical daily snapshot of New Zealand Charities Register organisation observations. Each
    row is one source, organisation identifier, and UTC fetch timestamp, with published organisation attributes,
    the complete raw payload, and load lineage retained. This is SCD2-like observation history without validity
    ranges, not a current-state table. Replay copies at the same grain are resolved to the latest loaded file row.
    New Zealand Charities Register data is licensed CC BY 3.0 NZ; attribution required.
  config:
    contract:
      enforced: true
    meta:
      grain: source, id, fetched_at
      label: Nz charities
      group_label: Nz charities
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: charity_observation_key
      vintage:
        visualization:
          dimension: registrationstatus
          metric: distinct_entities
          time: fetched_at
          window_days: 30
          title: Distinct charities by registration status
          description: Distinct `id` values by `registrationstatus` among observations fetched in the rolling
            30-day UTC window. Repeated observations of an entity count once within each group. An entity that
            changed category can appear in multiple groups; this distinct-entity count is non-additive and is
            not a current-state census. New Zealand Charities Register data is licensed CC BY 3.0 NZ; attribution required.
          detail_fields:
          - fetched_at
          - id
          - registrationstatus
          - source_loaded_at
          sources:
          - 'New Zealand Charities Register data (`nz_charities`) — licensed CC BY 3.0 NZ; attribution
            required. Source configuration: `extract/sources/nz_charities.yml`.'
          analysis:
            headline: when registered charities are revised and how their published overseas-spending
              profile varies by organisation type.
            event_time: modifiedon
            grain: DAY
            controls:
            - postaladdresscity
            - legalstructure
            - organisationaltype
            - ethniccharity
            trends:
            - slug: modified-charities
              kind: total
              metric: distinct_entities
              time: modifiedon
              grain: DAY
              title: Charities revised per source day
              description: Distinct `id` values by the source `modifiedon` UTC day during the rolling 30-day
                event-time window. This non-additive distinct-entity count measures represented revisions,
                not new registrations or a current census; absent days are not zero. New Zealand Charities
                Register data is licensed CC BY 3.0 NZ; attribution required.
              time_label: Source modified on (UTC day)
              window_days: 30
              width: half
            - slug: overseas-spending
              kind: total
              metric: average_percentagespentoverseas
              time: modifiedon
              grain: DAY
              title: Reported overseas spending share by revision day
              description: Mean non-null `percentagespentoverseas` in percentage points by source `modifiedon`
                UTC day during the rolling 30-day event-time window. The observation-weighted average excludes
                unreported values, is non-summable across snapshots or groups, and absent days are not zero.
                New Zealand Charities Register data is licensed CC BY 3.0 NZ; attribution required.
              time_label: Source modified on (UTC day)
              window_days: 30
              width: half
            - slug: revisions-by-legal-structure
              kind: breakdown
              metric: distinct_entities
              breakdown: legalstructure
              top_n: 7
              time: modifiedon
              grain: DAY
              title: Modified charities by legal structure
              description: Distinct `id` values revised on each source `modifiedon` UTC day during the rolling
                30-day event-time window, split across the seven largest legal-structure groups. The remainder
                is excluded; groups are non-additive and do not form a current census. New Zealand Charities
                Register data is licensed CC BY 3.0 NZ; attribution required.
              time_label: Source modified on (UTC day)
              window_days: 30
              width: full
            - slug: registrations-by-city
              kind: composition
              metric: distinct_entities
              breakdown: postaladdresscity
              top_n: 8
              time: dateregistered
              grain: DAY
              title: Registered charities by city and registration day
              description: Distinct `id` values by source `dateregistered` UTC day during the rolling 30-day
                event-time window, stacked across the eight largest postal cities. The remainder is excluded;
                this is a registration flow, not a snapshot census, and absent days are not zero. New Zealand
                Charities Register data is licensed CC BY 3.0 NZ; attribution required.
              time_label: Source registered on (UTC day)
              window_days: 30
              width: full
  columns:
  - name: charity_observation_key
    description: Stable hash of the source identifier, charity identifier, and fetch timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Charity observation key
          hidden: true
  - name: source
