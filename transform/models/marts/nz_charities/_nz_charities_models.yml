version: 2
models:
- name: fct_nz_charities
  description: Physical daily snapshot of New Zealand Charities Register organisation observations. Each
    row is one source, organisation identifier, and fetch timestamp; `fetched_at` is the UTC observation
    time, while `modifiedon` is the source-record revision event and `dateregistered` is the original
    registration event. Published organisation attributes and nested register details are retained alongside
    load lineage. Repeated copies of the same observation grain are resolved to the latest loaded file row;
    this is a snapshot/SCD2-style history, not a current-state census.
  config:
    contract:
      enforced: true
    meta:
      grain: source, id, fetched_at
      label: Nz charities
      group_label: Nz charities
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: charity_observation_key
      vintage:
        visualization:
          dimension: registrationstatus
          metric: distinct_entities
          time: fetched_at
          window_days: 30
          description: Non-additive distinct count of `id` values by `registrationstatus` among observations
            in the selected window. Repeated observations of an entity count once within each group. An
            entity that changed category can appear in multiple groups; do not sum groups or interpret this
            as a current-state census.
          detail_fields:
          - fetched_at
          - id
          - registrationstatus
          - source_loaded_at
          sources:
          - '`nz_charities` — licence: CC BY 3.0 NZ; attribution required: True. Source configuration:
            `extract/sources/nz_charities.yml`.'
          analysis:
            headline: when registered charities are revised and how their published overseas-spending
              profile varies by organisation type.
            event_time: modifiedon
            grain: DAY
            controls:
            - postaladdresscity
            - legalstructure
            - organisationaltype
            - ethniccharity
            trends:
            - slug: modified-charities
              kind: total
              metric: distinct_entities
              time: modifiedon
              grain: DAY
              title: Charities modified per day
              description: Non-additive distinct count of `id` values by `modifiedon` day. This counts
                registered entities whose source record was revised, not newly registered charities; days
                with no revision are absent rather than zero.
              width: half
            - slug: overseas-spending
              kind: total
              metric: average_percentagespentoverseas
              time: modifiedon
              grain: DAY
              title: Reported overseas spending share by revision day
              description: Mean non-null `percentagespentoverseas`, in percentage points, among records by
                `modifiedon` day. It is non-summable and describes only reporting organisations; days with
                no reported value are absent rather than zero.
              width: half
            - slug: revisions-by-legal-structure
              kind: breakdown
              metric: distinct_entities
              breakdown: legalstructure
              top_n: 7
              time: modifiedon
              grain: DAY
              title: Modified charities by legal structure
              description: Non-additive distinct count of `id` values revised on each `modifiedon` day,
                compared across the largest legal-structure groups. The remaining structures are excluded
                rather than aggregated; this is revision activity, not a current census.
              width: full
            - slug: registrations-by-city
              kind: composition
              metric: distinct_entities
              breakdown: postaladdresscity
              top_n: 8
              time: dateregistered
              grain: DAY
              title: Registered charities by city and registration day
              description: Non-additive distinct count of `id` values stacked by postal city on each
                `dateregistered` day. Bars show the mix among the eight largest cities and exclude the
                remainder rather than aggregating it; a missing day means no registrations in the mart.
              width: full
  columns:
  - name: charity_observation_key
    description: Stable hash of the source identifier, charity identifier, and fetch timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Charity observation key
          hidden: true
  - name: source
    description: Upstream register endpoint or feed name that produced the observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: id
    description: Charity identifier reported by the New Zealand Charities Register. Use `distinct_entities`,
      not a row count, because this physical daily snapshot repeats an entity across fetches.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct id
            description: Non-additive distinct count of `id` values by `registrationstatus` among observations
              in the selected window. Repeated observations of an entity count once within each group. An
              entity that changed category can appear in multiple groups; do not sum groups or interpret this
              as a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Id
          hidden: false
  - name: fetched_at
    description: UTC timestamp at which the source organisation record was fetched; observation time in the
      physical daily snapshot, distinct from source revision and registration event times.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Fetched at
          hidden: false
          time_intervals:
