            label: Distinct charities
            description: Distinct `id` values represented by matching observations. Repeated snapshots of an
              entity count once within each group, but an entity that changes category can appear in multiple
              groups. This distinct-entity count is non-additive and is not a current-state census.
            format: '#,##0'
