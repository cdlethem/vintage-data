version: 2
models:
- name: fct_job_boards_smartrecruiters
  description: Daily physical history of job observations returned by SmartRecruiters applicant-tracking-system
    boards. Each row represents one upstream source, job identifier, and extractor observation timestamp;
    repeated raw copies of an observation are reduced to the latest loaded lineage record while listing
    attributes and load metadata remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job boards smartrecruiters
      group_label: Job boards smartrecruiters
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_boards_smartrecruiters_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_boards_smartrecruiters` — licence: public ATS board endpoints; attribution required:
            False. Source configuration: `extract/sources/job_boards_smartrecruiters.yml`.'
          analysis:
            headline: how the published SmartRecruiters catalogue and posting mix change across companies and work arrangements.
            event_time: posted_at
            grain: MONTH
            controls:
            - company_country
            - company_industry
            - employment_type
            - experience_level
            trends:
            - slug: observed-jobs
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Jobs present in the catalogue per observation day
              description: Distinct `job_id` values present in the SmartRecruiters feed on each extractor
                observation day. This is a catalogue level rather than a posting flow — it moves when jobs
                are added or withdrawn. The four observed days are shown; days without a successful extract
                are absent rather than zero.
              width: half
            - slug: posted-jobs
              kind: total
              metric: distinct_entities
              time: posted_at
              grain: MONTH
              title: Jobs posted per month
              description: Distinct `job_id` values by the month SmartRecruiters reports in `posted_at`,
                over the full published history. This is a posting flow rather than a current catalogue
                snapshot; months with no dated postings are absent rather than zero.
              width: half
            - slug: posted-companies
              kind: total
              metric: distinct_companies
              time: posted_at
              grain: MONTH
              title: Hiring companies posting per month
              description: Distinct non-null `company` values by SmartRecruiters `posted_at` month over the
                full published history. This measures the breadth of posting companies, not the number of
                new companies; months with no dated postings are absent rather than zero.
              width: half
            - slug: postings-by-country
              kind: breakdown
              metric: distinct_entities
              breakdown: company_country
              top_n: 8
              time: posted_at
              grain: MONTH
              title: Jobs posted per month by company country
              description: Distinct `job_id` values by SmartRecruiters `posted_at` month, pivoted by
                `company_country`. The eight largest countries by metric are retained and smaller countries
                are excluded rather than aggregated. This is a flow and not a count of currently open jobs.
              width: full
            - slug: posting-mix-by-employment
              kind: composition
              metric: distinct_entities
              breakdown: employment_type
              top_n: 5
              time: posted_at
              grain: MONTH
              title: Monthly posting mix by employment type
              description: Distinct `job_id` values by `posted_at` month stacked by `employment_type`. All
                five observed employment types are retained, so bar segments show how the posting mix
                changes; null employment values are absent rather than zero.
              width: full
  columns:
  - name: job_boards_smartrecruiters_key
    description: Stable hash of the SmartRecruiters source, job identifier, and extractor observation
      timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job boards smartrecruiters key
          hidden: true
  - name: source
    description: Upstream source label carried by the SmartRecruiters job-board response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: SmartRecruiters identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this job listing.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Job-board provider label reported by the upstream response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Hiring company name reported by the SmartRecruiters board.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct company
            description: Distinct non-null `company` values among SmartRecruiters observations in each
              selected time and dimension group. This counts the breadth of hiring companies rather than
              postings.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: company_country
    description: Country associated with the hiring company when supplied by SmartRecruiters.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company country
          hidden: false
  - name: company_industry
    description: Industry label associated with the hiring company when supplied by SmartRecruiters.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company industry
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Department or discipline reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Department
          hidden: false
  - name: employment_type
    description: Employment arrangement reported for the job listing, such as full-time or contract.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Employment type
          hidden: false
  - name: experience_level
    description: Experience level reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Experience level
          hidden: false
  - name: location
    description: Free-text candidate location reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: workplace_type
    description: Workplace arrangement reported for the job listing when supplied.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Workplace type
          hidden: false
  - name: is_remote
    description: Whether SmartRecruiters marks the job listing as remote.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is remote
          hidden: false
  - name: posted_at
    description: UTC timestamp when the job was posted according to SmartRecruiters.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Public SmartRecruiters URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the observation in its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
