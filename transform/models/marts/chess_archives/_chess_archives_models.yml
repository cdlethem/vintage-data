version: 2
models:
- name: fct_chess_archives_games
  description: Daily physical fact of Chess.com archive games from the chess_archives extraction. Each
    row is one player and game identifier; repeated append-only copies are reduced to the latest loaded
    record while game attributes and raw-load lineage remain available for audit.
  config:
    contract:
      enforced: true
    meta:
      grain: player_user, game_id
      label: Chess archives games
      group_label: Chess archives
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: chess_archive_key
      vintage:
        visualization:
          dimension: player_result
          metric: distinct_entities
          time: fetched_at
          window_days: 30
          title: Distinct game by player result
          description: Distinct `game_id` values by `player_result` among observations in the selected
            window. Repeated observations of an entity count once within each group. An entity that changed
            category can appear in multiple groups; these groups are not additive and do not represent
            a current-state census.
          detail_fields:
          - fetched_at
          - game_id
          - player_result
          - source_loaded_at
          sources:
          - '`chess_archives` — licence: chess.com public API; attribution required: False. Source configuration:
            `extract/sources/chess_archives.yml`.'
          analysis:
            headline: how recorded chess volume, time controls, results, and player strength shift over game history.
            event_time: ended_at
            grain: MONTH
            controls:
            - time_class
            - player_result
            - player_color
            - is_rated
            trends:
            - slug: games-ended
              kind: total
              metric: distinct_entities
              time: ended_at
              grain: MONTH
              title: Distinct games ended per month
              description: Distinct `game_id` values by `ended_at` month. This is a completed-game flow rather
                than a snapshot level; months without archived games are absent rather than zero.
              width: half
            - slug: games-by-time-class
              kind: breakdown
              metric: distinct_entities
              breakdown: time_class
              top_n: 4
              time: ended_at
              grain: MONTH
              title: Games ended per month by time class
              description: Distinct games by `time_class` and `ended_at` month. All four observed time classes
                are shown; sparse months have fewer series because absent source rows are not zeroes.
              width: full
            - slug: result-mix
              kind: composition
              metric: distinct_entities
              breakdown: player_result
              top_n: 8
              time: ended_at
              grain: MONTH
              title: Monthly game mix by player result
              description: Distinct games stacked by the archived player's `player_result` and `ended_at`
                month. The eight largest results are shown; smaller results are excluded rather than
                aggregated, so the stack is not the full game total.
              width: full
            - slug: rating-by-time-class
              kind: breakdown
              metric: average_player_rating
              breakdown: time_class
              top_n: 4
              time: ended_at
              grain: MONTH
              title: Mean player rating by time class
              description: Mean reported `player_rating` by `time_class` and game `ended_at` month. This is
                an observation-weighted rating level, not a rating change for a fixed player; absent rows are
                missing rather than zero.
              width: full
  columns:
  - name: chess_archive_key
    description: Stable hash of the Chess.com player user and game identifier.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    config:
      meta:
        dimension:
          type: string
          label: Chess archive key
          hidden: true
  - name: archive_source
    description: Raw source relation identifier for this archive record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Archive source
          hidden: false
  - name: source_system
    description: Upstream source type reported by the archive record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source system
          hidden: false
  - name: game_id
    description: Chess.com identifier for the recorded game.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct game
            description: Distinct `game_id` values by `player_result` among observations in the selected
              window. Repeated observations of an entity count once within each group. An entity that
              changed category can appear in multiple groups; these groups are not additive and do not
              represent a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Game id
          hidden: false
  - name: fetched_at
    description: UTC timestamp when the extractor fetched the archive record.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Fetched at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: player_user
    description: Chess.com user identifier associated with the archive record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Player user
          hidden: false
  - name: player_color
    description: Color played by the archived user.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Player color
          hidden: false
  - name: started_at
    description: UTC timestamp when the game started, when reported.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Started at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: ended_at
    description: UTC timestamp when the game ended.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Ended at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: duration_seconds
    description: Duration of the game in seconds, when reported.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Duration seconds
          hidden: false
          format: '#,##0'
  - name: time_class
    description: Chess.com time-class category for the game.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Time class
          hidden: false
  - name: time_control
    description: Chess.com time-control setting for the game.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Time control
          hidden: false
  - name: is_rated
    description: Whether Chess.com marked the game as rated.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is rated
          hidden: false
  - name: player_rating
    description: Archived user's rating for the game.
    data_type: bigint
    config:
      meta:
        metrics:
          average_player_rating:
            type: average
            label: Mean player rating
            description: Mean reported `player_rating` by `time_class` and game `ended_at` month. This is an
              observation-weighted rating level, not a rating change for a fixed player.
            format: '#,##0.00'
        dimension:
          type: number
          label: Player rating
          hidden: false
          format: '#,##0'
  - name: opponent_rating
    description: Opponent's rating for the game.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Opponent rating
          hidden: false
          format: '#,##0'
  - name: player_result
    description: Archived user's game result.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Player result
          hidden: false
  - name: opponent_result
    description: Opponent's result for the game.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Opponent result
          hidden: false
  - name: rules
    description: Rule set reported for the game.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Rules
          hidden: false
  - name: opening
    description: Opening or ECO text reported for the game.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Opening
          hidden: false
  - name: timed_move_count
    description: Number of timed moves recorded in the game.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Timed move count
          hidden: false
          format: '#,##0'
  - name: median_move_time_seconds
    description: Median move time in seconds reported for the game.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Median move time seconds
          hidden: false
          format: '#,##0.00'
  - name: max_move_time_seconds
    description: Maximum move time in seconds reported for the game.
    data_type: double
    config:
      meta:
        dimension:
          type: number
          label: Max move time seconds
          hidden: false
          format: '#,##0.00'
  - name: source_row_id
    description: Raw warehouse row identifier for the retained game record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source row id
          hidden: true
  - name: source_batch_id
    description: Identifier of the extract batch that produced the source row.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source batch id
          hidden: true
  - name: source_file
    description: Raw source file containing the game record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source file
          hidden: true
  - name: source_file_row_number
    description: Row position of the game within its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Source file row number
          hidden: true
          format: '#,##0'
  - name: source_date
    description: Source partition date assigned by the load layer.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: Source date
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: extract_started_at
    description: UTC timestamp when extraction of the source batch started.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Extract started at
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: load_id
    description: Identifier of the load job that inserted the source row.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Load id
          hidden: true
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the source row.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: content_hash
    description: Hash of the original raw record content.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Content hash
          hidden: true
