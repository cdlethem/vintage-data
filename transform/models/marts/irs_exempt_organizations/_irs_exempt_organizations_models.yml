          average_assets:
            type: average
            label: Average reported assets
            description: Average non-null `asset_amount` in US dollars for the selected snapshot group. This
              is a snapshot level and must not be interpreted as a sum of organization balances.
            format: '#,##0.00'
        dimension:
          type: number
          label: Asset amount
          hidden: false
          format: '#,##0.00'
  - name: income_amount
