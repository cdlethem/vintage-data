  - name: private_foundation_filing_requirement_code
    description: IRS private-foundation filing requirement code for the organization.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Private foundation filing requirement code
          hidden: false
          name: private_foundation_filing_r_26c5ea
  - name: accounting_period
