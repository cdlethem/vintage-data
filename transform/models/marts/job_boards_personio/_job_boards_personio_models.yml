version: 2
models:
- name: fct_job_boards_personio
  description: Daily physical history of job observations returned by Personio applicant-tracking system
    boards. Each row represents one upstream source, job identifier, and extractor observation timestamp;
    repeated raw copies of an observation are reduced to the latest loaded lineage record while listing
    attributes and load metadata remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job boards personio
      group_label: Job boards personio
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_boards_personio_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_boards_personio` — licence: public ATS board endpoints; attribution required: False.
            Source configuration: `extract/sources/job_boards_personio.yml`.'
          analysis:
            headline: how the published job catalogue and its posting mix change across companies and industries.
            event_time: posted
            grain: MONTH
            controls:
            - company_country
            - company_industry
            - employment_type
            - experience_level
            trends:
            - slug: observed-jobs
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Jobs present in the catalogue per observation day
              description: Distinct `job_id` values present in the Personio feed on each extractor observation
                day. This is a catalogue level rather than a posting flow — it moves when jobs are added or
                withdrawn. The four observed days are shown; days without a successful extract are absent
                rather than zero.
              width: half
            - slug: observed-companies
              kind: total
              metric: distinct_companies
              time: observed_at
              grain: DAY
              title: Hiring companies present per observation day
              description: Distinct non-null `company` values attached to jobs on each extractor observation
                day. This is a catalogue level, not a count of newly hiring companies; absent observation
                days are absent rather than zero.
              width: half
            - slug: posted-jobs
              kind: total
              metric: distinct_entities
              time: posted
              grain: MONTH
              title: Jobs posted per month
              description: Distinct `job_id` values by the month Personio reports in `posted`, over the full
                published history. This is a posting flow rather than a current catalogue snapshot; months
                with no dated postings are absent rather than zero.
              width: half
            - slug: postings-by-country
              kind: breakdown
              metric: distinct_entities
              breakdown: company_country
              top_n: 3
              time: posted
              grain: MONTH
              title: Jobs posted per month by company country
              description: Distinct `job_id` values by Personio `posted` month, pivoted by `company_country`.
                The three countries are retained because all observed countries fit; no remainder is
                excluded. This is a flow and not a count of currently open jobs.
              width: full
            - slug: posting-mix-by-industry
              kind: composition
              metric: distinct_entities
              breakdown: company_industry
              top_n: 8
              time: posted
              grain: MONTH
              title: Monthly posting mix by company industry
              description: Distinct `job_id` values by `posted` month stacked by `company_industry`. Bars show
                how the industry mix changes, while the eight largest industries by metric are retained and
                smaller industries are excluded rather than aggregated.
              width: full
  columns:
  - name: job_boards_personio_key
    description: Stable hash of the Personio source, job identifier, and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job boards personio key
          hidden: true
  - name: source
    description: Upstream source label carried by the Personio job-board response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: Personio identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this job listing.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Job-board provider label reported by the upstream response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Hiring company name reported by the Personio board.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct company
            description: Distinct non-null `company` values among Personio observations in each selected
              time and dimension group. This counts the breadth of hiring companies rather than postings.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: company_country
    description: Country associated with the hiring company when supplied by Personio.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company country
          hidden: false
  - name: company_industry
    description: Industry label associated with the hiring company when supplied by Personio.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company industry
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Department or discipline reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Department
          hidden: false
  - name: employment_type
    description: Employment arrangement reported for the job listing, such as permanent.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Employment type
          hidden: false
  - name: experience_level
    description: Experience or seniority level reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Experience level
          hidden: false
  - name: location
    description: Free-text candidate location reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: posted
    description: UTC timestamp when Personio reports that the job was posted.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Public Personio URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: description
    description: Job description text reported by Personio when supplied.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Description
          hidden: true
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the observation in its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
