version: 2
models:
- name: fct_job_boards_ashby
  description: Daily physical history of job observations returned by Ashby applicant-tracking-system
    boards. Each row represents one upstream source, job identifier, and extractor observation timestamp;
    repeated raw copies of an observation are reduced to the latest loaded lineage record while listing
    attributes and load metadata remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job boards ashby
      group_label: Job boards ashby
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_boards_ashby_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_boards_ashby` — licence: public ATS board endpoints; attribution required: False. Source
            configuration: `extract/sources/job_boards_ashby.yml`.'
          analysis:
            headline: how Ashby job volume and company coverage change across the published catalogue.
            event_time: posted_at
            grain: MONTH
            controls:
            - company
            - company_country
            - company_industry
            - workplace_type
            trends:
            - slug: posted-jobs
              kind: total
              metric: distinct_entities
              time: posted_at
              grain: MONTH
              title: Ashby jobs posted per month
              description: Distinct `job_id` values grouped by their upstream `posted_at` month. This is a
                source-event flow — months with no listed jobs are absent rather than zero, and repeated
                observations of a job are counted once within its posting month.
              width: half
            - slug: posting-companies
              kind: total
              metric: distinct_companies
              time: posted_at
              grain: MONTH
              title: Hiring companies posting per month
              description: Distinct non-null `company` values among jobs by upstream `posted_at` month.
                This measures breadth of hiring activity rather than job volume — months with no source
                postings are absent rather than zero.
              width: half
            - slug: jobs-by-company
              kind: composition
              metric: distinct_entities
              breakdown: company
              top_n: 8
              time: posted_at
              grain: MONTH
              title: Monthly Ashby postings by leading company
              description: Distinct jobs by upstream `posted_at` month, stacked for the eight companies
                with the most jobs in this mart. Remaining companies are excluded rather than aggregated;
                sparse source months are absent rather than zero.
              width: full
            - slug: catalogue-by-workplace
              kind: composition
              metric: distinct_entities
              breakdown: workplace_type
              top_n: 3
              time: observed_at
              grain: DAY
              title: Observed Ashby catalogue by workplace type
              description: Distinct `job_id` values present on each extractor observation day, stacked by
                `workplace_type`. This is a catalogue level rather than a posting flow — null workplace
                values are excluded from segments, and days with no successful extract are absent.
              width: full
  columns:
  - name: job_boards_ashby_key
    description: Stable hash of the Ashby source, job identifier, and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job boards ashby key
          hidden: true
  - name: source
    description: Upstream source identifier carried by the Ashby response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: Ashby identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this job in the Ashby feed.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Provider label carried by the Ashby job record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Hiring company name reported by the Ashby board.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct hiring companies
            description: Distinct non-null `company` values per time bucket. This measures company coverage,
              not posting volume, and repeated observations count once within each group.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: company_country
    description: Country associated with the hiring company when supplied by Ashby.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company country
          hidden: false
  - name: company_industry
    description: Industry label associated with the hiring company when supplied by Ashby.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company industry
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Department or discipline reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Department
          hidden: false
  - name: employment_type
    description: Employment arrangement reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Employment type
          hidden: false
  - name: location
    description: Free-text candidate location reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: workplace_type
    description: Workplace modality reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Workplace type
          hidden: false
  - name: is_remote
    description: Whether Ashby identifies the job as remote.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is remote
          hidden: false
  - name: posted_at
    description: UTC publication timestamp supplied by Ashby for the job posting.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Public Ashby URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: salary_text
    description: Original salary text supplied by Ashby when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Salary text
          hidden: false
  - name: salary_min
    description: Lower bound of the advertised salary range when supplied by Ashby.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary min
          hidden: false
          format: '#,##0'
  - name: salary_max
    description: Upper bound of the advertised salary range when supplied by Ashby.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: Salary max
          hidden: false
          format: '#,##0'
  - name: salary_currency
    description: Currency code associated with the advertised salary when supplied.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Salary currency
          hidden: false
  - name: salary_interval
    description: Pay interval associated with the advertised salary when supplied.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Salary interval
          hidden: false
  - name: description
    description: Job description text supplied by Ashby.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Description
          hidden: true
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the retained observation in its raw extract file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
