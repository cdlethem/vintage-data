version: 2
models:
- name: fct_food_hygiene_ratings_birmingham
  description: Daily physical snapshot of Birmingham food-hygiene ratings. Each row is one food business
    from one publisher snapshot, identified by source, business_id, and observed_at. The six duplicate
    source rows observed in the initial load are reduced deterministically by source load lineage; source
    business attributes and the three nested FHRS scores are exposed as typed columns while loader lineage
    is retained.
  config:
    contract:
      enforced: true
    meta:
      grain: source, business_id, observed_at
      label: Food hygiene ratings birmingham
      group_label: Food hygiene ratings birmingham
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: food_hygiene_observa_041309
      vintage:
        visualization:
          dimension: business_type
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct business by business type
          description: Distinct `business_id` values by `business_type` among observations in the selected
            window. Repeated observations of an entity count once within each group. An entity that changed
            category can appear in multiple groups; these groups are not additive and do not represent
            a current-state census.
          detail_fields:
          - observed_at
          - business_id
          - business_type
          - source_loaded_at
          sources:
          - '`food_hygiene_ratings_birmingham` — see dbt raw-source lineage.'
          analysis:
            headline: how Birmingham food-business inspection volume and component scores change across rating history.
            event_time: rating_date
            grain: MONTH
            controls:
            - business_type
            - postcode
            - new_rating_pending
            trends:
            - slug: monthly-ratings
              kind: total
              metric: distinct_entities
              time: rating_date
              grain: MONTH
              title: Businesses rated per month
              description: Distinct `business_id` values by publisher `rating_date` month across the full observed
                history. This is a rating-event flow; months without a rating are absent rather than zero.
              width: half
            - slug: hygiene-score
              kind: total
              metric: average_hygiene_score
              time: rating_date
              grain: MONTH
              title: Mean hygiene component score by month
              description: Average non-null `hygiene_score` for businesses rated in each month. This is a
                component-score measure rather than a count, and months with no rated businesses are absent rather
                than zero.
              width: half
            - slug: hygiene-by-type
              kind: breakdown
              metric: average_hygiene_score
              breakdown: business_type
              top_n: 6
              time: rating_date
              grain: MONTH
              title: Hygiene scores for leading business types
              description: Average non-null hygiene component score by rating month for the six business types with
                the largest observed populations. Remaining types are excluded rather than aggregated, and sparse
                months are absent rather than zero.
              width: full
            - slug: type-composition
              kind: composition
              metric: distinct_entities
              breakdown: business_type
              top_n: 12
              time: rating_date
              grain: MONTH
              title: Monthly rating mix by business type
              description: Distinct rated businesses stacked by business type for each rating month. The twelve
                largest types are shown; the smallest type is excluded rather than grouped into an other category.
                Empty months are absent rather than zero.
              width: full
  columns:
  - name: food_hygiene_observation_key
    description: Stable hash of source, business identifier, and snapshot timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Food hygiene observation key
          hidden: true
          name: food_hygiene_observa_041309
  - name: source
    description: Source-system identifier supplied by the Food Hygiene Ratings Service.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: business_id
    description: Publisher business identifier supplied in the source id field.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct business
            description: Distinct `business_id` values by `business_type` among observations in the selected
              window. Repeated observations of an entity count once within each group. An entity that
              changed category can appear in multiple groups; these groups are not additive and do not
              represent a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Business id
          hidden: false
  - name: observed_at
    description: Timestamp when the publisher snapshot was fetched.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: address_line_1
    description: First address line for the rated food business.
