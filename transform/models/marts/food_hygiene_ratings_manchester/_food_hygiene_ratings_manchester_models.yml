version: 2
models:
- name: fct_food_hygiene_ratings_manchester
  description: Daily physical snapshot fact of Manchester food-hygiene ratings. Each row is one business
    returned by the publisher for one fetched snapshot; source values are typed where stable, while the
    original rating text and loader lineage remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, business_id, observed_at
      label: Food hygiene ratings manchester
      group_label: Food hygiene ratings manchester
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: food_hygiene_rating__74d30b
      vintage:
        visualization:
          dimension: business_type
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct business by business type
          description: Distinct `business_id` values by `business_type` among observations in the selected
            window. Repeated observations of an entity count once within each group. An entity that changed
            category can appear in multiple groups; these groups are not additive and do not represent
            a current-state census.
          detail_fields:
          - observed_at
          - business_id
          - business_type
          - source_loaded_at
          sources:
          - '`food_hygiene_ratings_manchester` — see dbt raw-source lineage.'
          analysis:
            headline: how Manchester rating activity and reported hygiene scores shift across business types over rating history.
            event_time: rating_at
            grain: MONTH
            controls:
            - business_type
            - rating_value
            - new_rating_pending
            - scheme_type
            trends:
            - slug: rating-volume
              kind: total
              metric: distinct_entities
              time: rating_at
              grain: MONTH
              title: Businesses rated per month
              description: Distinct `business_id` values whose rating event falls in each month. This is an
                event flow rather than a current catalogue level — months with no rated records are absent
                rather than zero.
              width: half
            - slug: hygiene-score
              kind: total
              metric: avg_hygiene
              time: rating_at
              grain: MONTH
              title: Average hygiene component score per month
              description: Average non-null `hygiene_score` among businesses by their rating-event month.
                This is a reported component score, not a pass rate — months without scored records are
                absent rather than zero.
              width: half
            - slug: business-type-mix
              kind: composition
              metric: distinct_entities
              breakdown: business_type
              top_n: 8
              time: rating_at
              grain: MONTH
              title: Rated businesses by business type
              description: Distinct businesses per rating month stacked by `business_type`. The eight largest
                business types by this metric are shown; the remainder is excluded rather than aggregated,
                and empty months are absent rather than zero.
              width: full
            - slug: score-by-business-type
              kind: breakdown
              metric: avg_hygiene
              breakdown: business_type
              top_n: 8
              time: rating_at
              grain: MONTH
              title: Hygiene score by business type
              description: Average non-null `hygiene_score` per rating month for the eight largest business
                types. The lines compare reported component levels, not inspection volume — months without
                scores are absent rather than zero.
              width: full
  columns:
  - name: food_hygiene_rating_observation_key
    description: Stable hash of source, business identifier, and snapshot observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Food hygiene rating observation key
          hidden: true
          name: food_hygiene_rating__74d30b
  - name: source
    description: Source-system identifier that supplied the food-hygiene rating.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: business_id
    description: Publisher business identifier for the rated establishment.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct business
            description: Distinct `business_id` values by `business_type` among observations in the selected
              window. Repeated observations of an entity count once within each group. An entity that
              changed category can appear in multiple groups; these groups are not additive and do not
              represent a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Business id
          hidden: false
  - name: observed_at
    description: Timestamp when the publisher snapshot was fetched.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: address_line_1
    description: First address line for the rated establishment.
