version: 2
models:
- name: fct_faa_nas_status_observation
  description: Twice-hourly physical observation fact for the FAA National Airspace System status feed.
    Each row represents one airport identifier at one extractor observation timestamp. Repeated insert-only
    raw copies of the same airport observation retain the latest loaded row, while source and load lineage
    remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: airport_id, observed_at
      label: Faa nas status observation
      group_label: Faa nas status
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: faa_nas_status_observation_key
      vintage:
        visualization:
          dimension: airport
          metric: average_ground_delay_avg_min
          time: observed_at
          window_days: 30
          title: Mean observed ground delay avg min by airport
          description: Mean observed ground delay avg min by `airport` in the selected observation window.
            Average FAA-reported ground delay duration in minutes, when present. Each retained observation
            has equal weight; polling frequency and repeated snapshots can affect the mean. This is not
            a latest-value measure or an additive total.
          detail_fields:
          - observed_at
          - airport_id
          - airport
          - ground_delay_avg_min
          - source_loaded_at
          sources:
          - '`faa_nas_status` — licence: US Government work, public domain; attribution required: False.
            Source configuration: `extract/sources/faa_nas_status.yml`.'
          analysis:
            headline: how airport coverage and delay pressure move through each status observation and source update.
            event_time: source_timestamp
            grain: HOUR
            controls:
            - has_ground_stop
            - has_ground_delay
            - ground_stop_reason
            - ground_delay_reason
            trends:
            - slug: observed-airports
              kind: total
              metric: distinct_airports
              time: observed_at
              grain: HOUR
              title: Airports reporting per observation hour
              description: Distinct `airport_id` values present in each extractor observation hour. This is a
                snapshot coverage level rather than a flow; hours with no successful extract are absent rather
                than zero.
              width: half
            - slug: source-delay
              kind: total
              metric: average_ground_delay_avg_min
              time: source_timestamp
              grain: HOUR
              title: Mean reported ground delay by source hour
              description: Average non-null FAA `ground_delay_avg_min` in each source timestamp hour. This is an
                observation-weighted reported measure, not an additive total; rows without source timestamps are
                excluded and absent hours are not zero.
              width: half
            - slug: airport-delay
              kind: breakdown
              metric: average_ground_delay_avg_min
              breakdown: airport
              top_n: 6
              time: source_timestamp
              grain: HOUR
              title: Delay trajectories for the busiest airports
              description: Average non-null FAA ground delay minutes per source timestamp hour, split by the six
                airports with the largest observed values. Remaining airports are excluded rather than aggregated,
                and null-delay observations do not form a zero.
              width: full
            - slug: delay-reasons
              kind: composition
              metric: distinct_airports
              breakdown: ground_delay_reason
              top_n: 8
              time: observed_at
              grain: HOUR
              title: Airports by ground-delay reason
              description: Distinct airports stacked by reported `ground_delay_reason` in each observation hour.
                The eight most common reasons are shown; null and less common reasons are excluded, not folded into
                an other category.
              width: full
  columns:
  - name: faa_nas_status_observation_key
    description: Stable hash of the airport identifier and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    config:
      meta:
        dimension:
          type: string
          label: Faa nas status observation key
          hidden: true
  - name: source_name
    description: Source label supplied by the FAA NAS status extractor.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source name
          hidden: false
  - name: airport_id
    description: Airport identifier supplied by the FAA status feed, sourced from id.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_airports:
            type: count_distinct
            label: Distinct airports
            description: Distinct `airport_id` values present in each observation or source-time group. This is
              a snapshot coverage level and repeated polling observations count once within each group.
            format: '#,##0'
        dimension:
          type: string
          label: Airport id
          hidden: false
  - name: airport
    description: Airport code reported by the FAA status feed.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Airport
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor fetched this FAA airport status observation.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - HOUR
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: has_ground_stop
    description: Whether the airport was subject to a ground stop at the observation time.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Has ground stop
          hidden: false
  - name: has_ground_delay
    description: Whether the airport was subject to a ground delay at the observation time.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Has ground delay
          hidden: false
  - name: ground_stop_reason
    description: FAA-provided explanation for the airport ground stop, when present.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Ground stop reason
          hidden: false
  - name: ground_delay_reason
    description: FAA-provided explanation for the airport ground delay, when present.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Ground delay reason
          hidden: false
  - name: ground_delay_avg_min
    description: Average FAA-reported ground delay duration in minutes, when present.
    data_type: double
    config:
      meta:
        metrics:
          average_ground_delay_avg_min:
            type: average
            label: Mean observed ground delay avg min
            description: Mean observed ground delay avg min by `airport` in the selected observation window.
              Average FAA-reported ground delay duration in minutes, when present. Each retained observation
              has equal weight; polling frequency and repeated snapshots can affect the mean. This is
              not a latest-value measure or an additive total.
            format: '#,##0.00'
        dimension:
          type: number
          label: Ground delay avg min
          hidden: false
  - name: ground_delay_max_min
    description: Maximum FAA-reported ground delay duration in minutes, when present.
    data_type: bigint
    config:
      meta:
        metrics:
          average_ground_delay_max_min:
            type: average
            label: Mean observed ground delay max
            description: Average non-null FAA `ground_delay_max_min` in each observation or source-time group.
              This is an observation-weighted reported measure, not an additive total.
            format: '#,##0.00'
        dimension:
          type: number
          label: Ground delay max min
          hidden: false
          format: '#,##0'
  - name: source_timestamp
    description: Source-provided timestamp associated with the FAA status record, when present.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source timestamp
          hidden: false
          time_intervals:
          - RAW
          - HOUR
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: _row_id
    description: Load-layer row identifier of the retained FAA status observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' row id'
          hidden: true
  - name: _batch_id
    description: Identifier of the extract batch that produced the retained FAA status observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained FAA status observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the retained observation in its raw extract file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: _dt
    description: Load-layer partition date associated with the retained raw observation.
    data_type: date
    config:
      meta:
        dimension:
          type: date
          label: ' dt'
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: _extract_started_at
    description: Timestamp when the extract job that produced the retained observation started.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: ' extract started at'
          hidden: true
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: _load_id
    description: Identifier of the load job that inserted the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: source_loaded_at
    description: Timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Load-layer content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
