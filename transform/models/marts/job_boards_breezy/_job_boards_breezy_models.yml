version: 2
models:
- name: fct_job_boards_breezy
  description: Daily physical history of job observations returned by Breezy applicant tracking boards.
    Each row represents one upstream source, job identifier, and extractor observation timestamp; repeated
    raw copies of an observation are reduced to the latest loaded lineage record while listing attributes
    and load metadata remain available for audit and replay.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job boards breezy
      group_label: Job boards breezy
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_boards_breezy_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_boards_breezy` — licence: public ATS board endpoints; attribution required: False. Source
            configuration: `extract/sources/job_boards_breezy.yml`.'
          analysis:
            headline: how Breezy's tiny published catalogue changes across extractor observation days.
            event_time: observed_at
            grain: DAY
            controls:
            - company
            - company_country
            - company_industry
            - employment_type
            trends:
            - slug: observed-jobs
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Observed Breezy jobs per day
              description: Distinct `job_id` values present in the Breezy feed on each extractor observation
                day. This is a catalogue level rather than a posting flow — the same job is republished on
                each poll, and days with no successful extract are absent rather than zero.
              width: half
            - slug: observed-companies
              kind: total
              metric: distinct_companies
              time: observed_at
              grain: DAY
              title: Observed Breezy companies per day
              description: Distinct non-null `company` values present on each extractor observation day.
                This is a level describing the published catalogue, not new hiring activity — absent days
                are not zero-filled.
              width: half
            - slug: catalogue-by-employment
              kind: composition
              metric: distinct_entities
              breakdown: employment_type
              top_n: 2
              time: observed_at
              grain: DAY
              title: Observed Breezy jobs by employment type
              description: Distinct jobs present on each observation day, stacked by `employment_type`.
                This catalogue has one observed employment value, and remaining values are excluded rather
                than aggregated; absent observation days are absent rather than zero.
              width: full
            - slug: source-posted-level
              kind: total
              metric: distinct_entities
              time: posted_at
              grain: MONTH
              title: Breezy jobs by source posting month
              description: Distinct jobs grouped by the source `posted_at` month. All four rows share
                February 2025, so this is one populated source-event point rather than a historical flow;
                other months are absent rather than zero.
              width: full
  columns:
  - name: job_boards_breezy_key
    description: Stable hash of the Breezy source, job identifier, and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job boards breezy key
          hidden: true
  - name: source
    description: Upstream source label carried by the Breezy job-board response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: Breezy identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this job listing.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Job-board provider label reported by the upstream response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Hiring company name reported by the Breezy board.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct hiring companies
            description: Distinct non-null `company` values per time bucket. This measures company coverage,
              not posting volume, and repeated observations count once within each group.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: company_country
    description: Country associated with the hiring company when supplied by Breezy.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company country
          hidden: false
  - name: company_industry
    description: Industry label associated with the hiring company when supplied by Breezy.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company industry
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: department
    description: Department or discipline reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Department
          hidden: false
  - name: employment_type
    description: Employment arrangement reported for the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Employment type
          hidden: false
  - name: location
    description: Free-text candidate location reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: is_remote
    description: Whether Breezy marks the job as remote.
    data_type: boolean
    config:
      meta:
        dimension:
          type: boolean
          label: Is remote
          hidden: false
  - name: posted_at
    description: UTC publication timestamp supplied by Breezy for the job posting.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Posted at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: job_url
    description: Public Breezy URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: salary_text
    description: Salary or compensation text supplied by Breezy, when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Salary text
          hidden: false
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the observation in its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
