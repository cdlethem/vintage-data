version: 2
models:
- name: fct_job_boards_workday
  description: Daily physical history of job observations returned by Workday-hosted recruiting boards.
    Each row represents one source, job identifier, and extractor observation timestamp; repeated raw
    copies of an observation are reduced to the latest loaded lineage record while listing attributes
    and load metadata remain available for audit and replay. A table is used because the profiled source
    contains 218,150 rows and is rebuilt daily as a bounded, complete history.
  config:
    contract:
      enforced: true
    meta:
      grain: source, job_id, observed_at
      label: Job boards workday
      group_label: Job boards workday
      default_time_dimension:
        field: observed_at
        interval: DAY
      primary_key: job_boards_workday_key
      vintage:
        visualization:
          dimension: company
          metric: distinct_entities
          time: observed_at
          window_days: 30
          title: Distinct job by company
          description: Distinct `job_id` values by `company` among observations in the selected window.
            Repeated observations of an entity count once within each group. An entity that changed category
            can appear in multiple groups; these groups are not additive and do not represent a current-state
            census.
          detail_fields:
          - observed_at
          - job_id
          - company
          - source_loaded_at
          sources:
          - '`job_boards_workday` — licence: public ATS board endpoints; attribution required: False.
            Source configuration: `extract/sources/job_boards_workday.yml`.'
          analysis:
            headline: how the Workday catalogue level varies by company geography and industry across observed days.
            event_time: observed_at
            grain: DAY
            controls:
            - company_country
            - company_industry
            - location_country
            - posted
            trends:
            - slug: jobs-observed
              kind: total
              metric: distinct_entities
              time: observed_at
              grain: DAY
              title: Distinct jobs observed per day
              description: Distinct `job_id` values present in the Workday catalogue on each observation day. This
                is a level rather than a flow because the feed republishes its catalogue; days with no successful
                extract are absent rather than zero.
              width: half
            - slug: companies-observed
              kind: total
              metric: distinct_companies
              time: observed_at
              grain: DAY
              title: Hiring companies observed per day
              description: Distinct non-null `company` values represented in the catalogue on each observation day.
                This is a catalogue level, not a count of newly hiring companies, and absent extract days are
                absent rather than zero.
              width: half
            - slug: jobs-by-country
              kind: breakdown
              metric: distinct_entities
              breakdown: company_country
              top_n: 8
              time: observed_at
              grain: DAY
              title: Distinct jobs by company country
              description: Distinct `job_id` values per observation day, split across the eight company countries
                with the largest catalogue counts. Smaller countries are excluded rather than aggregated, so
                line changes show catalogue mix rather than new postings.
              width: full
            - slug: jobs-by-industry
              kind: composition
              metric: distinct_entities
              breakdown: company_industry
              top_n: 8
              time: observed_at
              grain: DAY
              title: Catalogue mix by company industry
              description: Distinct `job_id` values per observation day stacked by the eight largest
                `company_industry` values. Remaining industries are excluded rather than grouped, and the stack
                is a level of the republished catalogue rather than a flow of new jobs.
              width: full
  columns:
  - name: job_boards_workday_key
    description: Stable hash of the Workday source, job identifier, and extractor observation timestamp.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 days'
    config:
      meta:
        dimension:
          type: string
          label: Job boards workday key
          hidden: true
  - name: source
    description: Upstream source label identifying the Workday board family that produced the observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source
          hidden: false
  - name: job_id
    description: Workday identifier assigned to the advertised job.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_entities:
            type: count_distinct
            label: Distinct job
            description: Distinct `job_id` values by `company` among observations in the selected window.
              Repeated observations of an entity count once within each group. An entity that changed
              category can appear in multiple groups; these groups are not additive and do not represent
              a current-state census.
            format: '#,##0'
        dimension:
          type: string
          label: Job id
          hidden: false
  - name: observed_at
    description: UTC timestamp when the extractor observed this Workday job listing.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Observed at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
  - name: provider
    description: Recruiting platform provider reported by the upstream response.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Provider
          hidden: false
  - name: company
    description: Hiring company name reported by the Workday board.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_companies:
            type: count_distinct
            label: Distinct hiring companies
            description: Distinct non-null `company` values present on each observation day. This is a catalogue
              level and does not count newly hiring companies.
            format: '#,##0'
        dimension:
          type: string
          label: Company
          hidden: false
  - name: company_country
    description: Country associated with the hiring company when supplied by Workday.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company country
          hidden: false
  - name: company_industry
    description: Industry label associated with the hiring company when supplied by Workday.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Company industry
          hidden: false
  - name: title
    description: Public title of the advertised job.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Title
          hidden: false
  - name: location
    description: Free-text candidate location reported for the job listing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location
          hidden: false
  - name: location_country
    description: Country associated with the reported job location when available.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Location country
          hidden: false
  - name: posted
    description: Workday's textual posting-age label, such as Posted Today or Posted 30+ Days Ago; it
      is not a parsed timestamp.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Posted
          hidden: false
  - name: job_url
    description: Public Workday URL for the job posting.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Job url
          hidden: false
  - name: _batch_id
    description: Extract batch identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' batch id'
          hidden: true
  - name: _load_id
    description: Load job identifier associated with the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' load id'
          hidden: true
  - name: _source_file
    description: Raw extract file containing the retained observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' source file'
          hidden: true
  - name: _file_row_num
    description: One-based row position of the observation in its raw source file.
    data_type: bigint
    config:
      meta:
        dimension:
          type: number
          label: ' file row num'
          hidden: true
          format: '#,##0'
  - name: source_loaded_at
    description: UTC timestamp when the load layer inserted the retained observation into the raw warehouse.
    data_type: timestamp with time zone
    config:
      meta:
        dimension:
          type: timestamp
          label: Source loaded at
          hidden: false
          time_intervals:
          - RAW
          - DAY
          - WEEK
          - MONTH
          - YEAR
        metrics:
          latest_load:
            type: max
            label: Latest warehouse load
            description: Latest raw load timestamp represented by matching mart rows; not the time the
              publisher copied this table.
  - name: _content_hash
    description: Content hash of the retained raw observation for lineage and replay auditing.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: ' content hash'
          hidden: true
