version: 2
models:
- name: fct_infodengue_belohorizonte_epidemiology
  description: Hourly physical history of epidemiological surveillance observations for Belo Horizonte
    from the Infodengue city-alerts feed. Each row is one provider source relation and record identifier;
    insert-only replays are reduced to the latest loaded copy while typed measures and raw-load lineage
    remain available for audit and reproducible downstream analysis.
  config:
    contract:
      enforced: true
    meta:
      grain: source_relation, record_id
      label: Infodengue belohorizonte epidemiology
      group_label: Infodengue belohorizonte
      default_time_dimension:
        field: fetched_at
        interval: DAY
      primary_key: infodengue_bel_1fa952
      vintage:
        visualization:
          dimension: municipality_name
          metric: m_13c38800
          time: fetched_at
          window_days: 30
          title: Mean observed incidence per 100k by municipality name
          description: Mean observed incidence per 100k by `municipality_name` in the selected observation
            window. Estimated incidence per 100,000 population. Each retained observation has equal weight;
            polling frequency and repeated snapshots can affect the mean. This is not a latest-value measure
            or an additive total.
          detail_fields:
          - fetched_at
          - record_id
          - municipality_name
          - incidence_per_100k
          - source_loaded_at
          sources:
          - '`infodengue_belohorizonte` — see dbt raw-source lineage.'
          analysis:
            headline: how weekly Belo Horizonte dengue burden and transmission indicators rise and fall across
              epidemiological weeks.
            event_time: week_start_date
            grain: WEEK
            controls:
            - disease
            - alert_level
            - receptive_status
            - transmission_status
            trends:
            - slug: weekly-case-estimates
              kind: total
              metric: avg_cases
              time: week_start_date
              grain: WEEK
              title: Mean estimated cases per epidemiological week
              description: Mean `cases_estimate` for each epidemiological week in the published Belo Horizonte
                series. One row currently represents each week, so this is the reported weekly level rather
                than a sum; absent weeks are absent rather than zero.
              width: half
            - slug: weekly-incidence
              kind: total
              metric: m_13c38800
              time: week_start_date
              grain: WEEK
              title: Mean incidence per 100k by epidemiological week
              description: Mean `incidence_per_100k` for each epidemiological week. This rate is a reported
                population-normalized level and must not be summed; the 34 observed weeks span January
                through August, and absent weeks are absent rather than zero.
              width: half
            - slug: weekly-reproduction
              kind: total
              metric: avg_rt
              time: week_start_date
              grain: WEEK
              title: Mean reproduction number per epidemiological week
              description: Mean provider `reproduction_number` for each epidemiological week. This is a
                reported rate-like indicator, not a case total; absent weeks are absent rather than zero.
              width: half
            - slug: cases-by-alert
              kind: breakdown
              metric: avg_cases
              breakdown: alert_level
              top_n: 3
              time: week_start_date
              grain: WEEK
              title: Mean estimated cases by alert level
              description: Mean estimated cases per epidemiological week split across the three observed
                alert levels. These are separate snapshot levels rather than additive totals; absent weeks
                or levels are absent rather than zero.
              width: full
            - slug: weekly-alert-mix
              kind: composition
              metric: distinct_records
              breakdown: alert_level
              top_n: 3
              time: week_start_date
              grain: WEEK
              title: Weekly observation mix by alert level
              description: Distinct provider `record_id` observations per epidemiological week stacked by
                the three alert levels. The stack shows which alert level labels the published row; absent
                weeks are absent rather than zero.
              width: full
  columns:
  - name: infodengue_belohorizonte_observation_key
    description: Stable hash of the source relation and provider record identifier defining the observation
      grain.
    data_type: varchar
    data_tests:
    - not_null:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    - unique:
        config:
          where: source_loaded_at >= current_timestamp - interval '2 hours'
    config:
      meta:
        dimension:
          type: string
          label: Infodengue belohorizonte observation key
          hidden: true
          name: infodengue_bel_1fa952
  - name: source_relation
    description: Raw relation identifier supplied by the load layer.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source relation
          hidden: false
  - name: source_endpoint
    description: Upstream endpoint label that produced the source record.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source endpoint
          hidden: false
  - name: record_id
    description: Provider record identifier defining the epidemiological observation grain.
    data_type: varchar
    config:
      meta:
        metrics:
          distinct_records:
            type: count_distinct
            label: Distinct epidemiological record
            description: Distinct non-null provider `record_id` values in each epidemiological-week and
              dimension group. This counts published observations without treating reported rates or case
              estimates as additive quantities.
            format: '#,##0'
        dimension:
          type: string
          label: Record id
          hidden: false
  - name: source_row_id
    description: Load-layer row identifier of the retained raw observation.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source row id
          hidden: true
  - name: source_batch_id
    description: Identifier of the extraction batch that produced the retained raw row.
    data_type: varchar
    config:
      meta:
        dimension:
          type: string
          label: Source batch id
          hidden: true
  - name: source_file
