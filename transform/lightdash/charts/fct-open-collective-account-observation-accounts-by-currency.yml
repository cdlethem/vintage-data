chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_open_collective_account_observation_observed_at_day
          yRef:
            field: fct_open_collective_account_observation_distinct_accounts
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct account
    layout:
      stack: true
      xField: fct_open_collective_account_observation_observed_at_day
      yField:
      - fct_open_collective_account_observation_distinct_accounts
