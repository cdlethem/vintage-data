chartConfig:
  config: {}
  type: table
description: Daily physical history of structures published by the RCSB Protein Data Bank feed. Each row
  is one structure observed in one source snapshot, retaining publication dimensions and raw-load lineage
  for replay.
metricQuery:
  dimensions: &id001
  - fct_rcsb_pdb_structure_snapshot_observed_at
  - fct_rcsb_pdb_structure_snapshot_structure_id
  - fct_rcsb_pdb_structure_snapshot_experimental_method
  - fct_rcsb_pdb_structure_snapshot_source_loaded_at
  exploreName: fct_rcsb_pdb_structure_snapshot
  filters:
    dimensions:
      and:
      - id: 8944e83b-8fea-5eb0-a864-581309230003
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_rcsb_pdb_structure_snapshot_observed_at
        values:
        - 30
      id: b9484b2a-7f43-52a9-9547-5be100585a55
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_rcsb_pdb_structure_snapshot_observed_at
  tableCalculations: []
name: Rcsb pdb structure snapshot — observations
slug: fct-rcsb-pdb-structure-snapshot-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_rcsb_pdb_structure_snapshot
version: 1
