chartConfig:
  config: {}
  type: table
description: Physical snapshot fact for museum collection records. Each row represents one source item
  observed at one fetched_at timestamp; repeated item observations preserve changing catalog attributes
  such as title, classification, display status, gallery, and updated_at while retaining load lineage.
  Duplicate rows for the same source, item, and observation timestamp are reduced to the latest loaded
  record.
metricQuery:
  dimensions: &id001
  - fct_museum_collection_items_fetched_at
  - fct_museum_collection_items_id
  - fct_museum_collection_items_classification
  - fct_museum_collection_items_source_loaded_at
  exploreName: fct_museum_collection_items
  filters:
    dimensions:
      and:
      - id: db5db25f-5283-5972-a543-0a8f6a69f5b4
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_museum_collection_items_fetched_at
        values:
        - 30
      id: ba6f0279-84cd-5b11-97df-a2ca67e9f166
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_museum_collection_items_fetched_at
  tableCalculations: []
name: Museum collection items — observations
slug: fct-museum-collection-items-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_museum_collection_items
version: 1
