chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_feed_remotive_observed_at_day
          yRef:
            field: fct_job_feed_remotive_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct job
    layout:
      xField: fct_job_feed_remotive_observed_at_day
      yField:
      - fct_job_feed_remotive_distinct_entities
  type: cartesian
description: Distinct `job_id` values per observation day for the six companies with the largest retained
  job presence. The remainder is excluded rather than aggregated, and this is a catalogue level rather
  than a flow; days without an extract are absent rather than zero.
metricQuery:
  dimensions:
  - fct_job_feed_remotive_observed_at_day
  - fct_job_feed_remotive_company
  exploreName: fct_job_feed_remotive
  filters: {}
  limit: 5000
  metrics:
  - fct_job_feed_remotive_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_job_feed_remotive_distinct_entities
  - descending: false
    fieldId: fct_job_feed_remotive_observed_at_day
  tableCalculations: []
name: Catalogue jobs by leading company
pivotConfig:
  columns:
  - fct_job_feed_remotive_company
slug: fct-job-feed-remotive-company-levels
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_job_feed_remotive_observed_at_day
  - fct_job_feed_remotive_company
  - fct_job_feed_remotive_distinct_entities
tableName: fct_job_feed_remotive
version: 1
