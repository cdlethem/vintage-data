description: Distinct `event_id` values by source update week, pivoted by the two observed severity values.
  Both severities are retained; weeks without represented updates are absent rather than zero.
metricQuery:
  dimensions:
  - fct_drivebc_event_observations_event_updated_at_week
  - fct_drivebc_event_observations_severity
  exploreName: fct_drivebc_event_observations
  filters: {}
  limit: 5000
  metrics:
  - fct_drivebc_event_observations_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_drivebc_event_observations_distinct_entities
  - descending: false
    fieldId: fct_drivebc_event_observations_event_updated_at_week
  tableCalculations: []
name: Updated events by severity each week
pivotConfig:
