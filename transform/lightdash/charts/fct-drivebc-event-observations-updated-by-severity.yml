chartConfig:
  config:
    columnLimit: 2
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_drivebc_event_observations_event_updated_at_week
          yRef:
            field: fct_drivebc_event_observations_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Event updated at (Week)
      yAxis:
      - name: Distinct event
    layout:
      xField: fct_drivebc_event_observations_event_updated_at_week
      yField:
      - fct_drivebc_event_observations_distinct_entities
