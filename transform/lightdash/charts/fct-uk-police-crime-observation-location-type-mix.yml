chartConfig:
  config:
    columnLimit: 2
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_uk_police_crime_observation_crime_month_month
          yRef:
            field: fct_uk_police_crime_observation_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Crime month (Month)
      yAxis:
      - name: Distinct crime
    layout:
      stack: true
      xField: fct_uk_police_crime_observation_crime_month_month
      yField:
      - fct_uk_police_crime_observation_distinct_entities
  type: cartesian
description: Distinct `crime_id` values per source `crime_month`, stacked by the two publisher-supplied
  `location_type` values — both observed values are retained. The stack describes composition of reported
  records, not independent offence totals.
metricQuery:
  dimensions:
  - fct_uk_police_crime_observation_crime_month_month
  - fct_uk_police_crime_observation_location_type
  exploreName: fct_uk_police_crime_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_uk_police_crime_observation_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_uk_police_crime_observation_distinct_entities
  - descending: false
    fieldId: fct_uk_police_crime_observation_crime_month_month
  tableCalculations: []
name: Crime mix by location type
pivotConfig:
