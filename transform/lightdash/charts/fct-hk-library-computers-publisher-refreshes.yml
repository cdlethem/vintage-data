description: Distinct `computer_id` values grouped by the publisher-supplied `publisher_updated_at` day
  and shown for the six largest libraries. The source timestamp covers only five observed days in this
  extract, with older days absent rather than zero; the remainder of libraries is excluded rather than
  aggregated.
