chartConfig:
  config: {}
  type: table
description: Daily physical history of USAspending contract and grant award observations. Each row is
  one award identifier observed in one extractor response at an observation timestamp; repeated raw copies
  of that award observation are reduced to the latest loaded row while load lineage remains available
  for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_usaspending_award_observations_observed_at
  - fct_usaspending_award_observations_award_record_id
  - fct_usaspending_award_observations_awarding_agency
  - fct_usaspending_award_observations_award_amount
  - fct_usaspending_award_observations_source_loaded_at
  exploreName: fct_usaspending_award_observations
  filters:
    dimensions:
      and:
      - id: 58607d2d-42c6-58a5-ad1d-30429c103af6
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_usaspending_award_observations_observed_at
        values:
        - 30
      id: 1e408edb-f8da-58fb-a79d-d1be6d01868a
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_usaspending_award_observations_observed_at
  tableCalculations: []
name: Usaspending award observations — observations
slug: fct-usaspending-award-observations-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_usaspending_award_observations
version: 1
