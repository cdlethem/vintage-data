chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_avalanche_forecasts_observed_at_day
          yRef:
            field: fct_avalanche_forecasts_distinct_centers
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct forecast centers
    layout:
      xField: fct_avalanche_forecasts_observed_at_day
      yField:
      - fct_avalanche_forecasts_distinct_centers
