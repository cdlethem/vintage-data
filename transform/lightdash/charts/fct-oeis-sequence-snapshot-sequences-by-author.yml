chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_oeis_sequence_snapshot_observed_at_day
          yRef:
            field: fct_oeis_sequence_snapshot_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct sequence
    layout:
      xField: fct_oeis_sequence_snapshot_observed_at_day
      yField:
      - fct_oeis_sequence_snapshot_distinct_entities
  type: cartesian
description: Distinct `sequence_id` values per observation day, compared for the six most represented
  author labels. Remaining authors are excluded rather than aggregated; this describes catalogue composition,
  not author publication volume.
metricQuery:
  dimensions:
  - fct_oeis_sequence_snapshot_observed_at_day
  - fct_oeis_sequence_snapshot_author
  exploreName: fct_oeis_sequence_snapshot
  filters: {}
  limit: 5000
  metrics:
  - fct_oeis_sequence_snapshot_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_oeis_sequence_snapshot_distinct_entities
  - descending: false
    fieldId: fct_oeis_sequence_snapshot_observed_at_day
  tableCalculations: []
name: Distinct sequences by author
pivotConfig:
  columns:
  - fct_oeis_sequence_snapshot_author
slug: fct-oeis-sequence-snapshot-sequences-by-author
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_oeis_sequence_snapshot_observed_at_day
  - fct_oeis_sequence_snapshot_author
  - fct_oeis_sequence_snapshot_distinct_entities
tableName: fct_oeis_sequence_snapshot
version: 1
