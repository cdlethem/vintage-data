chartConfig:
  config:
    columnLimit: 2
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_melbourne_pedestrian_observations_sensing_datetime_hour
          yRef:
            field: fct_melbourne_pedestrian_observations_distinct_pedestrians
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Sensing datetime (Hour)
      yAxis:
      - name: Distinct pedestrian records
    layout:
      xField: fct_melbourne_pedestrian_observations_sensing_datetime_hour
      yField:
      - fct_melbourne_pedestrian_observations_distinct_pedestrians
  type: cartesian
description: Distinct `pedestrian_id` values per sensing hour, pivoted by source feed. The two observed
  feeds are both shown; missing feed-hour combinations are absent rather than zero, and the lines measure
  coverage as well as pedestrian activity.
metricQuery:
  dimensions:
  - fct_melbourne_pedestrian_observations_sensing_datetime_hour
  - fct_melbourne_pedestrian_observations_source
  exploreName: fct_melbourne_pedestrian_observations
  filters: {}
  limit: 5000
  metrics:
  - fct_melbourne_pedestrian_observations_distinct_pedestrians
  sorts:
  - descending: true
    fieldId: fct_melbourne_pedestrian_observations_distinct_pedestrians
  - descending: false
    fieldId: fct_melbourne_pedestrian_observations_sensing_datetime_hour
  tableCalculations: []
name: Pedestrian records by source feed per hour
pivotConfig:
  columns:
  - fct_melbourne_pedestrian_observations_source
slug: fct-melbourne-pedestrian-observations-feed-comparison
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_melbourne_pedestrian_observations_sensing_datetime_hour
  - fct_melbourne_pedestrian_observations_source
  - fct_melbourne_pedestrian_observations_distinct_pedestrians
tableName: fct_melbourne_pedestrian_observations
version: 1
