description: Distinct `rikishi_id` values stacked by snapshot `rank_division` for the prior 365 UTC days.
  A rikishi that changed division may occur in more than one group or date, so stacks are not additive
  across time or categories; sparse/null event timestamps are excluded. Source is sumo-api.com via `extract/sources/sumo.yml`.
