chartConfig:
  config:
    columnLimit: 3
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_ema_medicine_shortage_last_updated_date_month
          yRef:
            field: fct_ema_medicine_shortage_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Last updated date (Month)
      yAxis:
      - name: Distinct shortage
    layout:
      stack: true
      xField: fct_ema_medicine_shortage_last_updated_date_month
      yField:
      - fct_ema_medicine_shortage_distinct_entities
  type: cartesian
description: Distinct `shortage_id` values by EMA `last_updated_date` month stacked by status. Only the
  69 rows with a parsed last-updated date appear; null dates and months with no updates are absent rather
  than zero.
metricQuery:
