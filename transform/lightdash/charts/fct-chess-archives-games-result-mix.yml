chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_chess_archives_games_ended_at_month
          yRef:
            field: fct_chess_archives_games_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Ended at (Month)
      yAxis:
      - name: Distinct game
    layout:
      stack: true
      xField: fct_chess_archives_games_ended_at_month
      yField:
      - fct_chess_archives_games_distinct_entities
  type: cartesian
description: Distinct games stacked by the archived player's `player_result` and `ended_at` month. The
  eight largest results are shown; smaller results are excluded rather than aggregated, so the stack is
  not the full game total.
metricQuery:
  dimensions:
  - fct_chess_archives_games_ended_at_month
  - fct_chess_archives_games_player_result
  exploreName: fct_chess_archives_games
  filters: {}
  limit: 5000
  metrics:
  - fct_chess_archives_games_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_chess_archives_games_distinct_entities
  - descending: false
    fieldId: fct_chess_archives_games_ended_at_month
  tableCalculations: []
name: Monthly game mix by player result
pivotConfig:
  columns:
  - fct_chess_archives_games_player_result
slug: fct-chess-archives-games-result-mix
spaceSlug: vintage-marts
tableConfig:
