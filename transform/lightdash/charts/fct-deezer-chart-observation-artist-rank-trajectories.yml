chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_deezer_chart_observation_observed_at_day
          yRef:
            field: fct_deezer_chart_observation_average_chart_position
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed chart position
    layout:
      xField: fct_deezer_chart_observation_observed_at_day
      yField:
      - fct_deezer_chart_observation_average_chart_position
  type: cartesian
description: Average one-based `chart_position` per `observed_at` day, pivoted by the six artists with
  the most retained observations. Other artists are excluded rather than aggregated, and lower positions
  indicate stronger chart rank.
metricQuery:
  dimensions:
  - fct_deezer_chart_observation_observed_at_day
  - fct_deezer_chart_observation_artist_name
  exploreName: fct_deezer_chart_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_deezer_chart_observation_average_chart_position
  sorts:
  - descending: true
    fieldId: fct_deezer_chart_observation_average_chart_position
  - descending: false
    fieldId: fct_deezer_chart_observation_observed_at_day
  tableCalculations: []
name: Mean chart position by leading artist
pivotConfig:
  columns:
  - fct_deezer_chart_observation_artist_name
slug: fct-deezer-chart-observation-artist-rank-trajectories
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_deezer_chart_observation_observed_at_day
  - fct_deezer_chart_observation_artist_name
  - fct_deezer_chart_observation_average_chart_position
tableName: fct_deezer_chart_observation
version: 1
