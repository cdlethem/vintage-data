chartConfig:
  config: {}
  type: table
description: Daily physical history of job observations returned by Ashby applicant-tracking-system boards.
  Each row represents one upstream source, job identifier, and extractor observation timestamp; repeated
  raw copies of an observation are reduced to the latest loaded lineage record while listing attributes
  and load metadata remain available for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_job_boards_ashby_observed_at
  - fct_job_boards_ashby_job_id
  - fct_job_boards_ashby_company
  - fct_job_boards_ashby_source_loaded_at
  exploreName: fct_job_boards_ashby
  filters:
    dimensions:
      and:
      - id: e2d723d7-3c98-5307-8c3a-e6f76ed6bd34
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_job_boards_ashby_observed_at
        values:
        - 30
      id: 0e3c8508-d0b3-559e-b3d5-f7bb15a4dade
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_job_boards_ashby_observed_at
  tableCalculations: []
name: Job boards ashby — observations
slug: fct-job-boards-ashby-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_job_boards_ashby
version: 1
