description: Distinct `item_id` values present on each UTC `observed_at` collection day in the past 90
  days. This is a catalogue level for the bounded, changing robotics-search slice, not a flow of new Library
  of Congress items or a catalogue census. Missing collection days are absent rather than zero, and repeated
  observations within a day count once.
