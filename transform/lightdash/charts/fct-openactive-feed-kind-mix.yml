chartConfig:
  config:
    columnLimit: 4
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_openactive_feed_starts_at_month
          yRef:
            field: fct_openactive_feed_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Starts at (Month)
      yAxis:
      - name: Distinct record
    layout:
      stack: true
      xField: fct_openactive_feed_starts_at_month
      yField:
      - fct_openactive_feed_distinct_entities
  type: cartesian
description: Distinct `record_id` values per scheduled start month stacked by the leading OpenActive kinds.
  Remaining kinds are excluded rather than aggregated, and future months show scheduled supply rather
  than completed activity.
metricQuery:
  dimensions:
  - fct_openactive_feed_starts_at_month
  - fct_openactive_feed_kind
  exploreName: fct_openactive_feed
  filters:
    dimensions:
      and:
      - id: bc23576d-651e-5350-bebb-d35d802189c7
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_openactive_feed_observed_at
        values:
        - 2
      id: 11eccf86-00e6-5186-8a53-85901e679a5e
  limit: 5000
  metrics:
  - fct_openactive_feed_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_openactive_feed_distinct_entities
  - descending: false
    fieldId: fct_openactive_feed_starts_at_month
  tableCalculations: []
name: Scheduled records by OpenActive kind
pivotConfig:
  columns:
  - fct_openactive_feed_kind
slug: fct-openactive-feed-kind-mix
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_openactive_feed_starts_at_month
  - fct_openactive_feed_kind
  - fct_openactive_feed_distinct_entities
tableName: fct_openactive_feed
version: 1
