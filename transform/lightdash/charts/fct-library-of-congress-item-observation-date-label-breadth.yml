description: Distinct non-null `item_date` labels represented on each UTC `observed_at` collection day
  in the past 90 days. This is catalogue breadth for the bounded, changing slice, not a flow of dated
  events; labels are free-form source text. Missing collection days are absent rather than zero, and repeated
  observations within a day do not increase the count.
