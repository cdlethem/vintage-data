chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_tsa_throughput_throughput_date_week
          yRef:
            field: fct_tsa_throughput_average_passengers
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Throughput date (Week)
      yAxis:
      - name: Mean observed passengers
    layout:
      xField: fct_tsa_throughput_throughput_date_week
      yField:
      - fct_tsa_throughput_average_passengers
  type: cartesian
description: Mean `passengers` reported for throughput dates in each week of the published history. This
  is an observation-weighted level rather than a summed passenger total, so repeated snapshots and polling
  frequency affect the mean; weeks without a report are absent rather than zero.
metricQuery:
  dimensions:
  - fct_tsa_throughput_throughput_date_week
  exploreName: fct_tsa_throughput
  filters: {}
  limit: 5000
  metrics:
  - fct_tsa_throughput_average_passengers
  sorts:
  - descending: false
    fieldId: fct_tsa_throughput_throughput_date_week
  tableCalculations: []
name: Mean passengers reported each throughput week
slug: fct-tsa-throughput-weekly-passenger-level
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_tsa_throughput_throughput_date_week
  - fct_tsa_throughput_average_passengers
tableName: fct_tsa_throughput
version: 1
