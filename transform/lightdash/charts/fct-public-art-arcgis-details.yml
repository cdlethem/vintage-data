chartConfig:
  config: {}
  type: table
description: Daily physical history of public-art features published through ArcGIS. Each row is one source
  feature at one extractor observation timestamp; repeated copies delivered by later raw loads are reduced
  to the latest loaded record while raw-load lineage is retained. The two observed municipal feeds are
  normalized into common artwork, location, geometry, and source-publisher fields without discarding the
  source layer URL.
metricQuery:
  dimensions: &id001
  - fct_public_art_arcgis_observed_at
  - fct_public_art_arcgis_feature_id
  - fct_public_art_arcgis_category
  - fct_public_art_arcgis_source_loaded_at
  exploreName: fct_public_art_arcgis
  filters:
    dimensions:
      and:
      - id: f42c03d8-f25b-504a-95b6-9ff9132c3a35
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_public_art_arcgis_observed_at
        values:
        - 30
      id: ed7b7d58-429b-50d1-b354-4b81822b069e
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_public_art_arcgis_observed_at
  tableCalculations: []
name: Public art arcgis — observations
slug: fct-public-art-arcgis-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_public_art_arcgis
version: 1
