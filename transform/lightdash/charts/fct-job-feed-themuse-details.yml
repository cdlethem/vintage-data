chartConfig:
  config: {}
  type: table
description: Daily physical history of The Muse job observations. Each row represents one The Muse job
  identifier from one extractor response at an observed timestamp; repeated raw ingestion of the same
  observation is reduced to the latest loaded copy while load-layer lineage remains available for audit
  and replay.
metricQuery:
  dimensions: &id001
  - fct_job_feed_themuse_observed_at
  - fct_job_feed_themuse_job_id
  - fct_job_feed_themuse_company
  - fct_job_feed_themuse_source_loaded_at
  exploreName: fct_job_feed_themuse
  filters:
    dimensions:
      and:
      - id: b70dcf91-8e9a-5359-8af2-a8e35930d59d
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_job_feed_themuse_observed_at
        values:
        - 30
      id: a0420279-fcaf-5e46-ac10-ca3a114a6f6d
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_job_feed_themuse_observed_at
  tableCalculations: []
name: Job feed themuse — observations
slug: fct-job-feed-themuse-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_job_feed_themuse
version: 1
