  exploreName: fct_openfda_recall_observation
  filters:
    dimensions:
      and:
      - id: e064fbe2-5aa4-5373-ae65-d4f2f7658bb5
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_openfda_recall_observation_report_date
        values:
        - 30
      id: f0258454-1285-59d8-aec0-fb753726eb5c
  limit: 5000
  metrics:
  - fct_openfda_recall_observation_distinct_recalls
  sorts:
