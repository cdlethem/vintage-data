  - fct_socrata_civic_incident_event_at_hour
  - fct_socrata_civic_incident_incident_type
  exploreName: fct_socrata_civic_incident
  filters: {}
  limit: 5000
  metrics:
  - fct_socrata_civic_incident_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_socrata_civic_incident_distinct_entities
  - descending: false
    fieldId: fct_socrata_civic_incident_event_at_hour
  tableCalculations: []
name: Incident level by type
pivotConfig:
