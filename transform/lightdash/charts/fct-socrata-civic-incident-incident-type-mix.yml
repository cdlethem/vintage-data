chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_socrata_civic_incident_event_at_hour
          yRef:
            field: fct_socrata_civic_incident_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Event at (Hour)
      yAxis:
      - name: Distinct record
    layout:
      stack: true
      xField: fct_socrata_civic_incident_event_at_hour
      yField:
      - fct_socrata_civic_incident_distinct_entities
  type: cartesian
description: Distinct `record_id` values per source event hour, stacked by `incident_type`. The eight
  largest types by metric are shown; the remainder is excluded rather than aggregated. This is a five-day
  level view, not a historical incident-rate series, and empty hours are absent rather than zero.
metricQuery:
