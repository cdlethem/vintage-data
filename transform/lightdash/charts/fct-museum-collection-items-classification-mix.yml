chartConfig:
  config:
    columnLimit: 5
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_museum_collection_items_fetched_at_day
          yRef:
            field: fct_museum_collection_items_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Fetched at (Day)
      yAxis:
      - name: Distinct id
    layout:
      stack: true
      xField: fct_museum_collection_items_fetched_at_day
      yField:
      - fct_museum_collection_items_distinct_entities
  type: cartesian
description: Distinct `id` values per fetched day stacked by museum `classification`. The five observed
  classifications are all shown here; categories outside the selected top five would be excluded rather
  than aggregated.
metricQuery:
  dimensions:
  - fct_museum_collection_items_fetched_at_day
  - fct_museum_collection_items_classification
  exploreName: fct_museum_collection_items
  filters: {}
  limit: 5000
  metrics:
  - fct_museum_collection_items_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_museum_collection_items_distinct_entities
  - descending: false
    fieldId: fct_museum_collection_items_fetched_at_day
  tableCalculations: []
name: Catalogue composition by classification
pivotConfig:
  columns:
  - fct_museum_collection_items_classification
slug: fct-museum-collection-items-classification-mix
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_museum_collection_items_fetched_at_day
  - fct_museum_collection_items_classification
  - fct_museum_collection_items_distinct_entities
tableName: fct_museum_collection_items
version: 1
