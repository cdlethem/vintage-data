chartConfig:
  config: {}
  type: table
description: Daily physical history of specialist-treatment queue observations published by Poland's National
  Health Fund (NFZ). Each row records one provider queue returned by the configured outpatient search
  at a fetch timestamp, including published situation dates, available provider wait statistics, and raw-load
  lineage.
metricQuery:
  dimensions: &id001
  - fct_poland_treatment_queues_observed_at
  - fct_poland_treatment_queues_queue_id
  - fct_poland_treatment_queues_benefit_name
  - fct_poland_treatment_queues_source_loaded_at
  exploreName: fct_poland_treatment_queues
  filters:
    dimensions:
      and:
      - id: cccb3dd2-4c1a-55ae-a7ba-75814614e0a8
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_poland_treatment_queues_observed_at
        values:
        - 30
      id: a92c85c1-e7df-5365-94cd-12123f6632c4
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_poland_treatment_queues_observed_at
  tableCalculations: []
name: Poland treatment queues — observations
slug: fct-poland-treatment-queues-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_poland_treatment_queues
version: 1
