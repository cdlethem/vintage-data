chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_speedrun_run_run_date_month
          yRef:
            field: fct_speedrun_run_average_duration_seconds
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Run date (Month)
      yAxis:
      - name: Mean observed duration seconds
    layout:
      xField: fct_speedrun_run_run_date_month
      yField:
      - fct_speedrun_run_average_duration_seconds
  type: cartesian
description: Mean `duration_seconds` for runs whose published `run_date` falls in each month. Each run
  has equal weight and this is not an additive total; months with no recorded runs are absent rather than
  zero.
