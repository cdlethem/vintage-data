  dimensions:
  - fct_speedrun_run_run_date_month
  exploreName: fct_speedrun_run
  filters: {}
  limit: 5000
  metrics:
  - fct_speedrun_run_average_duration_seconds
  sorts:
  - descending: false
    fieldId: fct_speedrun_run_run_date_month
  tableCalculations: []
name: Mean completion duration by run month
slug: fct-speedrun-run-duration-by-month
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_speedrun_run_run_date_month
  - fct_speedrun_run_average_duration_seconds
tableName: fct_speedrun_run
version: 1
