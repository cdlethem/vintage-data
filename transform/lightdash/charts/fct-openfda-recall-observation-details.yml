chartConfig:
  config: {}
  type: table
description: Physical observation fact for openFDA food-enforcement recalls. Each row is one source, recall
  identifier, and UTC fetch timestamp. Daily polling republishes recalls, so the mart is append-only observation
  history rather than SCD2; duplicate copies at that grain retain the latest load and file-row lineage.
  openFDA can revise records and publishes batch updates over days or weeks, so observations are neither
  real-time alerts nor proof of when a recall first became public.
metricQuery:
  dimensions: &id001
  - fct_openfda_recall_observation_observed_at
  - fct_openfda_recall_observation_recall_id
  - fct_openfda_recall_observation_firm
  - fct_openfda_recall_observation_classification
  - fct_openfda_recall_observation_status
  - fct_openfda_recall_observation_country
  - fct_openfda_recall_observation_report_date
  - fct_openfda_recall_observation_source_loaded_at
  exploreName: fct_openfda_recall_observation
  filters:
    dimensions:
      and:
      - id: aa1ff1a4-2d36-5435-9862-62757aff6f5d
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_openfda_recall_observation_observed_at
        values:
        - 30
      id: 486363e2-1b93-5544-a9f6-e74eada19958
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_openfda_recall_observation_observed_at
  tableCalculations: []
name: OpenFDA recall observation — observations
slug: fct-openfda-recall-observation-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_openfda_recall_observation
version: 1
