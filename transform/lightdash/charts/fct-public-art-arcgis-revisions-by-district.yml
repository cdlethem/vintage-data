chartConfig:
  config:
    columnLimit: 12
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_public_art_arcgis_external_modified_at_month
          yRef:
            field: fct_public_art_arcgis_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: External modified at (Month)
      yAxis:
      - name: Distinct feature
    layout:
      stack: true
      xField: fct_public_art_arcgis_external_modified_at_month
      yField:
      - fct_public_art_arcgis_distinct_entities
  type: cartesian
description: Distinct `feature_id` values whose `external_modified_at` falls in the month, stacked by
  district, over all published revision history. Stacked bars rather than lines because revisions arrive
  in rare bulk republications and a line would read as a flat zero between them. Only the districted Phoenix-area
  feed populates a revision timestamp, so this covers that subset and features without one never appear.
metricQuery:
  dimensions:
  - fct_public_art_arcgis_external_modified_at_month
  - fct_public_art_arcgis_category
  exploreName: fct_public_art_arcgis
  filters: {}
  limit: 5000
  metrics:
  - fct_public_art_arcgis_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_public_art_arcgis_distinct_entities
  - descending: false
    fieldId: fct_public_art_arcgis_external_modified_at_month
  tableCalculations: []
name: Artworks revised by the publisher each month, by district
pivotConfig:
  columns:
  - fct_public_art_arcgis_category
slug: fct-public-art-arcgis-revisions-by-district
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_public_art_arcgis_external_modified_at_month
  - fct_public_art_arcgis_category
  - fct_public_art_arcgis_distinct_entities
tableName: fct_public_art_arcgis
version: 1
