chartConfig:
  config: {}
  type: table
description: Daily physical history of job observations returned by SmartRecruiters applicant-tracking-system
  boards. Each row represents one upstream source, job identifier, and extractor observation timestamp;
  repeated raw copies of an observation are reduced to the latest loaded lineage record while listing
  attributes and load metadata remain available for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_job_boards_smartrecruiters_observed_at
  - fct_job_boards_smartrecruiters_job_id
  - fct_job_boards_smartrecruiters_company
  - fct_job_boards_smartrecruiters_source_loaded_at
  exploreName: fct_job_boards_smartrecruiters
  filters:
    dimensions:
      and:
      - id: 6d71fbd8-76d0-5ead-9604-1e7573457952
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_job_boards_smartrecruiters_observed_at
        values:
        - 30
      id: f4a67177-6050-57d1-8532-060f0b721859
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_job_boards_smartrecruiters_observed_at
  tableCalculations: []
name: Job boards smartrecruiters — observations
slug: fct-job-boards-smartrecruiters-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_job_boards_smartrecruiters
version: 1
