      and:
      - id: e28f8fa8-b229-562a-80db-b22ee9194f04
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_openfda_recall_observation_recall_initiation_date
        values:
