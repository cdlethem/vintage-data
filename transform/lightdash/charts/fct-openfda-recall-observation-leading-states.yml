description: Distinct `recall_id` values by reported `state` and FDA `recall_initiation_date` during the
  past 180 days. Only the six states with the largest recall totals are shown; others are excluded rather
  than aggregated, repeated fetches count once per state and day, and records with missing initiation dates
  and dates without recalls are absent.
metricQuery:
