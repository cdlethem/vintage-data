chartConfig:
  config: {}
  type: table
description: Twice-hourly physical history of theme-park attraction queue observations. Each row records
  one ride's reported wait at a source snapshot, including park, land, operating status, update timestamp,
  and raw-load lineage. Repeated insert-only raw records for the same source, ride, and observation timestamp
  are reduced to the latest loaded record.
metricQuery:
  dimensions: &id001
  - fct_queue_times_observed_at
  - fct_queue_times_observation_id
  - fct_queue_times_ride
  - fct_queue_times_wait_minutes
  - fct_queue_times_source_loaded_at
  exploreName: fct_queue_times
  filters:
    dimensions:
      and:
      - id: 2ffec96a-f55a-5c86-89f1-a43a8268847d
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_queue_times_observed_at
        values:
        - 30
      - id: 6bf9284e-47e6-546e-b577-0ec3d56ddeed
        operator: equals
        target:
          fieldId: fct_queue_times_is_open
        values:
        - true
      id: 225433e2-abe2-5fe9-bbde-afadc1a9448a
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_queue_times_observed_at
  tableCalculations: []
name: Queue times — observations
slug: fct-queue-times-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_queue_times
version: 1
