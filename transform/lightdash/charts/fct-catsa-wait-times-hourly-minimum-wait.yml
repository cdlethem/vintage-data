chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_catsa_wait_times_observed_at_hour
          yRef:
            field: fct_catsa_wait_times_average_wait_time_min_minutes
        type: line
        yAxisIndex: 0
