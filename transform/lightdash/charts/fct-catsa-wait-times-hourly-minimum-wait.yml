  exploreName: fct_catsa_wait_times
  filters:
    dimensions:
      and:
      - id: 5ec13ca2-b4c8-5e03-8e8c-0c19f1b22e08
        operator: equals
        target:
          fieldId: fct_catsa_wait_times_wait_time_available
        values:
        - true
      id: 07870131-0680-5ce7-ad2f-30f9d9bf3185
  limit: 5000
  metrics:
  - fct_catsa_wait_times_average_wait_time_min_minutes
  sorts:
  - descending: false
    fieldId: fct_catsa_wait_times_observed_at_hour
  tableCalculations: []
name: Mean lower wait bound per hour
