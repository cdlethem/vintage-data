description: Mean observed price amount by `item_code` in the selected observation window. The window
  is one day because the mart was seeded with a 126-million-row historical backfill on a single collection
  day and now receives roughly a hundred rows per poll, so a longer window is dominated by that one backfill.
  Price amount reported for the item at the premise on the price date, parsed to four decimal places.
  Each retained observation has equal weight; polling frequency and repeated snapshots can affect the
  mean. This is not a latest-value measure or an additive total.
