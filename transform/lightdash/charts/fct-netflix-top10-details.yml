        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_netflix_top10_fetched_at
        values:
        - 30
      id: 3eb7d4f9-62e7-55a8-85b4-715aa0abd870
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_netflix_top10_fetched_at
  tableCalculations: []
