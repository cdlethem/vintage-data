  type: table
description: Daily-refreshed physical fact of Netflix Top 10 observations. Each row is one weekly title
  rank within a geographic scope and category, with repeated insert-only loads reduced to the latest copy
  and raw-load lineage retained.
metricQuery:
  dimensions: &id001
  - fct_netflix_top10_fetched_at
  - fct_netflix_top10_title_id
  - fct_netflix_top10_category
  - fct_netflix_top10_weekly_hours_viewed
  - fct_netflix_top10_source_loaded_at
