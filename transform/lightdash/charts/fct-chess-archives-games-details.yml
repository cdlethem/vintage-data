        target:
          fieldId: fct_chess_archives_games_fetched_at
        values:
        - 30
      id: c9d5ff35-f886-571a-b7ae-680a1db15f3f
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_chess_archives_games_fetched_at
