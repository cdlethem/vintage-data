chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_boards_rippling_observed_at_day
          yRef:
            field: fct_job_boards_rippling_distinct_companies
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct company
    layout:
      stack: true
      xField: fct_job_boards_rippling_observed_at_day
      yField:
      - fct_job_boards_rippling_distinct_companies
  type: cartesian
description: Distinct non-null `company` values present on each observation day stacked by `department`.
  The eight largest departments are retained and smaller departments are excluded rather than aggregated.
  A company can occur in multiple departments, so segments are not additive; this describes the observed
  catalogue level, not new jobs.
metricQuery:
  dimensions:
  - fct_job_boards_rippling_observed_at_day
  - fct_job_boards_rippling_department
  exploreName: fct_job_boards_rippling
  filters: {}
  limit: 5000
  metrics:
  - fct_job_boards_rippling_distinct_companies
  sorts:
  - descending: true
    fieldId: fct_job_boards_rippling_distinct_companies
  - descending: false
    fieldId: fct_job_boards_rippling_observed_at_day
  tableCalculations: []
name: Hiring-company mix by department
pivotConfig:
  columns:
  - fct_job_boards_rippling_department
slug: fct-job-boards-rippling-departments-observed
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_job_boards_rippling_observed_at_day
  - fct_job_boards_rippling_department
  - fct_job_boards_rippling_distinct_companies
tableName: fct_job_boards_rippling
version: 1
