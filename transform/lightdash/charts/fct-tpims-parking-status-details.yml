chartConfig:
  config: {}
  type: table
description: Twice-hourly physical observation fact for truck-parking status snapshots published by TPIMS.
  Each row represents one parking site at one extractor observation time, with reported availability,
  operational flags, publisher timestamps, and raw load lineage. Repeated copies of the same observation
  grain retain the latest loaded row.
metricQuery:
  dimensions: &id001
  - fct_tpims_parking_status_observed_at
  - fct_tpims_parking_status_parking_id
  - fct_tpims_parking_status_region
  - fct_tpims_parking_status_reported_available_count
  - fct_tpims_parking_status_source_loaded_at
  exploreName: fct_tpims_parking_status
  filters:
    dimensions:
      and:
      - id: 228ed6c6-6dc2-5d70-b022-8a74e6aca5e6
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_tpims_parking_status_observed_at
        values:
        - 30
      - id: c04a05d1-4079-55af-9d0a-e43df8fa4096
        operator: equals
        target:
          fieldId: fct_tpims_parking_status_trusts_data
        values:
        - true
      id: 81457c72-f93a-58e0-80a4-53aebb370c79
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_tpims_parking_status_observed_at
  tableCalculations: []
name: Tpims parking status — observations
slug: fct-tpims-parking-status-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_tpims_parking_status
version: 1
