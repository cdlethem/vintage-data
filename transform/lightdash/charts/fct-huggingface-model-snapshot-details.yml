chartConfig:
  config: {}
  type: table
description: Twice-hourly physical history of models returned by the Hugging Face model catalog. Each
  row is one model from one catalog observation, identified by the source, model identifier, and fetch
  timestamp. If the same observation is loaded more than once, the latest load copy is kept while its
  raw lineage remains available.
metricQuery:
  dimensions: &id001
  - fct_huggingface_model_snapshot_observed_at
  - fct_huggingface_model_snapshot_model_id
  - fct_huggingface_model_snapshot_author
  - fct_huggingface_model_snapshot_like_count
  - fct_huggingface_model_snapshot_source_loaded_at
  exploreName: fct_huggingface_model_snapshot
  filters:
    dimensions:
      and:
      - id: 032eb7cf-1c5b-53da-bec3-67b33aba75ba
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_huggingface_model_snapshot_observed_at
        values:
        - 30
      id: 615463f2-3933-5916-90f0-1ce5e1becab7
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_huggingface_model_snapshot_observed_at
  tableCalculations: []
name: Huggingface model snapshot — observations
slug: fct-huggingface-model-snapshot-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_huggingface_model_snapshot
version: 1
