      xAxis:
      - name: Incident begin at (Day)
      yAxis:
      - name: Distinct declaration
    layout:
      xField: fct_openfema_declaration_observation_incident_begin_at_day
      yField:
      - fct_openfema_declaration_observation_distinct_entities
