  type: table
description: Daily physical snapshot of organizations recognized as tax-exempt by the United States Internal
  Revenue Service. Each row is one employer identification number observed at one extractor fetch timestamp;
  repeated raw copies of a snapshot row are reduced to the latest loaded copy while source lineage is
  retained for audit.
metricQuery:
