      - id: b392c74e-189e-5e0a-b791-89e2efd091d2
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_irs_exempt_organizations_fetched_at
        values:
        - 30
      id: fd1cc97b-7db3-5c21-b642-469cae58c075
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_irs_exempt_organizations_fetched_at
