          xRef:
            field: fct_open_library_change_event_timestamp_day
          yRef:
            field: fct_open_library_change_average_change_count
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Event timestamp (Day)
      yAxis:
      - name: Mean changed keys
    layout:
      stack: true
      xField: fct_open_library_change_event_timestamp_day
      yField:
      - fct_open_library_change_average_change_count
