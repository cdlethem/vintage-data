chartConfig:
  config:
    columnLimit: 3
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_boards_personio_posted_month
          yRef:
            field: fct_job_boards_personio_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Posted (Month)
      yAxis:
      - name: Distinct job
    layout:
      xField: fct_job_boards_personio_posted_month
      yField:
      - fct_job_boards_personio_distinct_entities
  type: cartesian
description: Distinct `job_id` values by Personio `posted` month, pivoted by `company_country`. The three
  countries are retained because all observed countries fit; no remainder is excluded. This is a flow
  and not a count of currently open jobs.
metricQuery:
  dimensions:
  - fct_job_boards_personio_posted_month
  - fct_job_boards_personio_company_country
  exploreName: fct_job_boards_personio
  filters: {}
  limit: 5000
  metrics:
  - fct_job_boards_personio_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_job_boards_personio_distinct_entities
  - descending: false
    fieldId: fct_job_boards_personio_posted_month
  tableCalculations: []
name: Jobs posted per month by company country
pivotConfig:
  columns:
  - fct_job_boards_personio_company_country
slug: fct-job-boards-personio-postings-by-country
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_job_boards_personio_posted_month
  - fct_job_boards_personio_company_country
  - fct_job_boards_personio_distinct_entities
tableName: fct_job_boards_personio
version: 1
