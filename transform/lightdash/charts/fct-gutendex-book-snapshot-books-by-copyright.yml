chartConfig:
  config:
    columnLimit: 2
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_gutendex_book_snapshot_fetched_at_day
          yRef:
            field: fct_gutendex_book_snapshot_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Fetched at (Day)
      yAxis:
      - name: Distinct book
    layout:
      xField: fct_gutendex_book_snapshot_fetched_at_day
      yField:
      - fct_gutendex_book_snapshot_distinct_entities
  type: cartesian
description: Distinct `book_id` values per fetch day pivoted by the Gutendex `copyright` flag. The current
  five-day extract has one observed False category, so no remainder is aggregated and a missing category
  is absent rather than zero.
metricQuery:
  dimensions:
  - fct_gutendex_book_snapshot_fetched_at_day
  - fct_gutendex_book_snapshot_copyright
  exploreName: fct_gutendex_book_snapshot
  filters: {}
  limit: 5000
  metrics:
  - fct_gutendex_book_snapshot_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_gutendex_book_snapshot_distinct_entities
  - descending: false
    fieldId: fct_gutendex_book_snapshot_fetched_at_day
  tableCalculations: []
name: Snapshot books by copyright flag
pivotConfig:
  columns:
  - fct_gutendex_book_snapshot_copyright
slug: fct-gutendex-book-snapshot-books-by-copyright
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_gutendex_book_snapshot_fetched_at_day
  - fct_gutendex_book_snapshot_copyright
  - fct_gutendex_book_snapshot_distinct_entities
tableName: fct_gutendex_book_snapshot
version: 1
