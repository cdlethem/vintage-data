chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_boards_personio_posted_month
          yRef:
            field: fct_job_boards_personio_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Posted (Month)
      yAxis:
      - name: Distinct job
    layout:
      stack: true
      xField: fct_job_boards_personio_posted_month
      yField:
      - fct_job_boards_personio_distinct_entities
  type: cartesian
description: Distinct `job_id` values by `posted` month stacked by `company_industry`. Bars show how the
  industry mix changes, while the eight largest industries by metric are retained and smaller industries
  are excluded rather than aggregated.
metricQuery:
  dimensions:
  - fct_job_boards_personio_posted_month
  - fct_job_boards_personio_company_industry
  exploreName: fct_job_boards_personio
  filters: {}
  limit: 5000
  metrics:
  - fct_job_boards_personio_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_job_boards_personio_distinct_entities
  - descending: false
    fieldId: fct_job_boards_personio_posted_month
  tableCalculations: []
name: Monthly posting mix by company industry
pivotConfig:
