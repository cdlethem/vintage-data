  type: cartesian
description: Distinct `id` values revised on each `modifiedon` source-event day in the rolling 30-day
  UTC window, compared across the seven largest legal-structure groups. Remaining groups are excluded,
  not aggregated. Repeated snapshots count once within a day and group, but groups and days are non-additive
  SCD2-like revision history; empty results do not prove zero activity.
