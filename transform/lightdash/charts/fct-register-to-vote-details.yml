chartConfig:
  config: {}
  type: table
description: Physical observations of the UK register-to-vote usage feed. Each row is one source registration
  observation at one fetch timestamp, retaining the publisher timestamp, reported application count, and
  load lineage. Exact replayed observations are reduced to the latest loaded copy.
metricQuery:
  dimensions: &id001
  - fct_register_to_vote_observed_at
  - fct_register_to_vote_registration_observation_id
  - fct_register_to_vote_published_at
  - fct_register_to_vote_application_count
  - fct_register_to_vote_source_loaded_at
  exploreName: fct_register_to_vote
  filters:
    dimensions:
      and:
      - id: c243adb8-8862-5c6c-b375-01d772414765
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_register_to_vote_observed_at
        values:
        - 30
      id: 189cbf25-4fbb-54c8-94d2-386bfca4e1cc
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_register_to_vote_observed_at
  tableCalculations: []
name: Register to vote — observations
slug: fct-register-to-vote-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_register_to_vote
version: 1
