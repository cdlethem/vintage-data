chartConfig:
  config:
    columnLimit: 4
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_launch_library_last_updated_day
          yRef:
            field: fct_launch_library_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Last updated (Day)
      yAxis:
      - name: Distinct launch
    layout:
      xField: fct_launch_library_last_updated_day
      yField:
      - fct_launch_library_distinct_entities
  type: cartesian
description: Distinct launches whose upstream `last_updated` falls on each day, split by `status_name`.
  All four observed statuses are retained; absent update days are absent rather than zero, and status
  groups are not additive when a launch changes status.
metricQuery:
  dimensions:
  - fct_launch_library_last_updated_day
  - fct_launch_library_status_name
  exploreName: fct_launch_library
  filters: {}
  limit: 5000
  metrics:
  - fct_launch_library_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_launch_library_distinct_entities
  - descending: false
    fieldId: fct_launch_library_last_updated_day
  tableCalculations: []
name: Updated launches by status
pivotConfig:
  columns:
  - fct_launch_library_status_name
slug: fct-launch-library-status-updates
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_launch_library_last_updated_day
  - fct_launch_library_status_name
  - fct_launch_library_distinct_entities
tableName: fct_launch_library
version: 1
