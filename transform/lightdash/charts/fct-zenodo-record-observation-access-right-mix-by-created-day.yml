chartConfig:
  config:
    columnLimit: 3
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_zenodo_record_observation_created_at_day
          yRef:
            field: fct_zenodo_record_observation_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Created at (Day)
      yAxis:
      - name: Distinct record
    layout:
      stack: true
      xField: fct_zenodo_record_observation_created_at_day
      yField:
      - fct_zenodo_record_observation_distinct_entities
  type: cartesian
description: Distinct `record_id` values per UTC creation day stacked by access-right category. All three
  observed access-right values are shown, so each bar describes the day's created record mix; absent event
  days are absent rather than zero.
metricQuery:
  dimensions:
  - fct_zenodo_record_observation_created_at_day
  - fct_zenodo_record_observation_access_right
  exploreName: fct_zenodo_record_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_zenodo_record_observation_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_zenodo_record_observation_distinct_entities
  - descending: false
    fieldId: fct_zenodo_record_observation_created_at_day
  tableCalculations: []
name: Created records by access right
pivotConfig:
  columns:
  - fct_zenodo_record_observation_access_right
slug: fct-zenodo-record-observation-access-right-mix-by-created-day
spaceSlug: vintage-marts
tableConfig:
