chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_radio_browser_station_snapshot_observed_at_day
          yRef:
            field: fct_radio_browser_station_snapshot_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct station
    layout:
      stack: true
      xField: fct_radio_browser_station_snapshot_observed_at_day
      yField:
      - fct_radio_browser_station_snapshot_distinct_entities
