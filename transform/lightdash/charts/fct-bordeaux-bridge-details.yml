chartConfig:
  config: {}
  type: table
description: Physical history of Bordeaux bridge status observations. Each row is one bridge returned
  by the source at one observation timestamp; repeated raw deliveries of the same observation retain only
  the latest loaded copy while preserving source-file lineage.
metricQuery:
  dimensions: &id001
  - fct_bordeaux_bridge_observed_at
  - fct_bordeaux_bridge_bridge_id
  - fct_bordeaux_bridge_bridge_name
  - fct_bordeaux_bridge_source_loaded_at
  exploreName: fct_bordeaux_bridge
  filters:
    dimensions:
      and:
      - id: 941cabac-f5c7-5f94-a449-32efb2730a52
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_bordeaux_bridge_observed_at
        values:
        - 30
      id: c2c8b9ba-b3a8-51aa-9916-9297a46096da
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_bordeaux_bridge_observed_at
  tableCalculations: []
name: Bordeaux bridge — observations
slug: fct-bordeaux-bridge-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_bordeaux_bridge
version: 1
