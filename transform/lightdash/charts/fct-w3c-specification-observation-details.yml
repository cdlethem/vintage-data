chartConfig:
  config: {}
  type: table
description: Daily physical history of W3C specifications returned by the W3C specifications feed. Each
  row represents one specification identifier from one extractor observation timestamp, retaining the
  canonical URL, title, and raw-load lineage. Repeated ingestion of the same source, specification, and
  observation timestamp is reduced to the latest loaded record.
metricQuery:
  dimensions: &id001
  - fct_w3c_specification_observation_observed_at
  - fct_w3c_specification_observation_specification_id
  - fct_w3c_specification_observation_specification_title
  - fct_w3c_specification_observation_source_loaded_at
  exploreName: fct_w3c_specification_observation
  filters:
    dimensions:
      and:
      - id: 569686f1-c76e-5573-8f04-1cfeea5720fe
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_w3c_specification_observation_observed_at
        values:
        - 30
      id: f55d8417-93af-535b-9295-e1890ca921c9
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_w3c_specification_observation_observed_at
  tableCalculations: []
name: W3c specification observation — observations
slug: fct-w3c-specification-observation-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_w3c_specification_observation
version: 1
