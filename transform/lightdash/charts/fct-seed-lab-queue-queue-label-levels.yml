chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_seed_lab_queue_observed_at_day
          yRef:
            field: fct_seed_lab_queue_average_sample_count
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed sample count
    layout:
      xField: fct_seed_lab_queue_observed_at_day
      yField:
      - fct_seed_lab_queue_average_sample_count
  type: cartesian
description: Average reported sample count per snapshot day for the six largest queue labels. The remaining
  labels are excluded rather than aggregated; this is a short four-day level series, and absent label-day
  observations are absent rather than zero.
metricQuery:
