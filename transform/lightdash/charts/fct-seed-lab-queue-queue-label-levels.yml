  - fct_seed_lab_queue_observed_at_day
  - fct_seed_lab_queue_queue_label
  exploreName: fct_seed_lab_queue
  filters: {}
  limit: 5000
  metrics:
  - fct_seed_lab_queue_average_sample_count
  sorts:
  - descending: true
    fieldId: fct_seed_lab_queue_average_sample_count
  - descending: false
    fieldId: fct_seed_lab_queue_observed_at_day
  tableCalculations: []
name: Largest queue labels by snapshot day
pivotConfig:
