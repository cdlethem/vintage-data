chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_queue_times_observed_at_day
          yRef:
            field: fct_queue_times_average_wait_minutes
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed wait minutes
    layout:
      xField: fct_queue_times_observed_at_day
      yField:
      - fct_queue_times_average_wait_minutes
  type: cartesian
description: Average reported `wait_minutes` across retained ride observations on each collection day.
  This is a level of the polled queue feed rather than an additive total; polling frequency weights the
  mean and days with no successful extract are absent rather than zero.
metricQuery:
  dimensions:
  - fct_queue_times_observed_at_day
  exploreName: fct_queue_times
  filters:
    dimensions:
      and:
      - id: bb9ae834-647a-5382-9f2a-91e1556e3095
        operator: equals
        target:
          fieldId: fct_queue_times_is_open
        values:
        - true
      id: 56a5638a-6a80-5c1b-81fa-54450c4eac96
  limit: 5000
  metrics:
  - fct_queue_times_average_wait_minutes
  sorts:
  - descending: false
    fieldId: fct_queue_times_observed_at_day
  tableCalculations: []
name: Mean queue wait observed each day
slug: fct-queue-times-observed-queue-level
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_queue_times_observed_at_day
  - fct_queue_times_average_wait_minutes
tableName: fct_queue_times
version: 1
