chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_open_collective_account_observation_observed_at_day
          yRef:
            field: fct_open_collective_account_observation_average_balance_amount
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed balance amount
    layout:
      xField: fct_open_collective_account_observation_observed_at_day
      yField:
      - fct_open_collective_account_observation_average_balance_amount
  type: cartesian
description: Mean account `balance_amount` per day pivoted by the eight currencies with the largest observed
  populations. The remaining currencies are excluded rather than aggregated, and values are not converted
  so cross-currency heights are not directly comparable.
metricQuery:
  dimensions:
  - fct_open_collective_account_observation_observed_at_day
  - fct_open_collective_account_observation_currency_code
  exploreName: fct_open_collective_account_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_open_collective_account_observation_average_balance_amount
  sorts:
  - descending: true
    fieldId: fct_open_collective_account_observation_average_balance_amount
  - descending: false
    fieldId: fct_open_collective_account_observation_observed_at_day
  tableCalculations: []
name: Mean balance by leading currency
pivotConfig:
  columns:
  - fct_open_collective_account_observation_currency_code
slug: fct-open-collective-account-observation-balance-by-currency
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_open_collective_account_observation_observed_at_day
  - fct_open_collective_account_observation_currency_code
  - fct_open_collective_account_observation_average_balance_amount
tableName: fct_open_collective_account_observation
version: 1
