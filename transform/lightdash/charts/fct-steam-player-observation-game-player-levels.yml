  dimensions:
  - fct_steam_player_observation_observed_at_day
  - fct_steam_player_observation_game_id
  exploreName: fct_steam_player_observation
  filters:
    dimensions:
      and:
      - id: cf3e8202-740b-5b20-bef9-5d86309e7c7e
        operator: equals
        target:
          fieldId: fct_steam_player_observation_request_succeeded
        values:
        - true
      id: b34fb14b-508c-5ddd-a929-73a71f62c04a
  limit: 5000
  metrics:
  - fct_steam_player_observation_average_concurrent_player_count
  sorts:
