chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_steam_player_observation_observed_at_day
          yRef:
            field: fct_steam_player_observation_average_concurrent_player_count
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed concurrent player count
    layout:
      xField: fct_steam_player_observation_observed_at_day
      yField:
      - fct_steam_player_observation_average_concurrent_player_count
