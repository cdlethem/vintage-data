chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_discourse_meta_topic_observation_observed_at_day
          yRef:
            field: fct_discourse_meta_topic_observation_average_views
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed views
    layout:
      xField: fct_discourse_meta_topic_observation_observed_at_day
      yField:
      - fct_discourse_meta_topic_observation_average_views
  type: cartesian
description: Average Discourse `views` counter per observation day, pivoted to the six authors with the
  largest observed view metric over the selected window. Remaining authors are excluded, not aggregated;
  irregular polling can weight authors unevenly.
metricQuery:
  dimensions:
  - fct_discourse_meta_topic_observation_observed_at_day
  - fct_discourse_meta_topic_observation_author
  exploreName: fct_discourse_meta_topic_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_discourse_meta_topic_observation_average_views
  sorts:
  - descending: true
    fieldId: fct_discourse_meta_topic_observation_average_views
  - descending: false
    fieldId: fct_discourse_meta_topic_observation_observed_at_day
  tableCalculations: []
name: Mean observed views by author
pivotConfig:
  columns:
  - fct_discourse_meta_topic_observation_author
slug: fct-discourse-meta-topic-observation-views-by-author
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_discourse_meta_topic_observation_observed_at_day
  - fct_discourse_meta_topic_observation_author
  - fct_discourse_meta_topic_observation_average_views
tableName: fct_discourse_meta_topic_observation
version: 1
