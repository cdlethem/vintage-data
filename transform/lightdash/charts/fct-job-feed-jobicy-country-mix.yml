chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_feed_jobicy_posted_at_day
          yRef:
            field: fct_job_feed_jobicy_distinct_companies
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Posted at (Day)
      yAxis:
      - name: Distinct hiring company
    layout:
      stack: true
      xField: fct_job_feed_jobicy_posted_at_day
      yField:
      - fct_job_feed_jobicy_distinct_companies
  type: cartesian
description: Distinct non-null `company` values per publisher posted day, stacked by the eight largest
  `location_country` values. The remainder is excluded rather than aggregated; repeated listings can recur,
  so this shows observed mix rather than unique hiring organizations over the full history. Empty posted
  days are absent rather than zero.
metricQuery:
  dimensions:
  - fct_job_feed_jobicy_posted_at_day
  - fct_job_feed_jobicy_location_country
  exploreName: fct_job_feed_jobicy
  filters: {}
  limit: 5000
  metrics:
  - fct_job_feed_jobicy_distinct_companies
  sorts:
  - descending: true
    fieldId: fct_job_feed_jobicy_distinct_companies
  - descending: false
    fieldId: fct_job_feed_jobicy_posted_at_day
  tableCalculations: []
name: Hiring-company mix by posting day and country
pivotConfig:
  columns:
  - fct_job_feed_jobicy_location_country
slug: fct-job-feed-jobicy-country-mix
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_job_feed_jobicy_posted_at_day
  - fct_job_feed_jobicy_location_country
  - fct_job_feed_jobicy_distinct_companies
tableName: fct_job_feed_jobicy
version: 1
