description: Distinct `item_id` values by the digitized status reported by the Library of Congress among
  observations collected in the past 30 UTC days. Repeated snapshots count once within each status, but
  an item whose status changes can occur in multiple groups; groups are not additive and do not represent
  a catalogue census.
