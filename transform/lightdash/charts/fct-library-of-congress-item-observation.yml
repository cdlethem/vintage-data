description: Distinct `item_id` values by non-null digitization status reported by the Library of Congress
  among observations collected in the past 30 UTC days. This is a catalogue level for the bounded, changing
  robotics-search slice, not a flow or catalogue census. Repeated observations count once within a status
  group, but items whose category changes can occur in both groups, so the groups are not additive across
  snapshots.
