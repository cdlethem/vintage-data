chartConfig:
  config: {}
  type: table
description: Daily physical history of job observations returned by Workday-hosted recruiting boards.
  Each row represents one source, job identifier, and extractor observation timestamp; repeated raw copies
  of an observation are reduced to the latest loaded lineage record while listing attributes and load
  metadata remain available for audit and replay. A table is used because the profiled source contains
  218,150 rows and is rebuilt daily as a bounded, complete history.
metricQuery:
  dimensions: &id001
  - fct_job_boards_workday_observed_at
  - fct_job_boards_workday_job_id
  - fct_job_boards_workday_company
  - fct_job_boards_workday_source_loaded_at
  exploreName: fct_job_boards_workday
  filters:
    dimensions:
      and:
      - id: b949ebe6-b44c-54c0-b18c-7f19e8b1dfa3
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_job_boards_workday_observed_at
        values:
        - 30
      id: ec41a139-5f72-5bd3-845e-0144b065a64a
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_job_boards_workday_observed_at
  tableCalculations: []
name: Job boards workday — observations
slug: fct-job-boards-workday-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_job_boards_workday
version: 1
