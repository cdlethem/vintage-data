chartConfig:
  config: {}
  type: table
description: Daily physical history of job observations returned by Breezy applicant tracking boards.
  Each row represents one upstream source, job identifier, and extractor observation timestamp; repeated
  raw copies of an observation are reduced to the latest loaded lineage record while listing attributes
  and load metadata remain available for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_job_boards_breezy_observed_at
  - fct_job_boards_breezy_job_id
  - fct_job_boards_breezy_company
  - fct_job_boards_breezy_source_loaded_at
  exploreName: fct_job_boards_breezy
  filters:
    dimensions:
      and:
      - id: 34db201e-ee66-5c9f-bcdc-63e57b59528a
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_job_boards_breezy_observed_at
        values:
        - 30
      id: 4844c55e-8ebe-571c-86a1-2852dd7daa1a
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_job_boards_breezy_observed_at
  tableCalculations: []
name: Job boards breezy — observations
slug: fct-job-boards-breezy-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_job_boards_breezy
version: 1
