description: Mean observed rating by `variant` in the selected observation window. Lichess rating of the
  featured player at the observation timestamp. Each retained observation has equal weight; polling frequency
  and repeated snapshots can affect the mean. This is not a latest-value measure or an additive total.
metricQuery:
  dimensions:
  - fct_lichess_game_observation_variant
  exploreName: fct_lichess_game_observation
  filters:
    dimensions:
      and:
      - id: 28c84fe6-61e4-5a18-8b0b-0c5394ecef21
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_lichess_game_observation_observed_at
        values:
        - 30
      id: fe1124ac-d6a2-5a8a-ad12-cbff9fea6365
  limit: 20
  metrics:
  - fct_lichess_game_observation_average_rating
  sorts:
