    fieldId: fct_faa_nas_status_observation_average_ground_delay_avg_min
  - descending: false
    fieldId: fct_faa_nas_status_observation_source_timestamp_hour
  tableCalculations: []
name: Delay trajectories for the busiest airports
pivotConfig:
