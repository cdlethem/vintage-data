chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_faa_nas_status_observation_source_timestamp_hour
          yRef:
            field: fct_faa_nas_status_observation_average_ground_delay_avg_min
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Source timestamp (Hour)
      yAxis:
      - name: Mean observed ground delay avg min
    layout:
      xField: fct_faa_nas_status_observation_source_timestamp_hour
      yField:
      - fct_faa_nas_status_observation_average_ground_delay_avg_min
  type: cartesian
description: Average non-null FAA ground delay minutes per source timestamp hour, split by the six airports
  with the largest observed values. Remaining airports are excluded rather than aggregated, and null-delay
  observations do not form a zero.
metricQuery:
