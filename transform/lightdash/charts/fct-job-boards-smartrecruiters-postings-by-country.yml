chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_boards_smartrecruiters_posted_at_month
          yRef:
            field: fct_job_boards_smartrecruiters_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Posted at (Month)
      yAxis:
      - name: Distinct job
    layout:
      xField: fct_job_boards_smartrecruiters_posted_at_month
      yField:
      - fct_job_boards_smartrecruiters_distinct_entities
  type: cartesian
description: Distinct `job_id` values by SmartRecruiters `posted_at` month, pivoted by `company_country`.
  The eight largest countries by metric are retained and smaller countries are excluded rather than aggregated.
  This is a flow and not a count of currently open jobs.
metricQuery:
  dimensions:
  - fct_job_boards_smartrecruiters_posted_at_month
  - fct_job_boards_smartrecruiters_company_country
  exploreName: fct_job_boards_smartrecruiters
  filters: {}
  limit: 5000
  metrics:
  - fct_job_boards_smartrecruiters_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_job_boards_smartrecruiters_distinct_entities
  - descending: false
    fieldId: fct_job_boards_smartrecruiters_posted_at_month
  tableCalculations: []
name: Jobs posted per month by company country
pivotConfig:
  columns:
  - fct_job_boards_smartrecruiters_company_country
slug: fct-job-boards-smartrecruiters-postings-by-country
