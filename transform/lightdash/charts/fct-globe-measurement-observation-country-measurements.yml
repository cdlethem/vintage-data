chartConfig:
  config:
    columnLimit: 8
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_globe_measurement_observation_measured_date_year
          yRef:
            field: fct_globe_measurement_observation_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Measured date (Year)
      yAxis:
      - name: Distinct measurement
    layout:
      xField: fct_globe_measurement_observation_measured_date_year
      yField:
      - fct_globe_measurement_observation_distinct_entities
  type: cartesian
description: Distinct `measurement_id` values by measurement year for the eight countries with the largest
  totals. Remaining countries are excluded rather than aggregated, so line changes compare the leading
  country series only.
metricQuery:
  dimensions:
  - fct_globe_measurement_observation_measured_date_year
  - fct_globe_measurement_observation_country_name
  exploreName: fct_globe_measurement_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_globe_measurement_observation_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_globe_measurement_observation_distinct_entities
  - descending: false
    fieldId: fct_globe_measurement_observation_measured_date_year
  tableCalculations: []
name: Measurements per year by country
pivotConfig:
  columns:
  - fct_globe_measurement_observation_country_name
slug: fct-globe-measurement-observation-country-measurements
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_globe_measurement_observation_measured_date_year
  - fct_globe_measurement_observation_country_name
  - fct_globe_measurement_observation_distinct_entities
tableName: fct_globe_measurement_observation
version: 1
