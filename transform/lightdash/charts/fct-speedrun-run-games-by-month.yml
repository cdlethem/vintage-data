chartConfig:
  config:
    columnLimit: 6
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_speedrun_run_run_date_month
          yRef:
            field: fct_speedrun_run_distinct_runs
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Run date (Month)
      yAxis:
      - name: Distinct runs
    layout:
      xField: fct_speedrun_run_run_date_month
      yField:
      - fct_speedrun_run_distinct_runs
  type: cartesian
description: Distinct `run_id` values per run-date month pivoted by the six games with the largest retained
  run counts. Other games are excluded rather than aggregated; empty months for a game are absent rather
  than zero.
metricQuery:
  dimensions:
  - fct_speedrun_run_run_date_month
  - fct_speedrun_run_game_name
  exploreName: fct_speedrun_run
  filters: {}
  limit: 5000
  metrics:
  - fct_speedrun_run_distinct_runs
  sorts:
  - descending: true
    fieldId: fct_speedrun_run_distinct_runs
  - descending: false
    fieldId: fct_speedrun_run_run_date_month
  tableCalculations: []
name: Distinct runs by game and run month
pivotConfig:
  columns:
  - fct_speedrun_run_game_name
slug: fct-speedrun-run-games-by-month
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_speedrun_run_run_date_month
  - fct_speedrun_run_game_name
  - fct_speedrun_run_distinct_runs
tableName: fct_speedrun_run
version: 1
