chartConfig:
  config: {}
  type: table
description: Incremental physical history of measurements published by Sensor Community. Each row represents
  one sensor at one measurement timestamp. Repeated snapshots from the insert-only raw feed are reduced
  to the latest loaded copy for the sensor and timestamp, while the source metadata, typed common measurements,
  original values, and load lineage remain available for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_sensor_community_measurement_observed_at
  - fct_sensor_community_measurement_measurement_id
  - fct_sensor_community_measurement_country
  - fct_sensor_community_measurement_pm25
  - fct_sensor_community_measurement_source_loaded_at
  exploreName: fct_sensor_community_measurement
  filters:
    dimensions:
      and:
      - id: ab469aad-0a41-5cd4-8296-c12db8509d1f
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_sensor_community_measurement_observed_at
        values:
        - 30
      - id: 33ceb83c-acd5-56b7-854f-6a88d061d54a
        operator: equals
        target:
          fieldId: fct_sensor_community_measurement_is_clean
        values:
        - true
      id: ebfae1e5-20f7-5014-be38-15fa90d8fd3d
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_sensor_community_measurement_observed_at
  tableCalculations: []
name: Sensor community measurement — observations
slug: fct-sensor-community-measurement-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_sensor_community_measurement
version: 1
