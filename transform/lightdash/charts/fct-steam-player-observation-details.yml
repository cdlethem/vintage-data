chartConfig:
  config: {}
  type: table
description: Twice-hourly physical history of concurrent Steam player counts. Each row represents one
  game at one Steam feed observation timestamp for the source, retaining the request status, player count,
  and raw-load lineage. Repeated insert-only raw records for the same source, game, and observation time
  are reduced to the latest loaded copy.
metricQuery:
  dimensions: &id001
  - fct_steam_player_observation_observed_at
  - fct_steam_player_observation_game_id
  - fct_steam_player_observation_concurrent_player_count
  - fct_steam_player_observation_source_loaded_at
  exploreName: fct_steam_player_observation
  filters:
    dimensions:
      and:
      - id: bc187b16-d6ab-514b-bb22-ca108eef7a27
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_steam_player_observation_observed_at
        values:
        - 30
      - id: 0fda3485-c3cc-5a94-95b1-50a4a39f2b66
        operator: equals
        target:
          fieldId: fct_steam_player_observation_request_succeeded
        values:
        - true
      id: 8ad2f2dd-dc4f-5dd0-b9ac-bf057898096d
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_steam_player_observation_observed_at
  tableCalculations: []
name: Steam player observation — observations
slug: fct-steam-player-observation-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_steam_player_observation
version: 1
