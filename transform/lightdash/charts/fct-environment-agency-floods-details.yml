chartConfig:
  config: {}
  type: table
description: Twice-hourly physical history of Environment Agency flood-warning snapshots. Each row represents
  one source flood identifier at one extractor fetch time; repeated insert-only raw copies of that observation
  are reduced to the latest loaded copy while source and load lineage remain available for audit and replay.
metricQuery:
  dimensions: &id001
  - fct_environment_agency_floods_fetched_at
  - fct_environment_agency_floods_flood_id
  - fct_environment_agency_floods_severity
  - fct_environment_agency_floods_source_loaded_at
  exploreName: fct_environment_agency_floods
  filters:
    dimensions:
      and:
      - id: f9f57e6c-fca7-50f9-ab47-1157d02b6463
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_environment_agency_floods_fetched_at
        values:
        - 30
      id: 012536e4-77ae-5c91-86bd-fb1c29a3808e
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_environment_agency_floods_fetched_at
  tableCalculations: []
name: Environment agency floods — observations
slug: fct-environment-agency-floods-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_environment_agency_floods
version: 1
