chartConfig:
  config:
    columnLimit: 4
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_seed_lab_queue_observed_at_day
          yRef:
            field: fct_seed_lab_queue_average_sample_count
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Mean observed sample count
    layout:
      stack: true
      xField: fct_seed_lab_queue_observed_at_day
      yField:
      - fct_seed_lab_queue_average_sample_count
