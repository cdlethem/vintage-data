chartConfig:
  config: {}
  type: table
description: Physical observation fact for papers returned by the arXiv feed. Each row records one paper
  identifier at one feed observation timestamp, preserving the publication metadata and raw-load lineage
  needed to reproduce the insert-only source history. Repeated copies of the same source, paper, and observation
  timestamp retain the latest loaded row.
metricQuery:
  dimensions: &id001
  - fct_arxiv_new_paper_observation_observed_at
  - fct_arxiv_new_paper_observation_paper_id
  - fct_arxiv_new_paper_observation_primary_category
  - fct_arxiv_new_paper_observation_source_loaded_at
  exploreName: fct_arxiv_new_paper_observation
  filters:
    dimensions:
      and:
      - id: ebc9fabf-617d-5d34-ae7a-623f76103a4e
        operator: inThePast
        settings:
          completed: false
          unitOfTime: days
        target:
          fieldId: fct_arxiv_new_paper_observation_observed_at
        values:
        - 30
      id: d441f8e5-4149-55c4-ad23-dc88d2942110
  limit: 100
  metrics: []
  sorts:
  - descending: true
    fieldId: fct_arxiv_new_paper_observation_observed_at
  tableCalculations: []
name: Arxiv new paper observation — observations
slug: fct-arxiv-new-paper-observation-details
spaceSlug: vintage-marts
tableConfig:
  columnOrder: *id001
tableName: fct_arxiv_new_paper_observation
version: 1
