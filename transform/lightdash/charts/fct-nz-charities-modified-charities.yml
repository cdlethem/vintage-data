chartConfig:
  config:
    eChartsConfig:
      series:
      - encode:
          xRef:
            field: fct_nz_charities_modifiedon_day
          yRef:
            field: fct_nz_charities_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Modifiedon (Day)
      yAxis:
      - name: Distinct id
    layout:
