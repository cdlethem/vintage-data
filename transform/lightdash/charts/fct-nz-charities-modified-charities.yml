  type: cartesian
description: Distinct `id` values by `modifiedon` source-event day in the rolling 30-day UTC window. Repeated
  snapshots of the same revision count once per day, while an entity revised on multiple days appears
  on each day. This is SCD2-like revision history, not new registrations; an absent day means no matching
  observed revision, not zero revision activity.
