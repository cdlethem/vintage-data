chartConfig:
  config:
    columnLimit: 2
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_wikimedia_change_observation_event_at_day
          yRef:
            field: fct_wikimedia_change_observation_distinct_entities
        type: bar
        yAxisIndex: 0
      xAxis:
      - name: Event at (Day)
      yAxis:
      - name: Distinct change
    layout:
      stack: true
      xField: fct_wikimedia_change_observation_event_at_day
      yField:
      - fct_wikimedia_change_observation_distinct_entities
  type: cartesian
description: Distinct `change_id` values per UTC event day stacked by Wikimedia's `is_bot` flag. Each
  change has one flag, so the stack is the day's observed change level; absent event days are absent rather
  than zero.
metricQuery:
  dimensions:
  - fct_wikimedia_change_observation_event_at_day
  - fct_wikimedia_change_observation_is_bot
  exploreName: fct_wikimedia_change_observation
  filters: {}
  limit: 5000
  metrics:
  - fct_wikimedia_change_observation_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_wikimedia_change_observation_distinct_entities
  - descending: false
    fieldId: fct_wikimedia_change_observation_event_at_day
  tableCalculations: []
name: Bot and human changes by event day
pivotConfig:
  columns:
  - fct_wikimedia_change_observation_is_bot
slug: fct-wikimedia-change-observation-bot-mix
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_wikimedia_change_observation_event_at_day
  - fct_wikimedia_change_observation_is_bot
  - fct_wikimedia_change_observation_distinct_entities
tableName: fct_wikimedia_change_observation
version: 1
