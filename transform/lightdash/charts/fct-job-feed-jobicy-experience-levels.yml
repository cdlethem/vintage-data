chartConfig:
  config:
    columnLimit: 5
    eChartsConfig:
      legend:
        orient: vertical
        placement: outsideRight
      series:
      - encode:
          xRef:
            field: fct_job_feed_jobicy_observed_at_day
          yRef:
            field: fct_job_feed_jobicy_distinct_entities
        type: line
        yAxisIndex: 0
      xAxis:
      - name: Observed at (Day)
      yAxis:
      - name: Distinct job
    layout:
      xField: fct_job_feed_jobicy_observed_at_day
      yField:
      - fct_job_feed_jobicy_distinct_entities
  type: cartesian
description: Distinct `job_id` values per observation day, compared across the five experience levels.
  The remainder is excluded rather than aggregated, and this is a catalogue level rather than a flow of
  new postings; days without an extract are absent rather than zero.
metricQuery:
  dimensions:
  - fct_job_feed_jobicy_observed_at_day
  - fct_job_feed_jobicy_experience_level
  exploreName: fct_job_feed_jobicy
  filters: {}
  limit: 5000
  metrics:
  - fct_job_feed_jobicy_distinct_entities
  sorts:
  - descending: true
    fieldId: fct_job_feed_jobicy_distinct_entities
  - descending: false
    fieldId: fct_job_feed_jobicy_observed_at_day
  tableCalculations: []
name: Catalogue jobs by experience level
pivotConfig:
  columns:
  - fct_job_feed_jobicy_experience_level
slug: fct-job-feed-jobicy-experience-levels
spaceSlug: vintage-marts
tableConfig:
  columnOrder:
  - fct_job_feed_jobicy_observed_at_day
  - fct_job_feed_jobicy_experience_level
  - fct_job_feed_jobicy_distinct_entities
tableName: fct_job_feed_jobicy
version: 1
