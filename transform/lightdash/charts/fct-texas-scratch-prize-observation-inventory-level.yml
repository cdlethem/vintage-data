  limit: 5000
  metrics:
  - fct_texas_scratch_prize_observation_average_total_prizes
  sorts:
  - descending: false
    fieldId: fct_texas_scratch_prize_observation_publisher_updated_at_day
  tableCalculations: []
name: Mean original prizes per level
