tiles:
- h: 6
  properties:
    content: 'Incremental physical snapshot fact of Food Standards Agency food hygiene ratings. Each row
      is one source, food-business rating identifier, and fetch timestamp; repeated rows for that grain
      are resolved to the latest raw load record. Source rating labels and score JSON are retained alongside
      typed score and geocode fields and raw-load lineage.


      **Grain:** source, rating_id, observed_at


      **What changes here:** how the food rating volume and score mix changes across business types and
      local authorities.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings` — licence: Open Government Licence (FSA); attribution required: True. Source
      configuration: `extract/sources/food_hygiene_ratings.yml`.'
