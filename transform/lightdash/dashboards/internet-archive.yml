tiles:
- h: 6
  properties:
    content: 'Physical hourly observation fact for Internet Archive items. Each row records one archive
      source, item identifier, and extractor observation timestamp, retaining item metadata and raw-load
      lineage for auditability. Repeated copies of the same source, item, and observation timestamp retain
      the latest loaded record.


      **Grain:** archive_source, item_id, observed_at


      **What changes here:** how the observed Internet Archive catalogue and credited-creator mix change
      across five daily snapshots.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `internet_archive` — licence: per-item (varies by collection); attribution required: True. Source
      configuration: `extract/sources/internet_archive.yml`.'
