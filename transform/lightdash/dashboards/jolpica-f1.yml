tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Jolpica Formula 1 driver-standing observations. Each row is one
      driver championship standing for a season and round at one extractor observation timestamp; duplicate
      raw replays of that observation are reduced to the latest loaded row while raw-load lineage is retained.


      **Grain:** season, round, driver_id, observed_at


      **What changes here:** how the five-day championship snapshot changes in driver coverage, constructor
      mix, and accumulated points.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `jolpica_f1` — licence: Jolpica-F1 — Ergast-compatible, respect ToS; attribution required: False.
      Source configuration: `extract/sources/jolpica_f1.yml`.'
