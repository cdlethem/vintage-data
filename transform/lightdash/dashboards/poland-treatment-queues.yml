tiles:
- h: 6
  properties:
    content: 'Daily physical history of specialist-treatment queue observations published by Poland''s
      National Health Fund (NFZ). Each row records one provider queue returned by the configured outpatient
      search at a fetch timestamp, including published situation dates, available provider wait statistics,
      and raw-load lineage.


      **Grain:** source, queue_id, observed_at


      **What changes here:** how published queue coverage and reported waiting measures change across
      situation dates and observation days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `poland_treatment_queues` — licence: NFZ reuse terms; attribution required: True. Source configuration:
      `extract/sources/poland_treatment_queues.yml`.'
