tiles:
- h: 6
  properties:
    content: 'Daily physical history of W3C specifications returned by the W3C specifications feed. Each
      row represents one specification identifier from one extractor observation timestamp, retaining
      the canonical URL, title, and raw-load lineage. Repeated ingestion of the same source, specification,
      and observation timestamp is reduced to the latest loaded record.


      **Grain:** source, specification_id, observed_at


      **What changes here:** how the published W3C specification catalogue changes in size and title mix
      across extractor observation days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `w3c_specifications` — licence: W3C document and data terms; attribution required: True. Source
      configuration: `extract/sources/w3c_specifications.yml`.'
