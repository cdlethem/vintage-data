tiles:
- h: 6
  properties:
    content: 'Physical snapshot fact for the Oregon seed-lab processing queue. Each row records one queue
      category observed in a source snapshot, including the reported sample count, completion estimate,
      and raw-load lineage.


      **Grain:** source, queue_id, observed_at


      **What changes here:** how reported queue load and completion outlook move across daily snapshots.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `seed_lab_queue` — licence: Oregon State University website terms; attribution required: True.
      Source configuration: `extract/sources/seed_lab_queue.yml`.'
    hideFrame: false
    title: Seed lab queue
