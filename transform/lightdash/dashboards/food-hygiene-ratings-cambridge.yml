tiles:
- h: 6
  properties:
    content: 'Daily physical history of food hygiene ratings returned for Cambridge establishments. Each
      row is one establishment in one publisher snapshot, keyed by establishment_id and observed_at. Re-ingestion
      of the same snapshot retains only the latest loaded copy while preserving load lineage.


      **Grain:** establishment_id, observed_at


      **What changes here:** how published Cambridge ratings and their component scores shift across business
      types over rating history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings_cambridge` — see dbt raw-source lineage.'
