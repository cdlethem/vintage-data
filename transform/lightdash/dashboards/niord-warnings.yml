tiles:
- h: 6
  properties:
    content: 'Hourly physical history of maritime warnings published through the Danish Niord service.
      Each row represents one warning identifier from one source at one extractor observation time, with
      nested warning content and raw-load lineage retained for audit and replay. Repeated insert-only
      copies of the same observation are reduced to the latest loaded copy.


      **Grain:** source_name, warning_id, observed_at


      **What changes here:** how maritime warning creation accelerates across warning types and classifications.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `niord_warnings` — licence: Danish Maritime Authority terms; attribution required: True. Source
      configuration: `extract/sources/niord_warnings.yml`.'
    hideFrame: false
    title: Niord warning observation
