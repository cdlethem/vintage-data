tiles:
- h: 6
  properties:
    content: 'Daily physical history of InfoDengue epidemiology observations for Brasília. Each row represents
      one source observation id at one publisher fetch timestamp; repeated insert-only loads of that observation
      are reduced to the latest loaded copy while source and loader lineage are retained. The source profile
      found 34 rows in one recent batch, one municipality, and no null observation ids or fetch timestamps,
      so the daily incremental grain preserves successive API snapshots without rescanning prior loads.


      **Grain:** source_relation, observation_id, observed_at


      **What changes here:** Weekly epidemiological estimates show how Brasília''s burden changes, while
      alert and transmission statuses explain the shifts.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue_brasilia` — see dbt raw-source lineage.'
