tiles:
- h: 6
  properties:
    content: 'Physical observation fact for Federal Emergency Management Agency disaster declarations.
      Each row is one FEMA declaration identifier at one extractor observation timestamp. Insert-only
      copies are deduplicated by that observation grain using the latest load lineage, while declaration
      attributes and source lineage remain available for audit and replay.


      **Grain:** source_name, declaration_id, observed_at


      **What changes here:** how declaration activity and affected incidents shift across FEMA incident
      types and states over the incident timeline.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `openfema_declarations` — licence: US federal public data; attribution required: False. Source
      configuration: `extract/sources/openfema_declarations.yml`.'
    hideFrame: false
    title: Openfema declaration observation
