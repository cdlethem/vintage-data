tiles:
- h: 6
  properties:
    content: 'Current-state fact for Speedrun.com run records. Each row is one run identifier, retaining
      the latest loaded representation of that run and the source observation and load lineage used to
      select it. This model deliberately keeps player lists as JSON because a run may have multiple participants.


      **Grain:** run_id


      **What changes here:** how run submissions accumulate across games and platforms while completion
      speed changes through the published run-date history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `speedrun_runs` — licence: CC-BY-NC 4.0 — non-commercial use only; attribution required: True.
      Source configuration: `extract/sources/speedrun_runs.yml`.'
    hideFrame: false
    title: Speedrun run
