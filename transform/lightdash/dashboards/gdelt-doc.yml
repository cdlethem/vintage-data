tiles:
- h: 6
  properties:
    content: 'Hourly incremental fact of GDELT DOC article observations. Each row represents one document
      identifier observed at one extractor fetch timestamp, retaining the article metadata and the raw-load
      lineage for replay and audit. Replayed copies of the same document observation are reduced to the
      latest loaded record; this model does not infer article sentiment, topic, or canonical identity
      beyond the supplied URL.


      **Grain:** document_id, observed_at


      **What changes here:** how the two-day document feed changes in volume, language, and publisher
      domain mix.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gdelt_doc` — licence: GDELT — free for research/non-commercial use; attribution required: True.
      Source configuration: `extract/sources/gdelt_doc.yml`.'
    hideFrame: false
    title: Gdelt document observation
