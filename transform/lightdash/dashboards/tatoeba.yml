tiles:
- h: 6
  properties:
    content: 'Hourly physical observation fact for Tatoeba sentence and translation records. Each row
      represents one translation object attached to a source sentence at one extractor observation timestamp;
      sentence-level attributes are repeated for each attached translation. The stable observation key
      combines the source, sentence, translation, and observation timestamp, and raw-load lineage is retained
      for replay and audit. A sentence observation with no translation objects contributes no child row
      to this fact.


      **Grain:** source_name, sentence_id, translation_id, observed_at


      **What changes here:** how the observed English-to-French sentence and translation coverage changes
      across collection days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `tatoeba` — licence: per-sentence (CC BY 2.0 FR observed) -- check each record, not the dataset
      as a whole; attribution required: True. Source configuration: `extract/sources/tatoeba.yml`.'
    hideFrame: false
    title: Tatoeba sentence translation observation
