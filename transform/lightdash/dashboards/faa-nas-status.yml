tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for the FAA National Airspace System status feed.
      Each row represents one airport identifier at one extractor observation timestamp. Repeated insert-only
      raw copies of the same airport observation retain the latest loaded row, while source and load lineage
      remain available for audit and replay.


      **Grain:** airport_id, observed_at


      **What changes here:** how airport coverage and delay pressure move through each status observation
      and source update.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `faa_nas_status` — licence: US Government work, public domain; attribution required: False. Source
      configuration: `extract/sources/faa_nas_status.yml`.'
