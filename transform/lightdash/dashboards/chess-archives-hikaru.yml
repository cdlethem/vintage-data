tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical fact of Hikaru Nakamura''s Chess.com archive games. Each row is one
      game for the Hikaru archive at the archive-source and game identifier grain; repeated raw copies
      are reduced to the latest loaded row while game attributes and raw-load lineage remain available
      for audit.


      **Grain:** archive_source, game_id


      **What changes here:** how game volume, outcomes, time controls, and move timing shift across the
      archive''s recorded end days.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `chess_archives_hikaru` — see dbt raw-source lineage.'
