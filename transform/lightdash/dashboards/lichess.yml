tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of games and featured players observed in the Lichess TV feed.
      Each row represents one source, game, variant, player, color, and feed observation timestamp; duplicate
      append-only rows for that observation are reduced to the latest loaded record while the source-load
      lineage is retained for replay and audit.


      **Grain:** source, game_id, variant, player, color, observed_at


      **What changes here:** how the observed Lichess TV game roster and featured-player rating move through
      the feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `lichess` — licence: unstated; attribution required: False. Source configuration: `extract/sources/lichess.yml`.'
    hideFrame: false
    title: Lichess game observation
