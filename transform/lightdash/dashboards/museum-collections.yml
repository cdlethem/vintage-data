tiles:
- h: 6
  properties:
    content: 'Physical snapshot fact for museum collection records. Each row represents one source item
      observed at one fetched_at timestamp; repeated item observations preserve changing catalog attributes
      such as title, classification, display status, gallery, and updated_at while retaining load lineage.
      Duplicate rows for the same source, item, and observation timestamp are reduced to the latest loaded
      record.


      **Grain:** source, id, fetched_at


      **What changes here:** how the museum catalogue level and credited-artist mix change across observations,
      with source revisions visible.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `museum_collections` — licence: AIC/Cleveland — open access (CC0/public domain varies per object,
      respect is_public_domain); attribution required: False. Source configuration: `extract/sources/museum_collections.yml`.'
