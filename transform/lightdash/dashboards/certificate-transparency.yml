tiles:
- h: 6
  properties:
    content: 'Daily certificate transparency observation fact for certificates returned by the watched-domain
      search. Each row is one certificate identifier at one extractor observation timestamp, retaining
      certificate validity, subject, issuer, SAN names, and raw-load lineage. Repeated copies of the same
      source, certificate, and observation timestamp are reduced to the latest loaded record.


      **Grain:** source, certificate_id, observed_at


      **What changes here:** how certificate issuance and expiry patterns shift across watched-domain
      history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `certificate_transparency` — licence: unstated; attribution required: False. Source configuration:
      `extract/sources/certificate_transparency.yml`.'
