tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Tokyo MOU port-state-control detention observations. Each row
      is one detention event returned by the current-month APCIS query at one extractor observation timestamp;
      repeated raw copies of that observation are reduced to the latest loaded row while vessel, deficiency,
      release, query, and load lineage remain available.


      **Grain:** detention_id, observed_at


      **What changes here:** how detention events vary by day, flag state, vessel type, and vessel size.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `tokyo_mou_detentions` — licence: Tokyo MOU terms; attribution required: True. Source configuration:
      `extract/sources/tokyo_mou_detentions.yml`.'
    hideFrame: false
    title: Tokyo mou detentions
