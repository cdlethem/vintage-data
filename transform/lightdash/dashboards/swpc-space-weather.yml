tiles:
- h: 6
  properties:
    content: 'Hourly physical history of NOAA SWPC planetary K-index observations. Each row represents
      one source, SWPC observation identifier, and three-hour observation timestamp. Repeated insert-only
      raw snapshots are reduced to the latest loaded copy for that observation while extractor and load
      lineage remain available for audit and replay.


      **Grain:** source_name, observation_id, observation_at


      **What changes here:** how NOAA''s planetary activity and reporting coverage move across source
      observation days.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `swpc_space_weather` — licence: NOAA SWPC — public domain; attribution required: False. Source
      configuration: `extract/sources/swpc_space_weather.yml`.'
