tiles:
- h: 6
  properties:
    content: 'Hourly physical history of ClinicalTrials.gov study records. Each row is one study observed
      at one extractor timestamp, preserving publication attributes, eligibility and intervention details,
      and raw-load lineage. Repeated copies of the same study observation are reduced to the latest loaded
      row.


      **Grain:** study_id, observed_at


      **What changes here:** how the two-day catalogue level, study statuses, sponsor mix, and reported
      enrollment differ across source update dates.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `clinicaltrials` — licence: NLM public domain (US Gov work); attribution required: False. Source
      configuration: `extract/sources/clinicaltrials.yml`.'
    hideFrame: false
    title: Clinicaltrials study observation
