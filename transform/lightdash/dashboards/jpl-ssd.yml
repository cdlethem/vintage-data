tiles:
- h: 6
  properties:
    content: 'Physical observation fact for the JPL SSD fireball feed. Each row is one source observation
      identified by its source, reported identifier, and fetch timestamp. Source-load lineage is retained
      so append-only arrivals can be audited and replayed without exposing the raw payload.


      **Grain:** source_name, observation_id, observed_at


      **What changes here:** how the five-day fireball snapshot changes in reported event coverage and
      impact-energy levels.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `jpl_ssd` — licence: NASA/JPL — public domain; attribution required: False. Source configuration:
      `extract/sources/jpl_ssd.yml`.'
    hideFrame: false
    title: Jpl ssd observation
