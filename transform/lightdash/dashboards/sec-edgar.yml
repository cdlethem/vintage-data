tiles:
- h: 6
  properties:
    content: 'Hourly physical observation fact for SEC EDGAR filing-party records. Each row is one accession
      number, party role, CIK, and extractor observation timestamp; repeated raw copies of the same observation
      are reduced to the latest loaded copy while source and load lineage remain available for audit and
      replay.


      **Grain:** accession_number, party_role, cik, observed_at


      **What changes here:** how filing activity and represented parties shift across filed dates and
      SEC form roles.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sec_edgar` — licence: US Government work, public domain; attribution required: False. Source
      configuration: `extract/sources/sec_edgar.yml`.'
