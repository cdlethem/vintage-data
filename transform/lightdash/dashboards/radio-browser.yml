tiles:
- h: 6
  properties:
    content: 'Daily physical history of stations returned by the Radio Browser directory. Each row is
      one station observed in one source snapshot, keyed by the source, station identifier, and observation
      timestamp. Raw re-ingestion of the same snapshot is reduced to the latest loaded copy while load
      lineage is retained.


      **Grain:** source, station_id, observed_at


      **What changes here:** how the monitored station catalogue and reported engagement measures change
      while station metadata is revised.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `radio_browser` — licence: Radio Browser — community project; attribution required: False. Source
      configuration: `extract/sources/radio_browser.yml`.'
    hideFrame: false
    title: Radio browser station snapshot
  type: markdown
