tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of equipment published by SNCF station services. Each row
      represents one equipment identifier from one source at one extractor observation time. Repeated
      copies of an observation from later insert-only raw loads are reduced to the latest loaded copy,
      while source and load lineage are retained. The source coordinate text is preserved and parsed into
      nullable latitude and longitude values.


      **Grain:** source_name, equipment_id, observed_at


      **What changes here:** how the reported station-equipment catalogue and operating-status mix change
      across each polling hour.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sncf_station_equipment` — licence: SNCF open-data reuse terms; attribution required: True. Source
      configuration: `extract/sources/sncf_station_equipment.yml`.'
