tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of amateur-radio satellite status reports. Each row represents
      one source satellite report identified by its upstream source, report identifier, and fetched_at
      observation timestamp. Duplicate raw observations are reduced to the latest loaded record while
      raw-load lineage is retained for replay and audit.


      **Grain:** source, observation_id, fetched_at


      **What changes here:** how reported satellite statuses and their radio periods change through the
      five-day feed history.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `amsat_status` — licence: unstated; attribution required: False. Source configuration: `extract/sources/amsat_status.yml`.'
    hideFrame: false
    title: Amsat status observations
