tiles:
- h: 6
  properties:
    content: 'Daily physical history of job observations returned by Lever-hosted job boards. Each row
      represents one source label, Lever job identifier, and extractor observation timestamp; repeated
      raw copies of an observation are reduced to the latest loaded lineage record while prior observations
      remain available for history.


      **Grain:** source, job_id, observed_at


      **What changes here:** how Lever job volume and company coverage change across the published catalogue.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_boards_lever` — licence: public ATS board endpoints; attribution required: False. Source
      configuration: `extract/sources/job_boards_lever.yml`.'
