tiles:
- h: 6
  properties:
    content: 'Daily physical history of Nextstrain phylogenetic sequence observations. Each row represents
      one source, sequence identifier, and extractor fetch timestamp, retaining the reported sample, tree,
      clade, geography, mutation, and provenance attributes together with complete load lineage. Because
      the raw source is append-only, repeated copies of a source sequence at the same fetch timestamp
      are reduced to the latest loaded record.


      **Grain:** source, sequence_id, fetched_at


      **What changes here:** how sampled sequence volume, genetic divergence, clades, and regions shift
      through time.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nextstrain` — licence: Nextstrain data CC-BY; GISAID-sourced builds carry GISAID''s stricter
      terms — check meta.data_provenance; attribution required: True. Source configuration: `extract/sources/nextstrain.yml`.'
    hideFrame: false
    title: Nextstrain sequence observation
  type: markdown
