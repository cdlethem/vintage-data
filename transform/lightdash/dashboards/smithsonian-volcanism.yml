tiles:
- h: 6
  properties:
    content: 'Daily physical snapshots of Smithsonian Global Volcanism Program eruption events. Each row
      represents one source event identifier observed at one API fetch timestamp, with volcano identity,
      event dates, eruption attributes, and raw-load lineage retained. Repeated ingestion of the same
      source, event, and observation timestamp is reduced to the latest loaded record.


      **Grain:** source, event_id, observed_at


      **What changes here:** how eruption events start, how reported explosivity changes, and which eruptions
      remain marked as continuing.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `smithsonian_volcanism` — licence: Smithsonian GVP — public; attribution required: False. Source
      configuration: `extract/sources/smithsonian_volcanism.yml`.'
    hideFrame: false
    title: Smithsonian volcanism snapshot
