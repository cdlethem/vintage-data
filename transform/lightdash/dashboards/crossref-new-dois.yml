name: Crossref New Dois
slug: crossref-new-dois
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Hourly physical observation fact for newly registered Crossref DOI records. Each row records
      one DOI identifier at one extractor observation timestamp, preserving publication metadata and raw-load
      lineage. Repeated copies of the same source, DOI, and observation timestamp retain the latest loaded
      row.


      **Grain:** source_name, doi_id, observed_at


      **What changes here:** how newly registered DOI volume, work-type mix, publisher breadth, and author
      counts move in the Crossref feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `crossref_new_dois` — licence: CrossRef metadata — free reuse; attribution required: False. Source
      configuration: `extract/sources/crossref_new_dois.yml`.'
    hideFrame: false
    title: Crossref new doi observation
