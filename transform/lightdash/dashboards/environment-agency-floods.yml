tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Environment Agency flood-warning snapshots. Each row represents
      one source flood identifier at one extractor fetch time; repeated insert-only raw copies of that
      observation are reduced to the latest loaded copy while source and load lineage remain available
      for audit and replay.


      **Grain:** source_name, flood_id, fetched_at


      **What changes here:** how flood-warning levels and affected areas change through each source event
      and fetch.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `environment_agency_floods` — licence: OGL 3.0; attribution required: True. Source configuration:
      `extract/sources/environment_agency_floods.yml`.'
