tiles:
- h: 6
  properties:
    content: 'Daily physical history of NIH Reporter research-project records. Each row is one NIH application
      observed at an extractor timestamp, retaining grant, project, organization, principal-investigator,
      and raw-load lineage fields. Repeated raw copies of the same application observation are reduced
      to the latest loaded row.


      **Grain:** project_id, observed_at


      **What changes here:** how NIH project starts, award levels, and recipient geography change across
      the published research portfolio.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nih_reporter` — licence: US Government work, public domain; attribution required: False. Source
      configuration: `extract/sources/nih_reporter.yml`.'
    hideFrame: false
    title: Nih reporter project observations
