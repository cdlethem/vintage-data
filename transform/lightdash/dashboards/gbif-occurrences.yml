name: Gbif Occurrences
slug: gbif-occurrences
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot of GBIF occurrence records returned by the configured occurrence
      search. Each row represents one occurrence identifier from one GBIF API observation timestamp, with
      taxonomy, event, location, and raw-load lineage retained for reproducibility.


      **Grain:** source, occurrence_id, fetched_at


      **What changes here:** how the three-day fetched catalogue compares with the month of biological
      event dates and its changing taxonomic mix.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gbif_occurrences` — licence: per-record, mostly CC-friendly; attribution required: False. Source
      configuration: `extract/sources/gbif_occurrences.yml`.'
    hideFrame: false
    title: Gbif occurrence snapshot
