tiles:
- h: 6
  properties:
    content: 'Daily physical history of satellite conjunction events reported by the CelesTrak SOCRATES
      feed. Each row is one conjunction event as observed at one extractor timestamp, retaining close-approach
      measures and raw-load lineage for replay and audit.


      **Grain:** conjunction_id, observed_at


      **What changes here:** how scheduled conjunction volume and close-approach risk vary across the
      eight-day TCA horizon.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `celestrak_socrates` — licence: unstated; attribution required: True. Source configuration: `extract/sources/celestrak_socrates.yml`.'
