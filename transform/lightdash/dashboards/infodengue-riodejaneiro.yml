tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Rio de Janeiro epidemiological surveillance observations from
      the InfoDengue city-alerts feed. The table retains one row at the source relation and provider record
      identifier grain, chooses the latest loaded replay for each identifier, preserves raw-load lineage,
      and converts provider measures to stable analytical types. Source values are not imputed or otherwise
      reinterpreted.


      **Grain:** source_relation, record_id


      **What changes here:** Weekly epidemiological estimates show how Rio de Janeiro''s burden changes,
      while alert and transmission statuses explain the shifts.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue_riodejaneiro` — see dbt raw-source lineage.'
    hideFrame: false
    title: Infodengue riodejaneiro epidemiology
