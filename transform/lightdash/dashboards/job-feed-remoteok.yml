tiles:
- h: 6
  properties:
    content: 'Daily physical history of Remote OK job observations. Each row represents one Remote OK
      job identifier as observed in one extractor response at an observed timestamp; repeated raw ingestion
      of the same observation is reduced to the latest loaded copy while load-layer lineage is retained
      for audit and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how the four-day Remote OK catalogue level and recent posting mix change
      across companies and locations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_remoteok` — licence: Remote OK public API terms; attribution required: True. Source
      configuration: `extract/sources/job_feed_remoteok.yml`.'
