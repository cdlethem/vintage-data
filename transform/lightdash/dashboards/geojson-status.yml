tiles:
- h: 6
  properties:
    content: 'Incremental physical history of GeoJSON shelter status features. Each row is one upstream
      feature at one extractor observation timestamp, with the normalized shelter attributes, point geometry,
      and raw-load lineage needed to audit refreshes and replay the insert-only source.


      **Grain:** source_name, feature_id, observed_at


      **What changes here:** how the shelter catalogue level and reported population move across four
      days of extractor observations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `geojson_status` — licence: varies per feed (US federal / NSW / ND DOT); attribution required:
      True. Source configuration: `extract/sources/geojson_status.yml`.'
    hideFrame: false
    title: Geojson shelter status
