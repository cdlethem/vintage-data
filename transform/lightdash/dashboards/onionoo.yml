tiles:
- h: 6
  properties:
    content: 'Twice-hourly incremental physical history of Tor relays reported by the Onionoo feed. Each
      row represents one relay from one upstream source at one fetched observation timestamp. Re-ingested
      copies of an observation are reduced to the latest raw-load record while source lineage is retained
      for audit and replay.


      **Grain:** source, relay_id, observed_at


      **What changes here:** The five-day relay-status level shows a nearly fixed running population while
      published batches expose short-term coverage changes.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `onionoo` — licence: unstated; run by the Tor Project itself; attribution required: False. Source
      configuration: `extract/sources/onionoo.yml`.'
    hideFrame: false
    title: Onionoo relay status
