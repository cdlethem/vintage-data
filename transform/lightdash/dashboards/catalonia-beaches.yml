tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Catalonia beach-status records. Each row is one beach status
      update identified by the upstream source, beach id, and publisher status timestamp; repeated copies
      delivered by later raw loads are reduced to the latest loaded record while source lineage is retained.
      Source numeric fields are typed, the upstream -9999 wave-height sentinel is represented as null,
      and the source''s N/A UV value remains nullable.


      **Grain:** source_name, beach_id, status_updated_at


      **What changes here:** how the beach roster and reported conditions differ across four sparse annual
      status snapshots.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `catalonia_beaches` — licence: Catalonia open-data terms; attribution required: True. Source configuration:
      `extract/sources/catalonia_beaches.yml`.'
