- h: 6
  properties:
    content: 'Hourly physical history of San Diego Superior Court telephone-standby instructions by courthouse
      and service date. Each row preserves one fetched publisher state and its raw lineage for replay
      and audit.


      **Grain:** standby_id, observed_at


      **What changes here:** how courthouse standby coverage and instruction complexity change across
      daily observations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sd_juror_standby` — licence: San Diego Superior Court website terms; attribution required: True.
      Source configuration: `extract/sources/sd_juror_standby.yml`.'
