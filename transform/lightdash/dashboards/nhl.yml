tiles:
- h: 6
  properties:
    content: 'Physical observation fact for NHL schedule records. Each row is one deduplicated game snapshot
      at the schedule feed fetch timestamp, retaining the scheduled game, participating teams, venue,
      state, and raw-load lineage. The source currently reports future game schedules; this fact does
      not infer scores or player-level statistics.


      **Grain:** source_system, game_id, observed_at


      **What changes here:** how the scheduled NHL slate and its venue mix change across the upcoming
      game days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nhl` — licence: NHL official API — public; attribution required: False. Source configuration:
      `extract/sources/nhl.yml`.'
    hideFrame: false
    title: Nhl game observations
