tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for Wikimedia recent changes. Each row is one Wikimedia
      source, change identifier, and extractor observation timestamp, retaining the event payload and
      raw-load lineage. Replayed copies of the same observation are reduced to the latest loaded row;
      this model preserves the source feed''s event history and does not infer later edits or repair omitted
      API fields.


      **Grain:** source_name, change_id, observed_at


      **What changes here:** how Wikimedia change volume and edit size shift by operation, bot status,
      and minor flag across the five-day event feed window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `wikimedia_changes` — licence: Wikimedia — CC-BY-SA / GFDL; attribution required: False. Source
      configuration: `extract/sources/wikimedia_changes.yml`.'
