tiles:
- h: 6
  properties:
    content: 'Daily physical history of structures published by the RCSB Protein Data Bank feed. Each
      row is one structure observed in one source snapshot, retaining publication dimensions and raw-load
      lineage for replay.


      **Grain:** structure_id, observed_at


      **What changes here:** how the observed structure catalogue changes by experimental method and which
      source revision months contribute to its current level.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `rcsb_pdb` — licence: unstated (public structural database); attribution required: False. Source
      configuration: `extract/sources/rcsb_pdb.yml`.'
    hideFrame: false
    title: Rcsb pdb structure snapshot
