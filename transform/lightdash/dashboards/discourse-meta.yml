tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for topics published on the Discourse Meta community.
      Each row records one topic at one extractor observation timestamp, retaining the topic metadata,
      engagement counters, tags, and raw load lineage. Repeated copies of the same source, topic identifier,
      and observation timestamp retain the latest loaded row.


      **Grain:** source_name, topic_id, observed_at


      **What changes here:** how topic creation and engagement levels move across the forum''s short observed
      history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `discourse_meta` — licence: unstated; varies per forum; attribution required: False. Source configuration:
      `extract/sources/discourse_meta.yml`.'
    hideFrame: false
    title: Discourse meta topic observation
