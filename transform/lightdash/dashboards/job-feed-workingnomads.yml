tiles:
- h: 6
  properties:
    content: 'Daily physical history of Working Nomads job-listing observations. Each row is one job identifier
      as observed by the extractor at a fetched timestamp, with listing attributes and raw-load lineage
      retained for audit and replay.


      **Grain:** job_id, observed_at


      **What changes here:** how the feed''s posted-job flow and four-day observed catalogue change across
      departments, employers, and locations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_workingnomads` — licence: public Working Nomads exposed jobs API; attribution required:
      True. Source configuration: `extract/sources/job_feed_workingnomads.yml`.'
    hideFrame: false
    title: Job feed workingnomads
