tiles:
- h: 6
  properties:
    content: 'Physical radiation readings published by the Safecast measurement API. Each row represents
      one immutable Safecast measurement identified by its source and API measurement ID; non-radiation
      status and temperature records are excluded, and repeated raw ingestion is reduced to the latest
      loaded copy while preserving the measurement and load timestamps plus source lineage.


      **Grain:** source, measurement_id


      **What changes here:** how the current radiation-reading level and measurement mix move across five
      collection days, with a short captured-time view of the same readings.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `safecast` — licence: Safecast — public, CC0-ish; attribution required: False. Source configuration:
      `extract/sources/safecast.yml`.'
