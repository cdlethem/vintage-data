tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot of organizations recognized as tax-exempt by the United States Internal
      Revenue Service. Each row is one employer identification number observed at one extractor fetch
      timestamp; repeated raw copies of a snapshot row are reduced to the latest loaded copy while source
      lineage is retained for audit.


      **Grain:** ein, fetched_at


      **What changes here:** how the one-day IRS exempt-organization snapshot''s population and reported
      financial levels differ by state and classification.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `irs_exempt_organizations` — licence: US federal public data; attribution required: False. Source
      configuration: `extract/sources/irs_exempt_organizations.yml`.'
