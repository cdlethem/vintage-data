tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Minor Planet Center near-Earth-object candidate reports.
      Each row is one candidate identifier observed at one upstream fetch timestamp, with parsed numeric
      discovery measures and raw load lineage retained for replay and audit. Rows are deduplicated by
      the candidate observation grain, retaining the latest loaded copy.


      **Grain:** source, candidate_id, observed_at


      **What changes here:** how the published candidate catalogue and its reported brightness change
      across collection days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `mpc_neocp` — licence: MPC (Minor Planet Center); attribution required: True. Source configuration:
      `extract/sources/mpc_neocp.yml`.'
