tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for prediction markets returned by Manifold Markets.
      Each row represents one market at one extractor observation timestamp, retaining market state, probability
      and activity measures, resolution fields, and raw-load lineage. The incremental table preserves
      append-only observation history without rescanning prior snapshots on each load; repeated raw copies
      of the same observation are reduced to the latest loaded row.


      **Grain:** source_name, market_id, observed_at


      **What changes here:** how market participation and implied probabilities shift across observation
      days and scheduled close months.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `manifold_markets` — licence: Manifold Markets API — public; attribution required: False. Source
      configuration: `extract/sources/manifold_markets.yml`.'
