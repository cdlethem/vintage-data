tiles:
- h: 6
  properties:
    content: 'Daily incremental observation fact for DNS resource records published by IANA. Each row
      is one source, record identifier, and fetch timestamp, preserving the published owner, TTL, class,
      type, record data, publisher update marker, and raw-load lineage. Replayed copies of the same observation
      grain are reduced to the latest loaded row; this model does not resolve DNS records or infer changes
      between snapshots.


      **Grain:** source, record_id, observed_at


      **What changes here:** how the published DNS record catalogue and TTL policy vary across collection
      days and record types.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `iana_dns` — licence: IANA file-use terms; attribution required: True. Source configuration: `extract/sources/iana_dns.yml`.'
