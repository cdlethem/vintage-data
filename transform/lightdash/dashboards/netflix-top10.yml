tiles:
- h: 6
  properties:
    content: 'Daily-refreshed physical fact of Netflix Top 10 observations. Each row is one weekly title
      rank within a geographic scope and category, with repeated insert-only loads reduced to the latest
      copy and raw-load lineage retained.


      **Grain:** week, scope, category, weekly_rank, show_title


      **What changes here:** how the observed Top 10 catalogue level and viewing-hour mix move across
      daily fetches and ranking weeks.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `netflix_top10` — licence: Netflix data-use terms; attribution required: True. Source configuration:
      `extract/sources/netflix_top10.yml`.'
