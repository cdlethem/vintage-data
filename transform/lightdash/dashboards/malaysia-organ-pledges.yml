tiles:
- h: 6
  properties:
    content: 'Physical observation fact for Malaysia''s daily organ-donor pledge counts by state. Each
      row records one state and pledge-date observation from one extractor snapshot, preserving repeated
      snapshots so historical withdrawals and other publisher revisions remain visible. Duplicate copies
      of the same source, pledge identifier, and observation timestamp are reduced to the latest loaded
      record.


      **Grain:** source_name, pledge_id, observed_at


      **What changes here:** how reported organ-donor pledge volume changes by pledge date across the
      published feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `malaysia_organ_pledges` — licence: CC BY 4.0; attribution required: True. Source configuration:
      `extract/sources/malaysia_organ_pledges.yml`.'
