tiles:
- h: 6
  properties:
    content: 'Incremental physical history of measurements published by Sensor Community. Each row represents
      one sensor at one measurement timestamp. Repeated snapshots from the insert-only raw feed are reduced
      to the latest loaded copy for the sensor and timestamp, while the source metadata, typed common
      measurements, original values, and load lineage remain available for audit and replay.


      **Grain:** source_name, sensor_id, observed_at


      **What changes here:** how reporting coverage and particulate levels move across daily sensor observations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sensor_community` — licence: Sensor.Community — public, attribution via User-Agent contact; attribution
      required: False. Source configuration: `extract/sources/sensor_community.yml`.'
    hideFrame: false
    title: Sensor community measurement
