tiles:
- h: 6
  properties:
    content: 'Incremental history of GLOBE Observer protocol measurements. Each row is one distinct source
      payload identified by measurement id, observation timestamp, and content hash; repeated raw deliveries
      of an identical payload merge while distinct payload versions remain observable. Raw-load lineage
      is retained for replay and audit.


      **Grain:** measurement_id, observed_at, content_hash


      **What changes here:** how GLOBE measurement coverage and site elevation patterns change across
      countries over three decades.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `globe_measurements` — licence: GLOBE data-use policy; attribution required: True. Source configuration:
      `extract/sources/globe_measurements.yml`.'
    hideFrame: false
    title: Globe measurement observation
