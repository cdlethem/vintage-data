tiles:
- h: 6
  properties:
    content: 'Daily observations of UK legal-aid processing backlogs by processing item. Each row represents
      one processing item in one published feed snapshot, preserving the source percentage text alongside
      its normalized proportion and the dates reported by the publisher.


      **Grain:** source, processing_stream, processing_item, observed_at


      **What changes here:** backlog proportions move across processing streams as the publisher advances
      its current date.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `uk_legal_aid_processing` — licence: Open Government Licence; attribution required: True. Source
      configuration: `extract/sources/uk_legal_aid_processing.yml`.'
    hideFrame: false
    title: Uk legal aid processing
