tiles:
- h: 6
  properties:
    content: 'Physical observation fact for Federal Register rule and publication records. Each row records
      one document identifier at one extractor observation timestamp, preserving publication metadata,
      public-inspection state, and raw-load lineage. Repeated copies of the same source, document, and
      observation timestamp retain the latest loaded row.


      **Grain:** document_id, observed_at


      **What changes here:** how Federal Register publication volume and agency mix change across publication
      and fetch time.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `federal_register` — licence: US Government work, public domain; attribution required: False.
      Source configuration: `extract/sources/federal_register.yml`.'
    hideFrame: false
    title: Federal register rule publication observation
