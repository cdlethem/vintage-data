tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot fact of Manchester food-hygiene ratings. Each row is one business
      returned by the publisher for one fetched snapshot; source values are typed where stable, while
      the original rating text and loader lineage remain available for audit and replay.


      **Grain:** source, business_id, observed_at


      **What changes here:** how Manchester rating activity and reported hygiene scores shift across business
      types over rating history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings_manchester` — see dbt raw-source lineage.'
