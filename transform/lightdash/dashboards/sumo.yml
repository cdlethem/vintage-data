tiles:
- h: 6
  properties:
    content: 'Append-oriented snapshot fact for the sumo-api.com rikishi roster. Each row is one wrestler from the rikishi source at one UTC fetch timestamp, with physical profile attributes and raw-load lineage. Basho records are excluded before keys or metrics are derived. Distinct observed_at values remain historical snapshots, while deterministic replays within an existing source, rikishi, and observation timestamp grain can replace attributes and lineage with the selected winner.


      **Grain:** source_system, rikishi_id, observed_at


      **What changes here:** how wrestler updates, rank mix, stable breadth, and reported physique change across the sparse roster snapshots.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state their own axis and window. Empty charts mean no matching published observations; they do not establish that no events occurred.


      **Provenance**

      - `sumo_rikishi` — sumo-api.com; licence: sumo-api.com — public; attribution required: False. Source configuration: `extract/sources/sumo.yml`.'
