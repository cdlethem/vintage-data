tiles:
- h: 6
  properties:
    content: 'Insert-only physical history of sumo-api.com rikishi roster snapshots. Each row represents
      one source system and rikishi identifier at one UTC fetched timestamp; repeated raw copies of that
      snapshot are reduced to the latest loaded row while raw-load lineage is retained. Current rank,
      heya, names, and physical attributes are values reported in that snapshot, not SCD2 intervals or
      additive roster records. Source is sumo-api.com via `extract/sources/sumo.yml`.


      **Grain:** source_system, rikishi_id, observed_at


      **What changes here:** how source-reported rikishi updates, stable identities, rank divisions, stables,
      and physical measurements appear across sparse roster snapshots.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sumo` — licence: sumo-api.com — public; attribution required: False. Source configuration: `extract/sources/sumo.yml`.'
