tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot of Glasgow food-hygiene ratings. Each row is one food business from
      one publisher snapshot, identified by source, business_id, and observed_at. Source business attributes
      and the three nested FHRS scores are exposed as typed columns while loader lineage is retained;
      duplicate source rows are reduced deterministically by load lineage.


      **Grain:** source, business_id, observed_at


      **What changes here:** how Glasgow rating activity and the variety of published rating labels shift
      across business types.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings_glasgow` — see dbt raw-source lineage.'
