tiles:
- h: 6
  properties:
    content: 'Daily physical history of OEIS sequence records. Each row is one sequence identifier observed
      in one OEIS fetch, retaining sequence metadata and raw load lineage; repeated ingestion of the same
      observation is reduced to the latest loaded copy.


      **Grain:** source_name, sequence_id, observed_at


      **What changes here:** how the OEIS feed''s observed sequence catalogue changes by day and how far
      its accession coverage reaches.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `oeis` — licence: unstated (OEIS content is generally freely reusable with attribution per its
      own site, not independently verified here); attribution required: True. Source configuration: `extract/sources/oeis.yml`.'
    hideFrame: false
    title: Oeis sequence snapshot
