name: Nager Date
slug: nager-date
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Daily physical history of Nager.Date holiday calendar observations. Grain is one source
      and publisher-derived holiday variant per UTC fetch timestamp. Replay copies are deduplicated while
      later observations remain auditable. Identity includes holiday types and subdivisions, so same-date
      variants survive. Event-time analysis includes future published dates and all observed versions;
      it is not a latest-only authoritative calendar or a guarantee of business closures.


      **Grain:** source, holiday_id, observed_at


      **What changes here:** See when holidays fall and distinguish nationwide observance from regional
      calendar variants. Future dates are published calendar entries, not forecasts. Snapshot history
      starts when collection began; it is not a complete historical calendar.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - Nager.Date public holiday API — https://date.nager.at. Scheduled source: extract/sources/nager_date.yml;
      currently US upcoming holidays only. Source configuration records licence as unstated; no broader
      coverage or reuse rights are implied.'
    hideFrame: false
    title: Holiday calendar observations
  type: markdown
  w: 36
  x: 0
  y: 0
