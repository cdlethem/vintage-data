tiles:
- h: 6
  properties:
    content: 'Incremental physical observation fact for IETF Datatracker activity events. Each row represents
      one Datatracker event identifier from the source stream at one extractor observation timestamp,
      retaining event classification, draft and revision context, event text and timing, and raw-load
      lineage. The twice-hourly incremental merge replays the latest atomic load and reduces repeated
      copies of the same source event observation to its latest loaded record.


      **Grain:** source_system, event_id, observed_at


      **What changes here:** how Datatracker event volume and draft coverage shift across event and observation
      days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ietf_datatracker` — licence: IETF Datatracker — public; attribution required: False. Source configuration:
      `extract/sources/ietf_datatracker.yml`.'
    hideFrame: false
    title: Ietf datatracker event observation
