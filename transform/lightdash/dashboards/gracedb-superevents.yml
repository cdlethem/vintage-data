tiles:
- h: 6
  properties:
    content: 'Physical gravitational-event observation fact from the LIGO/Virgo/KAGRA GraceDB superevent
      feed. Each row is one superevent observation at one extractor fetch timestamp, retaining event timing,
      false-alarm and classification fields, retraction state, source links, and raw-load lineage. Duplicate
      copies of the same source, superevent, and observation timestamp are reduced to the latest loaded
      record.


      **Grain:** source, superevent_id, observed_at


      **What changes here:** how the cataloged gravitational-wave event count and reported false-alarm
      rate vary across event and observation days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gracedb_superevents` — licence: GraceDB public superevents; attribution required: False. Source
      configuration: `extract/sources/gracedb_superevents.yml`.'
    hideFrame: false
    title: Gracedb superevents
