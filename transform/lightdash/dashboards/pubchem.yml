tiles:
- h: 6
  properties:
    content: 'Historical snapshots of PubChem PUG-REST compound lookups. Each row represents one source,
      requested query, returned compound identifier, and API observation timestamp; repeated raw ingestion
      of the same lookup is reduced to the latest loaded copy while not-found lookup rows remain observable.


      **Grain:** source, compound_id, fetched_at, query


      **What changes here:** how the small requested compound set and its molecular-weight level change
      between fetches.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `pubchem` — licence: unstated (US federal, NIH/NLM); attribution required: False. Source configuration:
      `extract/sources/pubchem.yml`.'
    hideFrame: false
    title: Pubchem compound snapshot
