tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Canadian Air Transport Security Authority checkpoint wait-time
      observations by airport and checkpoint. Each row preserves the published wait-time text, parsed
      minute bounds where present, and raw load lineage for replay and audit.


      **Grain:** airport_slug, checkpoint, observed_at


      **What changes here:** how checkpoint wait bounds and reporting availability move through the four-day
      polling window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `catsa_wait_times` — licence: CATSA website terms; attribution required: True. Source configuration:
      `extract/sources/catsa_wait_times.yml`.'
