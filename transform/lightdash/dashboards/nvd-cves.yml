tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for National Vulnerability Database CVE records.
      Each row is one NVD source system, CVE identifier, and extractor observation timestamp, retaining
      the published vulnerability attributes and raw-load lineage. Replayed copies of the same observation
      are reduced to the latest loaded row; this model preserves source values and does not infer remediation,
      severity, or vulnerability relationships.


      **Grain:** source_system, cve_id, observed_at


      **What changes here:** how publication volume, severity, and workflow status shift across NVD release
      months.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nvd_cves` — licence: NVD — US Government work, public domain; attribution required: False. Source
      configuration: `extract/sources/nvd_cves.yml`.'
    hideFrame: false
    title: Nvd cve observation
