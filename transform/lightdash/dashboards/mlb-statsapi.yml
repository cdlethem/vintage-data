tiles:
- h: 6
  properties:
    content: 'Physical observation fact for MLB schedule records. Each row is one observed game snapshot
      at the StatsAPI fetch timestamp, retaining the scheduled game, participating teams, status, scores,
      venue, probable pitchers, and raw-load lineage. The source does not expose player-level statistics,
      so this model intentionally has no player grain.


      **Grain:** game_id, observed_at


      **What changes here:** how the scheduled game slate, status mix, and reported scores change across
      the collection window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `mlb_statsapi` — licence: MLB Advanced Media — personal/prototype use only, read their terms before
      going further; attribution required: True. Source configuration: `extract/sources/mlb_statsapi.yml`.'
    hideFrame: false
    title: Mlb statsapi game observations
