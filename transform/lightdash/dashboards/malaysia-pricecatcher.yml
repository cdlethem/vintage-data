tiles:
- h: 6
  properties:
    content: 'Daily physical history of Malaysia PriceCatcher observations. Each row represents one source
      price observation identified by the source observation id and fetch timestamp; repeated insert-only
      loads of that observation are reduced to the latest loaded copy while source and loader lineage
      are retained. The model is incremental because the raw source contains 126 million loaded rows and
      receives new daily extracts, making a full rebuild unnecessarily expensive for the daily cadence.


      **Grain:** source, price_observation_id, observed_at


      **What changes here:** how reported Malaysian prices and item coverage shift across collection days
      and source price dates.


      **Window:** ranked and record tiles cover the past 1 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `malaysia_pricecatcher` — licence: CC BY 4.0; attribution required: True. Source configuration:
      `extract/sources/malaysia_pricecatcher.yml`.'
