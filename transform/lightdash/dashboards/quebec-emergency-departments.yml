tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Quebec emergency-department status observations. Each row represents
      one department or published regional total at one upstream fetch timestamp. Source text is retained
      alongside null-safe typed patient, stretcher, and length-of-stay measures, with raw load lineage
      for replay and audit.


      **Grain:** source, department_id, observed_at


      **What changes here:** how emergency-department waiting and stretcher pressure moves through observed
      hours across Quebec facilities and health regions.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `quebec_emergency_departments` — licence: Quebec open-government reuse terms; attribution required:
      True. Source configuration: `extract/sources/quebec_emergency_departments.yml`.'
