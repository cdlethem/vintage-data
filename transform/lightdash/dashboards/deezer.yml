tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Deezer chart observations. Each row represents one source, track,
      observation timestamp, and chart position, retaining track metadata and raw-load lineage. Repeated
      raw loads of the same chart slot are reduced to the latest loaded record.


      **Grain:** source_name, track_id, observed_at, chart_position


      **What changes here:** how Deezer''s short-window chart level, artist breadth, ranking, and explicit-content
      mix move across observations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `deezer` — licence: unstated; attribution required: False. Source configuration: `extract/sources/deezer.yml`.'
    hideFrame: false
    title: Deezer chart observation
  type: markdown
