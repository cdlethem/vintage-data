tiles:
- h: 6
  properties:
    content: 'Hourly physical history of NHTSA vehicle-recall observations. Each row is one recall identifier
      as observed by the extractor at a fetched timestamp, with report content and raw-load lineage retained
      for audit and replay.


      **Grain:** recall_id, observed_at


      **What changes here:** how recall notices arrive across report months and affected vehicle components.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nhtsa` — licence: US Government work, public domain; attribution required: False. Source configuration:
      `extract/sources/nhtsa.yml`.'
    hideFrame: false
    title: Nhtsa recall
