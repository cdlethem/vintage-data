tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Queensland hospital emergency-pressure observations. Each
      row records one facility snapshot at an extractor fetch time, including source-published wait-time
      values, normalized minute and count measures, facility metadata, and raw-load lineage. The model
      grain is source, hospital_id, observed_at.


      **Grain:** source, hospital_id, observed_at


      **What changes here:** how Queensland hospitals'' emergency wait and capacity levels move across
      observed days while published space dates remain sparse reference points.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `queensland_hospital` — licence: Queensland Health terms; attribution required: True. Source configuration:
      `extract/sources/queensland_hospital.yml`.'
