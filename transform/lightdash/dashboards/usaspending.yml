tiles:
- h: 6
  properties:
    content: 'Daily physical history of USAspending contract and grant award observations. Each row is
      one award identifier observed in one extractor response at an observation timestamp; repeated raw
      copies of that award observation are reduced to the latest loaded row while load lineage remains
      available for audit and replay.


      **Grain:** award_id, observed_at


      **What changes here:** how award counts and reported dollar amounts shift across performance-start
      months and awarding agencies.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `usaspending` — licence: US Government work, public domain; attribution required: False. Source
      configuration: `extract/sources/usaspending.yml`.'
    hideFrame: false
    title: Usaspending award observations
