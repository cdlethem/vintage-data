tiles:
- h: 6
  properties:
    content: 'Hourly physical change-observation fact for medicine shortages published by the European
      Medicines Agency. The extractor emits one row when a catalogue entry is first seen, updated, or
      removed, and emits every entry when seeding its baseline. Each row is one source label, stable shortage
      identifier, and extractor fetch timestamp. Replayed raw copies of the same observation are reduced
      to the latest loaded row while the source change history remains available.


      **Grain:** source, shortage_id, fetched_at


      **What changes here:** how newly published medicine shortages and their status mix accumulate across
      EMA history.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ema_medicine_shortages` — licence: EMA legal notice permits commercial and non-commercial reproduction
      and distribution when EMA is acknowledged; third-party material excluded; attribution required:
      True. Source configuration: `extract/sources/ema_medicine_shortages.yml`.'
