tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Finnish Digitraffic AtoN fault observations. Each row is
      one reported fault identified by its upstream source and fault identifier at an extractor observation
      timestamp; normalized fault status, AtoN and fairway attributes, point coordinates, and raw-load
      lineage are retained for analysis and replay auditing.


      **Grain:** source_name, fault_id, observed_at


      **What changes here:** how reported AtoN fault entries, affected aids, and status mix change across
      the publisher''s fault-entry history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `digitraffic_marine` — licence: CC BY 4.0; attribution required: True. Source configuration: `extract/sources/digitraffic_marine.yml`.'
