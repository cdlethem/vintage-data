tiles:
- h: 6
  properties:
    content: 'Incremental physical history of Rhode Island shelter statistics. Each row is one shelter-species
      record at one publisher observation timestamp, retaining intake, outcome, population-status metrics,
      and raw-load lineage from the insert-only source.


      **Grain:** source_name, record_id, observed_at


      **What changes here:** how reported shelter intake and outcome levels change across species and
      shelter-status records in the four-day collection history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ri_shelter_stats` — licence: Rhode Island terms; attribution required: True. Source configuration:
      `extract/sources/ri_shelter_stats.yml`.'
    hideFrame: false
    title: Ri shelter stats
