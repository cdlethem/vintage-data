tiles:
- h: 6
  properties:
    content: 'Physical daily fact of NOAA catch-share quota observations. Each row is the latest loaded
      record for one quota identifier at one source-fetch timestamp; repeated raw loads of the same observation
      are reduced using load lineage. The source''s display-formatted quota fields are retained alongside
      its typed numeric value fields, while quota_increase_value remains text because the source can report
      multiple comma-separated values in that field.


      **Grain:** source, quota_id, observed_at


      **What changes here:** how the current NOAA quota catalogue and reported remaining and landing levels
      move across collection days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `noaa_catch_quotas` — licence: US federal public data; attribution required: False. Source configuration:
      `extract/sources/noaa_catch_quotas.yml`.'
