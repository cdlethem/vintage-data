tiles:
- h: 6
  properties:
    content: 'Incremental physical history of OpenActive slot-feed observations, including and extractor-row
      observation. The source row identifier preserves repeated observations as auditable append-only
      facts alongside their original loader lineage. Slot attributes are parsed from the feed''s JSON
      data when a record is not a tombstone.


      **Grain:** source, record_id, observed_at, _row_id


      **What changes here:** how scheduled activity supply expands into future months and how remaining
      capacity differs by provider.


      **Window:** ranked and record tiles cover the past 2 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `openactive_feeds` — licence: CC BY 4.0 from the respective providers; attribution required: True.
      Source configuration: `extract/sources/openactive_feeds.yml`.'
