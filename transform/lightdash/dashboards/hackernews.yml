tiles:
- h: 6
  properties:
    content: 'Incremental physical observation fact for Hacker News API items. Each row is one Hacker
      News item identifier from the source stream at one fetched_at observation timestamp, preserving
      the item payload fields and raw-load lineage. Replayed copies of the same source, item, and observation
      timestamp are reduced to the latest loaded row; this model does not infer parent/child relationships
      or fill fields omitted by the API.


      **Grain:** source_system, item_id, observed_at


      **What changes here:** how Hacker News item volume and story engagement change across the sparse
      archive.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `hackernews` — licence: HN Firebase API — public; attribution required: False. Source configuration:
      `extract/sources/hackernews.yml`.'
