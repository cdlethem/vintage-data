tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of models returned by the Hugging Face model catalog. Each
      row is one model from one catalog observation, identified by the source, model identifier, and fetch
      timestamp. If the same observation is loaded more than once, the latest load copy is kept while
      its raw lineage remains available.


      **Grain:** source_name, model_id, observed_at


      **What changes here:** how the observed model catalogue and engagement signals move across collection
      days and model authors.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `huggingface` — licence: unstated; attribution required: False. Source configuration: `extract/sources/huggingface.yml`.'
    hideFrame: false
    title: Huggingface model snapshot
