tiles:
- h: 6
  properties:
    content: 'Daily physical history of Apple iTunes chart observations. Each row represents one storefront,
      chart, observation timestamp, and chart rank, retaining the track attributes and raw-load lineage
      for replay and audit. Repeated raw loads of the same chart rank are reduced to the latest loaded
      record.


      **Grain:** source, storefront, chart, fetched_at, rank


      **What changes here:** how daily iTunes chart rank and genre mix change alongside the historical
      release dates represented in the chart.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `itunes_charts` — licence: unstated; attribution required: False. Source configuration: `extract/sources/itunes_charts.yml`.'
    hideFrame: false
    title: Itunes charts
  type: markdown
  w: 36
  x: 0
  y: 0
