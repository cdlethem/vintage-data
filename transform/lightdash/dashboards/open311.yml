tiles:
- h: 6
  properties:
    content: 'Twice-hourly incremental history of Open311 service-request observations. Each row is one
      source request at one extractor observation timestamp, retaining the normalized request status and
      attributes together with raw load lineage. Repeated copies of the same observation are reduced to
      the latest loaded copy so the insert-only source can be replayed safely.


      **Grain:** source_name, request_id, observed_at


      **What changes here:** how service-request demand, service breadth, and status mix change by request
      week.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `open311` — licence: open311 public data; attribution required: True. Source configuration: `extract/sources/open311.yml`.'
    hideFrame: false
    title: Open311 service request observation
