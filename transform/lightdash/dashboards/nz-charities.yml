tiles:
- h: 6
  properties:
    content: 'Physical daily snapshot/SCD2-style history of New Zealand Charities Register organisation observations.
      Each row is one source, organisation identifier, and UTC fetch timestamp; repeated copies of the same
      observation grain retain the latest loaded file row. This is not a current-state census.


      **Grain:** source, id, fetched_at


      **Time meanings:** `fetched_at` is the UTC snapshot observation time. `modifiedon` is the source-record
      revision event time. `dateregistered` is the original source registration event time.


      **What changes here:** revision-event activity and the reported overseas-spending share by revision
      day. Trend axes use their named source-event timestamp and rolling 30-day UTC bounds; counts are
      non-additive distinct charities, and overseas spending is a non-summable mean in percentage points.


      **Latest window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC). Empty charts
      mean no matching published observations; they do not establish that no events occurred.


      **Provenance and attribution**


      - New Zealand Charities Register `nz_charities` data is licensed under CC BY 3.0 NZ; attribution is
        required. Source configuration: `extract/sources/nz_charities.yml`.'
    hideFrame: false
    title: Nz charities
  type: markdown
