tiles:
- h: 6
  properties:
    content: 'Physical daily snapshot of New Zealand Charities Register organisation observations. Each
      row is one source, organisation identifier, and fetch timestamp, with the published organisation
      attributes and nested register details retained alongside load lineage. Repeated copies of the same
      observation grain are resolved to the latest loaded file row. Successive observations form SCD2-like
      history rather than a current-state census.


      **Grain:** source, id, fetched_at


      **What changes here:** when registered charities are revised and how their published overseas-spending
      profile varies by organisation type.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nz_charities` — licence: CC BY 3.0 NZ; attribution required: True. Source configuration: `extract/sources/nz_charities.yml`.'
