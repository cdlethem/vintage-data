tiles:
- h: 6
  properties:
    content: 'Physical daily snapshot of New Zealand Charities Register organisation observations. Each
      row is one source, organisation identifier, and UTC fetch timestamp. Published attributes, the complete
      raw payload, and load lineage are retained; replay copies at the same grain resolve to the latest loaded
      file row. This is SCD2-like observation history without validity ranges, not a current-state table.


      **Grain:** source, id, fetched_at


      **What changes here:** represented source revisions and registrations, plus the reported overseas-spending
      profile. Distinct-entity counts are non-additive across changing groups, and percentage-point averages
      are non-summable across snapshots, dates, or groups.


      **Window:** every chart uses a rolling 30-day UTC bound. Ranked and record tiles use `fetched_at`;
      revision trends use source `modifiedon`; the registration trend uses source `dateregistered`. Empty
      charts mean no matching published observations and do not prove no events occurred.


      **Provenance**

      - New Zealand Charities Register data (`nz_charities`) — licensed CC BY 3.0 NZ; attribution required.
      Source configuration: `extract/sources/nz_charities.yml`.'
    hideFrame: false
    title: Nz charities
