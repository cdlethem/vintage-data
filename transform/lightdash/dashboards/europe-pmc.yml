tiles:
- h: 6
  properties:
    content: 'Daily physical observation fact for publications returned by the bounded Europe PMC search. Each row is one Europe PMC source-qualified article identifier at one extractor observation timestamp, preserving publication metadata, point-in-time citation and availability fields, and raw-load lineage. Replayed copies at the same grain retain the latest loaded row.


      **Grain:** source_name, article_id, observed_at


      **What changes here:** how the publications observed in Europe PMC''s rolling FIRST_PDATE replay change by publication date, source, citation level, and open-access status.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state their own axis and window. Empty charts mean no matching published observations; they do not establish that no events occurred.


      **Replay/snapshot semantics:** the extractor queries `FIRST_PDATE:[NOW-14DAY TO NOW]`, advances a cursor through at most four pages and 400 records per run, then restarts completed traversals to replay the rolling window. Event-time trends use only the latest two UTC observation days so repeated historical snapshots remain bounded. These charts describe observed bounded snapshots, not complete Europe PMC publication output or first-seen events.


      **Provenance**

      - `europe_pmc` — Europe PMC metadata and text-mined annotations; record-level source rights may vary; attribution required: True. Source configuration: `extract/sources/europe_pmc.yml`.'
