tiles:
- h: 6
  properties:
    content: 'Incremental physical history of Seattle Fire 911 incidents published through the Socrata
      civic feed. Each row is one source record at one fetch timestamp (source, record_id, observed_at),
      with typed event and location attributes, and raw-load lineage. Replayed records at the same grain
      retain only the latest loaded copy.


      **Grain:** source_relation, record_id, observed_at


      **What changes here:** how the recent incident level, geographic spread, and incident-type mix move
      through the five-day feed window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `socrata_civic` — licence: Socrata/SODA — per-city open data licence; attribution required: False.
      Source configuration: `extract/sources/socrata_civic.yml`.'
