tiles:
- h: 6
  properties:
    content: 'Physical observation fact for Sveriges Radio''s right-now programme schedule. Each row is
      one previous, current, or next scheduled episode observed for a channel at an extractor fetch timestamp.
      Repeated copies of the same source, observation identifier, and timestamp retain the latest loaded
      row while preserving raw-load lineage.


      **Grain:** source_name, observation_id, observed_at


      **What changes here:** how the current Sveriges Radio schedule''s programme mix and episode coverage
      change each day.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `sveriges_radio_now` — licence: Sveriges Radio API terms; attribution required: True. Source configuration:
      `extract/sources/sveriges_radio_now.yml`.'
