tiles:
- h: 6
  properties:
    content: 'Daily physical history of procurement notices published through the Tenders Electronic Daily
      (TED) source. Each row is one notice identifier observed at one extractor timestamp, retaining the
      source''s publication, buyer, category, value, deadline, and place-of-performance attributes with
      raw-load lineage. Repeated rows for the same notice and observation timestamp are reduced to the
      latest loaded record.


      **Grain:** notice_id, observed_at


      **What changes here:** how procurement notice volume and reported values shift across publication
      days and notice categories.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ted_procurement` — licence: EU Official Journal — open reuse with source acknowledgement; attribution
      required: True. Source configuration: `extract/sources/ted_procurement.yml`.'
