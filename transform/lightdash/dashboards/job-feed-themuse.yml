tiles:
- h: 6
  properties:
    content: 'Daily physical history of The Muse job observations. Each row represents one The Muse job
      identifier from one extractor response at an observed timestamp; repeated raw ingestion of the same
      observation is reduced to the latest loaded copy while load-layer lineage remains available for
      audit and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how The Muse''s published job volume and hiring mix shift month by month
      across departments and experience levels.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_themuse` — licence: public The Muse jobs API; attribution required: True. Source configuration:
      `extract/sources/job_feed_themuse.yml`.'
