tiles:
- h: 6
  properties:
    content: 'Physical archive observation fact for Software Heritage origin records. Each row represents
      one repository observation at one extractor fetch time, with visit summary attributes and raw-load
      lineage retained for auditability. Duplicate copies of the same source, repository, and fetch timestamp
      are reduced to the latest loaded record.


      **Grain:** archive_source, repository_id, fetched_at


      **What changes here:** how reported repository visit recency, visit volume, and visit-state composition
      change across the archive''s sparse history.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `software_heritage` — licence: unstated; attribution required: False. Source configuration: `extract/sources/software_heritage.yml`.'
