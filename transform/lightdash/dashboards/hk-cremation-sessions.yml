tiles:
- h: 6
  properties:
    content: 'Hourly physical observation fact for the Hong Kong Food and Environmental Hygiene Department
      cremation-session availability page. Each row records one crematorium and service date in one extractor
      snapshot, retaining the published availability state, daily total, publisher update time, and raw
      load lineage. Repeated copies of the same source, session identifier, and observation timestamp
      retain the latest loaded row.


      **Grain:** source, session_id, observed_at


      **What changes here:** how published cremation availability and daily capacity vary across service
      dates and crematoria.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `hk_cremation_sessions` — licence: FEHD terms; attribution required: True. Source configuration:
      `extract/sources/hk_cremation_sessions.yml`.'
