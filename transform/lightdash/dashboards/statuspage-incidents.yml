name: Statuspage Incidents
slug: statuspage-incidents
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Hourly physical history of incidents reported by the Statuspage API. Each row represents
      one upstream status page incident at one extractor observation timestamp, retaining incident lifecycle,
      impact, nested update and component details, page context, and complete load lineage. Repeated insert-only
      copies of the same source, incident, and observation timestamp are reduced to the latest loaded
      copy.


      **Grain:** source_name, incident_id, observed_at


      **What changes here:** how incident intake and impact mix change across the three-month lifecycle
      history while the latest feed level remains steady.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `statuspage_incidents` — licence: public status page; attribution required: False. Source configuration:
      `extract/sources/statuspage_incidents.yml`.'
