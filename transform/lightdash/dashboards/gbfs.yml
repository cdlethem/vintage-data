  properties:
    content: 'Daily station-level GBFS availability aggregates rebuilt for the latest two observed UTC
      dates so late observations repair recent history.


      **Grain:** network, station_id, observation_date


      **What changes here:** how daily station coverage and average capacity move across the two GBFS
      networks.


      **Window:** ranked and record tiles cover the past 30 days of `observation_date` (UTC); trend tiles
      state their own axis and window. Empty charts mean no matching published observations; they do not
      establish that no events occurred.


      **Provenance**

      - `gbfs_citibike` — licence: unstated; varies per operator; attribution required: False. Source
      configuration: `extract/sources/gbfs_citibike.yml`.

      - `gbfs_divvy` — licence: unstated; varies per operator; attribution required: False. Source configuration:
      `extract/sources/gbfs_divvy.yml`.'
