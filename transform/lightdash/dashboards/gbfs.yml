tiles:
- h: 6
  properties:
    content: 'Deduplicated GBFS station availability observations across supported networks, with source
      lineage retained for audit and replay.


      **Grain:** network, station_id, observed_at


      **What changes here:** how station coverage and reported bike availability change through each network''s
      polling stream.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gbfs_citibike` — licence: unstated; varies per operator; attribution required: False. Source
      configuration: `extract/sources/gbfs_citibike.yml`.

      - `gbfs_divvy` — licence: unstated; varies per operator; attribution required: False. Source configuration:
      `extract/sources/gbfs_divvy.yml`.'
    hideFrame: false
    title: Bike station availability
  type: markdown
