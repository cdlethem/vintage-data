tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for Hong Kong parking-vacancy snapshots. Each row
      records one parking facility, vehicle type, vacancy category, and extractor observation time, retaining
      publisher counts and raw load lineage. Repeated copies of the same observation grain retain the
      latest loaded row.


      **Grain:** source, park_id, vehicle_type, vacancy_type, category, observed_at


      **What changes here:** how parking vacancy levels vary by vehicle class and when the publisher refreshes
      facility records.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `hk_parking_vacancy` — licence: DATA.GOV.HK reuse terms; attribution required: True. Source configuration:
      `extract/sources/hk_parking_vacancy.yml`.'
