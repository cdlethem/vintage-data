tiles:
- h: 6
  properties:
    content: 'Daily physical history of National Snow and Ice Data Center sea-ice observations. Each row
      is the latest loaded record for one source, source record identifier, and observation date; repeated
      insert-only raw snapshots are reduced by load lineage while extractor and loader fields remain available
      for audit and replay.


      **Grain:** source_name, sea_ice_id, observation_date


      **What changes here:** how the reported Arctic sea-ice extent changes each day and whether the feed''s
      catalogue remains complete.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nsidc_sea_ice` — licence: unstated (US federal/NOAA-affiliated data); attribution required: True.
      Source configuration: `extract/sources/nsidc_sea_ice.yml`.'
