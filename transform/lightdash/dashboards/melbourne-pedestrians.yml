tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of Melbourne pedestrian counter observations. Each row is
      one source feed, counter location, sensing timestamp, and feed fetch timestamp, with directional
      counts and complete raw-load lineage. Duplicate records for that observation grain are retained
      by the latest loader file position so replayed source files cannot multiply the fact.


      **Grain:** source, location_id, sensing_datetime, observed_at


      **What changes here:** how pedestrian measurement volume and reported counts vary by hour, feed,
      and counter location.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `melbourne_pedestrians` — licence: City of Melbourne open-data terms; attribution required: True.
      Source configuration: `extract/sources/melbourne_pedestrians.yml`.'
