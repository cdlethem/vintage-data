tiles:
- h: 6
  properties:
    content: 'Physical observation fact for papers returned by the arXiv feed. Each row records one paper
      identifier at one feed observation timestamp, preserving the publication metadata and raw-load lineage
      needed to reproduce the insert-only source history. Repeated copies of the same source, paper, and
      observation timestamp retain the latest loaded row.


      **Grain:** source_name, paper_id, observed_at


      **What changes here:** how the newly observed arXiv feed and its subject mix change across publication
      hours.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `arxiv_new` — licence: arXiv API — free reuse, attribution requested; attribution required: True.
      Source configuration: `extract/sources/arxiv_new.yml`.'
