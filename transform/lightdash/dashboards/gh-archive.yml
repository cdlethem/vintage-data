tiles:
- h: 6
  properties:
    content: 'Physical hourly fact of GitHub Archive events. Each row represents one archive source, event
      identifier, and extractor fetch timestamp, retaining event metadata, typed scalar payload fields,
      the event payload, and raw-load lineage. Repeated copies of the same event observation retain the
      latest loaded record.


      **Grain:** archive_source, event_id, fetched_at


      **What changes here:** how GitHub event volume and distinct actors change by event type across the
      short observation and event windows.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gh_archive` — licence: unstated (GitHub public event data, redistributed by GH Archive); attribution
      required: False. Source configuration: `extract/sources/gh_archive.yml`.'
    hideFrame: false
    title: Gh archive events
