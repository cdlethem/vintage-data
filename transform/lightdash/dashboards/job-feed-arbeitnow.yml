tiles:
- h: 6
  properties:
    content: 'Daily physical history of Arbeitnow job observations. Each row represents one Arbeitnow
      job identifier in one extractor response at an observation timestamp; repeated ingestion of the
      same observation is reduced to the latest loaded copy while load-layer lineage is retained for audit
      and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how the Arbeitnow catalogue level and job mix change across observation days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_arbeitnow` — licence: public Arbeitnow Job Board API; attribution required: True. Source
      configuration: `extract/sources/job_feed_arbeitnow.yml`.'
    hideFrame: false
    title: Job feed arbeitnow
