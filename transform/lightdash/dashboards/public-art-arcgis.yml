tiles:
- h: 6
  properties:
    content: 'Daily physical history of public-art features published through ArcGIS. Each row is one
      source feature at one extractor observation timestamp; repeated copies delivered by later raw loads
      are reduced to the latest loaded record while raw-load lineage is retained. The two observed municipal
      feeds are normalized into common artwork, location, geometry, and source-publisher fields without
      discarding the source layer URL.


      **Grain:** source_name, feature_id, observed_at


      **What changes here:** how many artworks each municipal district keeps published, and when the publisher
      revises those records.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `public_art_arcgis` — licence: municipal open-data terms; attribution required: True. Source configuration:
      `extract/sources/public_art_arcgis.yml`.'
