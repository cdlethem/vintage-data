tiles:
- h: 7
  properties:
    content: 'Physical append-only observation fact for openFDA enforcement recalls. Each row records one recall
      identifier at one extractor fetch timestamp. Duplicate raw copies at that grain retain the latest load;
      subsequent source revisions remain separate observations, not SCD2 current state.


      **Grain:** source_name, recall_id, observed_at


      **What changes here:** the recalled-product catalogue returned by polling, and distinct recalls by FDA
      report date.


      **Window:** ranked and detail tiles cover the past 30 days of `observed_at` (UTC). Collection-time trends
      are observed catalogue levels, not newly reported recalls. FDA report-date trends count distinct recall
      identifiers and are sparse: absent dates do not mean zero recalls.


      **Limitations:** polling may miss source changes between fetches; recalled records can be revised or removed
      by FDA; this dashboard does not infer new recalls from observation counts or sum text quantities. Drug
      adverse-event records are outside this enforcement-recall contract.


      **Provenance**

      - `openfda` — openFDA, public domain. Source configuration: `extract/sources/openfda.yml`.'
    hideFrame: false
    title: OpenFDA recall observation
  type: markdown
