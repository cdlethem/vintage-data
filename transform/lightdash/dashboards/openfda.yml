name: Openfda
slug: openfda
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Physical observation fact for openFDA food-enforcement recalls. Each row is one source,
      recall identifier, and UTC fetch timestamp. Daily polling republishes recalls, so the mart is append-only
      observation history rather than SCD2; duplicate copies at that grain retain the latest load and
      file-row lineage. openFDA can revise records and publishes batch updates over days or weeks, so
      observations are neither real-time alerts nor proof of when a recall first became public.


      **Grain:** source_name, recall_id, observed_at


      **What changes here:** how distinct food-enforcement recalls vary across sparse FDA report dates,
      classifications, and countries while daily polling captures later revisions.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - Data provided by openFDA, a U.S. Food and Drug Administration public-domain API. `openfda` — licence:
      openFDA — public domain; attribution required: False. Source configuration: `extract/sources/openfda.yml`.'
    hideFrame: false
    title: OpenFDA recall observation
