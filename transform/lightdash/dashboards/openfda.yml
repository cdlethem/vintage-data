tiles:
- h: 7
  properties:
    content: 'Physical observation fact for openFDA food-enforcement recalls. Each row is one source,
      recall identifier, and UTC fetch timestamp. Daily polling republishes recalls, so this is append-only
      observation history rather than SCD2; duplicate copies at the observation grain retain the latest
      load lineage. This contract excludes drug adverse-event records.


      **Grain:** source_name, recall_id, observed_at


      **What changes here:** distinct food-enforcement recalls, initiating firms, and leading states across
      sparse FDA initiation and report dates, plus classifications, countries, and catalogue levels across
      fetch days.


      **Windows:** observation charts and records cover the past 30 days of `observed_at` (UTC). Report-date
      trends use 30-day windows; initiation-date trends use 180-day windows. Missing event dates and dates
      without matching recalls are absent rather than zero, so no dense daily series is implied.


      **Limitations:** openFDA is polled daily, is not real time, and can batch or revise records over days
      or weeks. Observation counts are not newly reported recalls; charts count distinct recall IDs, and
      quantity remains unaggregated source text. A targeted operator dev build and Lightdash chart preview
      against real data are required before production publication.


      **Provenance**

      - Data provided by openFDA, a U.S. Food and Drug Administration public-domain API. `openfda` —
      licence: openFDA — public domain; attribution required: False. Source configuration:
      `extract/sources/openfda.yml`.'
    hideFrame: false
    title: OpenFDA recall observation
