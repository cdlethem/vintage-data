tiles:
- h: 6
  properties:
    content: 'Hourly physical history of MusicBrainz release-search observations. Each row represents
      one source release identifier at one extractor observation timestamp, retaining release metadata
      and loader lineage. The source has a small observed hourly payload (25 rows per load), so a table
      rebuild is preferred over incremental state while preserving the complete history. Repeated copies
      of the same source, release, and observation timestamp retain the latest loaded row.


      **Grain:** source_name, release_id, observed_at


      **What changes here:** how the small observed release catalogue and its track depth shift across
      daily MusicBrainz polls.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `musicbrainz` — licence: CC0 for MusicBrainz''s own database content per their standard terms
      (not independently re-verified here); attribution required: False. Source configuration: `extract/sources/musicbrainz.yml`.'
    hideFrame: false
    title: Musicbrainz release observation
