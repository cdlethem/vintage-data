tiles:
- h: 6
  properties:
    content: 'Daily physical history of reservoir measurements published by the California Data Exchange
      Center. Each row is one upstream measurement identifier from one extractor observation timestamp,
      preserving the station, sensor, measurement interval, reported value, quality flags, capacity context,
      and raw-load lineage for audit and replay. The model grain is source_name, reservoir_level_id, observed_at.


      **Grain:** source_name, reservoir_level_id, observed_at


      **What changes here:** how reservoir storage levels and reported flow measures change across stations
      and their 35-day source observation history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `reservoir_levels` — licence: California DWR — public domain, attribution requested; attribution
      required: True. Source configuration: `extract/sources/reservoir_levels.yml`.'
