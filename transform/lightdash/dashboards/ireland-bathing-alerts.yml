tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of bathing-water alerts published for Irish beaches. Each
      row is one source alert at one extractor fetch timestamp, identified by source, alert identifier,
      and fetched_at. Repeated copies from later insert-only raw loads are reduced to the latest loaded
      record, while load lineage is retained for replay and audit.


      **Grain:** source, alert_id, fetched_at


      **What changes here:** how bathing-alert levels and expected durations differ across Irish counties
      over sparse incident dates.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ireland_bathing_alerts` — licence: Ireland EPA open-data terms; attribution required: True. Source
      configuration: `extract/sources/ireland_bathing_alerts.yml`.'
