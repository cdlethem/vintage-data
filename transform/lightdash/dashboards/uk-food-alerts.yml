tiles:
- h: 6
  properties:
    content: 'Hourly physical history of food safety alerts published by the UK Food Standards Agency.
      Each row is one alert at one extractor fetch timestamp, identified by the publisher source, alert
      identifier, and fetched_at. Repeated copies from later insert-only raw loads are reduced to the
      latest loaded record while the nested alert payload and load lineage remain available for audit
      and replay.


      **Grain:** source, alert_id, fetched_at


      **What changes here:** alerts created over time and the businesses most often named in food safety
      notices.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `uk_food_alerts` — licence: OGL 3.0; attribution required: True. Source configuration: `extract/sources/uk_food_alerts.yml`.'
