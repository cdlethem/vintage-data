tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of OpenSky aircraft state observations. Each row is one source,
      aircraft, and fetch timestamp, preserving the reported position, motion, flight identity, and raw-load
      lineage. Replayed copies of the same observation grain are reduced to the latest loaded row; this
      model does not interpolate tracks or infer flights between snapshots.


      **Grain:** source, aircraft_id, observed_at


      **What changes here:** how the observed aircraft population, altitude, speed, and country mix move
      through each OpenSky snapshot cycle.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `opensky` — licence: OpenSky Network — public ADS-B aggregation; attribution required: False.
      Source configuration: `extract/sources/opensky.yml`.'
    hideFrame: false
    title: Opensky flight observation
