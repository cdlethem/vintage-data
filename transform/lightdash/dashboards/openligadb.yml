tiles:
- h: 6
  properties:
    content: 'Physical hourly observation fact for OpenLigaDB football match records. Each row is one
      match from one upstream league snapshot at one fetched timestamp. Repeated snapshots preserve changes
      to completion, scores, and source update time; duplicate raw rows at the same source, match, and
      observation grain are reduced to the latest loaded record while raw-load lineage is retained.


      **Grain:** source_system, match_id, observed_at


      **What changes here:** how the scheduled football calendar, score levels, and team mix change across
      the season and match updates.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `openligadb` — licence: OpenLigaDB — community project; attribution required: False. Source configuration:
      `extract/sources/openligadb.yml`.'
