tiles:
- h: 6
  properties:
    content: 'Deduplicated laboratory turnaround observations from the North Carolina agronomic laboratory
      feed. Each row records the observed turnaround estimate for one report identifier at one source
      fetch timestamp, with typed duration measures and load lineage retained for audit and replay.


      **Grain:** source, turnaround_id, fetched_at


      **What changes here:** how the observed turnaround level and processing-day estimates vary across
      labs and report types.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nc_lab_turnaround` — licence: North Carolina public-information terms; attribution required:
      True. Source configuration: `extract/sources/nc_lab_turnaround.yml`.'
