tiles:
- h: 6
  properties:
    content: 'Daily physical history of job observations returned by Breezy applicant tracking boards.
      Each row represents one upstream source, job identifier, and extractor observation timestamp; repeated
      raw copies of an observation are reduced to the latest loaded lineage record while listing attributes
      and load metadata remain available for audit and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how Breezy''s tiny published catalogue changes across extractor observation
      days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_boards_breezy` — licence: public ATS board endpoints; attribution required: False. Source
      configuration: `extract/sources/job_boards_breezy.yml`.'
