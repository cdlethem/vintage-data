tiles:
- h: 6
  properties:
    content: 'Daily physical observation fact for the US Treasury OFAC Specially Designated Nationals
      snapshot. Each row is one source, sanction identifier, and extractor observation timestamp, retaining
      the reported entity, programme tags, aliases, addresses, identifiers, and raw-load lineage. Repeated
      raw copies of the same observation are reduced to the latest loaded record so the table remains
      one row per governed grain while preserving the complete snapshot history.


      **Grain:** source_name, sanction_id, observed_at


      **What changes here:** The OFAC snapshot level is stable overall while sanctioned entity categories
      and programme mix reveal small daily revisions.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ofac_sanctions` — licence: US Treasury public data; attribution required: False. Source configuration:
      `extract/sources/ofac_sanctions.yml`.'
