tiles:
- h: 6
  properties:
    content: 'Daily physical history of Himalayas job observations. Each row represents one job identifier
      from one upstream observation timestamp; repeated ingestion of the same observation is reduced to
      the latest loaded copy while published job attributes and load-layer lineage remain available for
      analysis, audit, and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how the Himalayas catalogue level and employment mix change across observation
      days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_himalayas` — licence: public Himalayas jobs API; attribution required: True. Source
      configuration: `extract/sources/job_feed_himalayas.yml`.'
    hideFrame: false
    title: Job feed himalayas
