tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of WSPR radio spots returned by the live feed. Each row is
      one source, spot identifier, and feed observation timestamp; repeated insert-only copies are reduced
      to the latest raw load while complete source lineage and the radio measurement are retained.


      **Grain:** source, spot_id, observed_at


      **What changes here:** how radio-spot volume, propagation distance, and signal strength shift by
      band and station grid across the five-day signal window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `wspr_live` — licence: WSPR.live — volunteer amateur-radio community data; attribution required:
      False. Source configuration: `extract/sources/wspr_live.yml`.'
    hideFrame: false
    title: Radio propagation spots
