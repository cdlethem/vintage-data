tiles:
- h: 6
  properties:
    content: 'Physical observations of the UK register-to-vote usage feed. Each row is one source registration
      observation at one fetch timestamp, retaining the publisher timestamp, reported application count,
      and load lineage. Exact replayed observations are reduced to the latest loaded copy.


      **Grain:** source, registration_observation_id, observed_at


      **What changes here:** how reported registration demand changes through the four-day feed window
      and how the publisher''s event timestamps compare with collection levels.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `register_to_vote` — licence: UK government public data; attribution required: True. Source configuration:
      `extract/sources/register_to_vote.yml`.'
    hideFrame: false
    title: Register to vote
