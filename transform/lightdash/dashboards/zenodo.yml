tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for records returned by the Zenodo extractor. Each
      row is one Zenodo record identifier at one extractor observation timestamp, preserving descriptive
      metadata and raw-load lineage. Repeated copies of the same source, record, and observation timestamp
      retain the latest loaded row.


      **Grain:** source_name, record_id, observed_at


      **What changes here:** how Zenodo''s observed catalogue size and newly created record mix shift
      by resource type and access right across the five-day window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `zenodo` — licence: per-record (cc-by-4.0 observed); varies; attribution required: True. Source
      configuration: `extract/sources/zenodo.yml`.'
    hideFrame: false
    title: Zenodo record observation
