tiles:
- h: 6
  properties:
    content: 'Hourly physical observations of UK Parliament petitions. Each row is one petition at one
      upstream fetch timestamp, retaining the publisher''s scalar petition attributes, nested response
      metadata, and raw loader lineage. Repeated loads of the same petition and timestamp are reduced
      to the latest loader row, while distinct fetch timestamps remain historical observations.


      **Grain:** source_relation, petition_id, observed_at


      **What changes here:** petition creation and signature momentum move alongside threshold events
      over time.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `uk_petitions` — licence: Parliament reuse terms; attribution required: True. Source configuration:
      `extract/sources/uk_petitions.yml`.'
    hideFrame: false
    title: Uk petitions
