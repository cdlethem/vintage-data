tiles:
- h: 6
  properties:
    content: 'Hourly physical history of STAC imagery items returned by the imagery discovery feed. Each
      row is one imagery item observed at one fetch timestamp; repeated ingestion of the same item snapshot
      is reduced to the latest loaded copy while the item attributes and raw-load lineage remain available.


      **Grain:** source_name, item_id, observed_at


      **What changes here:** how the five-day observed imagery catalogue changes in size, cloudiness,
      and platform mix while captured-scene history remains shallow.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `stac_imagery` — licence: varies per collection (naip/landsat public domain; Sentinel proprietary
      notice); attribution required: True. Source configuration: `extract/sources/stac_imagery.yml`.'
    hideFrame: false
    title: Stac imagery
  type: markdown
  w: 36
  x: 0
  y: 0
