tiles:
- h: 6
  properties:
    content: 'Physical history of Bordeaux bridge status observations. Each row is one bridge returned
      by the source at one observation timestamp; repeated raw deliveries of the same observation retain
      only the latest loaded copy while preserving source-file lineage.


      **Grain:** source, bridge_id, observed_at


      **What changes here:** how the single bridge''s reported status and observation cadence change day
      by day.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `bordeaux_bridge` — licence: Bordeaux Metropole open-data terms; attribution required: True. Source
      configuration: `extract/sources/bordeaux_bridge.yml`.'
