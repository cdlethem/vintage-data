tiles:
- h: 6
  properties:
    content: 'Hourly physical history of IMDb contribution processing observations. Each row records one
      processing category at one upstream fetch timestamp, with queue age, service-level tier, backlog
      count, and raw-load lineage retained for operational monitoring and replay.


      **Grain:** source, processing_type, observed_at


      **What changes here:** how the IMDb processing queue changes by observation day and service tier,
      with publisher dates offering only a short recent window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `imdb_processing_times` — licence: IMDb non-commercial-use terms; attribution required: True.
      Source configuration: `extract/sources/imdb_processing_times.yml`.'
    hideFrame: false
    title: Imdb processing times
