tiles:
- h: 6
  properties:
    content: 'Hourly typed epidemiological surveillance observations for São Paulo from the Infodengue
      city-alerts feed. This physical incremental fact is at the source relation and provider record identifier
      grain, retaining the latest loaded replay and raw-load lineage for auditability.


      **Grain:** source_relation, record_id


      **What changes here:** Weekly epidemiological estimates show how São Paulo''s burden changes, while
      alert and transmission statuses explain the shifts.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue_saopaulo` — see dbt raw-source lineage.'
    hideFrame: false
    title: Infodengue saopaulo epidemiology
