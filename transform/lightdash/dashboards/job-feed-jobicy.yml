tiles:
- h: 6
  properties:
    content: 'Daily physical history of jobs published by the Jobicy remote-jobs feed. Each row is one
      job identifier at one upstream observation timestamp; repeated copies of that observation are reduced
      to the latest loaded lineage record while the published job attributes and source payload lineage
      remain available for analysis and audit.


      **Grain:** job_id, observed_at


      **What changes here:** how the four-day catalogue level and recent posting mix change across jobicy''s
      remote-job feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_jobicy` — licence: Jobicy public API terms; attribution required: True. Source configuration:
      `extract/sources/job_feed_jobicy.yml`.'
