tiles:
- h: 6
  properties:
    content: 'Incremental physical observation fact for DriveBC Open511 road events. Each row is one source
      event at one feed fetch timestamp, preserving the event''s status, classification, location JSON,
      scheduling metadata, and raw-load lineage. Replayed copies of the same source event observation
      retain the latest loaded row; no current-state inference is applied.


      **Grain:** source_name, event_id, observed_at


      **What changes here:** how road-event creation, updates, and reported locations change across the
      DriveBC feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `drivebc_events` — licence: Open Government Licence-Canada; attribution required: True. Source
      configuration: `extract/sources/drivebc_events.yml`.'
    hideFrame: false
    title: Drivebc event observations
