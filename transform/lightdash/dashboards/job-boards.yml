tiles:
- h: 6
  properties:
    content: 'Daily physical history of job-listing observations collected from the combined Greenhouse,
      Ashby, and Lever job-board feeds. The table is materialized as a physical relation so the append-only
      source history can be queried repeatedly without rescanning the raw payloads. Each row represents
      one source, job identifier, and extractor observation timestamp; repeated raw copies of that observation
      are reduced to the latest loaded lineage record while listing attributes and load metadata remain
      available for audit and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how posted job volume and company coverage change across job-board feeds.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_boards` — see dbt raw-source lineage.'
