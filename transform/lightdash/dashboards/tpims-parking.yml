tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for truck-parking status snapshots published by TPIMS.
      Each row represents one parking site at one extractor observation time, with reported availability,
      operational flags, publisher timestamps, and raw load lineage. Repeated copies of the same observation
      grain retain the latest loaded row.


      **Grain:** source, site_id, observed_at


      **What changes here:** how many parking sites report, how much availability they show, and how static
      site updates differ by region.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `tpims_parking` — licence: State DOT terms; attribution required: True. Source configuration:
      `extract/sources/tpims_parking.yml`.'
    hideFrame: false
    title: Tpims parking status
