tiles:
- h: 6
  properties:
    content: 'Daily physical history of Malaysia blood-donation observations. Each row records one source
      observation identifier and fetch timestamp, with its reported date, state, blood type, and donation
      count. Insert-only reloads of the same observation are reduced to the latest loaded copy while extractor
      and load lineage are kept for audit and replay. The publisher timestamp is retained as source text
      because the feed emits an RFC-style GMT string that is not consistently parseable as a warehouse
      timestamp.


      **Grain:** source, observation_id, fetched_at


      **What changes here:** how reported blood-donation volume changes by donation date across the published
      feed.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `malaysia_blood_donations` — licence: CC BY 4.0; attribution required: True. Source configuration:
      `extract/sources/malaysia_blood_donations.yml`.'
