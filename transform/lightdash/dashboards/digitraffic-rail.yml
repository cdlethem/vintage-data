tiles:
- h: 6
  properties:
    content: 'Physical history of train snapshots reported by the Digitraffic Rail live trains feed. Each
      row is one train from one feed at one observation timestamp, with the source timetable stop array
      retained as JSON and the raw load lineage preserved. Re-ingested copies of the same feed, train,
      and observation timestamp are reduced to the latest loaded copy.


      **Grain:** source_feed, train_id, observed_at


      **What changes here:** how the published train roster and source timetable mix change across observation
      and acceptance time.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `digitraffic_rail` — licence: CC BY 4.0; attribution required: True. Source configuration: `extract/sources/digitraffic_rail.yml`.'
    hideFrame: false
    title: Digitraffic rail train observation
