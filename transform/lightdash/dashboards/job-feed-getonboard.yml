tiles:
- h: 6
  properties:
    content: 'Daily physical history of GetOnBoard job observations. Each row represents one GetOnBoard
      job identifier from one extractor observation timestamp; repeated ingestion of the same observation
      is reduced to the latest loaded copy while load-layer lineage remains available for audit and replay.


      **Grain:** source, job_id, observed_at


      **What changes here:** how the GetOnBoard catalogue level and department mix change across observation
      days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_getonboard` — licence: public Get on Board API; attribution required: True. Source configuration:
      `extract/sources/job_feed_getonboard.yml`.'
    hideFrame: false
    title: Job feed getonboard
