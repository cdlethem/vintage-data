tiles:
- h: 6
  properties:
    content: 'Physical observation fact for the bounded, changing Library of Congress robotics books search.
      Each row is one source, stable item identifier, and UTC collection timestamp (`observed_at`). The
      configured query returns a ranked slice of at most 200 observations per run, not a catalogue census.
      Collection-day counts are catalogue levels rather than flows; missing collection days are absent
      rather than zero. Repeated snapshots preserve later catalogue and ranking changes, while `item_date`
      is a free-form source label and not event time.


      **Grain:** source, item_id, observed_at


      **What changes here:** how item and represented item-date-label coverage and reported digitization
      change across daily observations of the bounded, changing Library of Congress robotics-search slice.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - Data provided by the Library of Congress. `library_of_congress` — licence: Library of Congress
      catalog metadata; attribution required: True. Source configuration: `extract/sources/library_of_congress.yml`.
      Rights for linked collection material vary by item; consult the item-specific rights and access
      statement before reuse.'
    hideFrame: false
    title: Library of Congress item observation
  type: markdown
