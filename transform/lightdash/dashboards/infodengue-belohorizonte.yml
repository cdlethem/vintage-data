tiles:
- h: 6
  properties:
    content: 'Hourly physical history of epidemiological surveillance observations for Belo Horizonte
      from the Infodengue city-alerts feed. Each row is one provider source relation and record identifier;
      insert-only replays are reduced to the latest loaded copy while typed measures and raw-load lineage
      remain available for audit and reproducible downstream analysis.


      **Grain:** source_relation, record_id


      **What changes here:** how weekly Belo Horizonte dengue burden and transmission indicators rise
      and fall across epidemiological weeks.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue_belohorizonte` — see dbt raw-source lineage.'
    hideFrame: false
    title: Infodengue belohorizonte epidemiology
