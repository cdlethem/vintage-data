tiles:
- h: 6
  properties:
    content: 'Daily physical history of Open Collective account snapshots. Each row is one account observed
      at one fetch timestamp, with account balances, funding totals, and source-load lineage retained
      for replay auditing. The source is insert-only and repeated copies of one observation are reduced
      to the latest loaded record.


      **Grain:** source_name, account_id, observed_at


      **What changes here:** Account balances and backer levels move only slightly across four daily snapshots
      while currency mix explains most scale differences.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `open_collective` — licence: Open Collective — public; attribution required: False. Source configuration:
      `extract/sources/open_collective.yml`.'
    hideFrame: false
    title: Open collective account observation
