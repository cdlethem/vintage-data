tiles:
- h: 6
  properties:
    content: 'Incremental physical observation fact for Stack Exchange questions. Each row is one question
      from one Stack Exchange site at one API fetch time, retaining the question metadata, engagement
      counters, and raw-load lineage. Replayed copies of the same site, question, and observation timestamp
      are reduced to the latest loaded row; this model does not infer question edits or reconstruct omitted
      API fields.


      **Grain:** source_name, question_id, observed_at


      **What changes here:** how the latest question catalogue changes in size, answered mix, and reported
      engagement during the five-day API observation window.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `stackexchange` — licence: Stack Exchange API — CC-BY-SA content; attribution required: True.
      Source configuration: `extract/sources/stackexchange.yml`.'
    hideFrame: false
    title: Stackexchange question observation
