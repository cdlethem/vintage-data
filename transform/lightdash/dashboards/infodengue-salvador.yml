tiles:
- h: 6
  properties:
    content: 'Daily physical history of InfoDengue epidemiological observations for Salvador. Each row
      represents the latest loaded copy of one provider record from the Salvador city-alerts feed at the
      source relation and record identifier grain; typed surveillance measures and raw-load lineage are
      retained. The source is refreshed daily and revises prior epidemiological weeks, so repeated records
      are reduced to the latest loaded copy during each table build.


      **Grain:** source_relation, record_id


      **What changes here:** Weekly epidemiological estimates show how Salvador''s burden changes, while
      alert and transmission statuses explain the shifts.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue_salvador` — see dbt raw-source lineage.'
