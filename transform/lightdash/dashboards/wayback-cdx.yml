tiles:
- h: 6
  properties:
    content: 'Daily physical history of Internet Archive Wayback CDX captures. Each row records one CDX
      capture identifier observed in one extractor fetch, with typed capture metadata and raw-load lineage;
      repeated ingestion of the same source, capture, and observation timestamp retains the latest copy.


      **Grain:** source_name, capture_id, observed_at


      **What changes here:** how archived capture volume, response size, and status mix change across
      capture days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `wayback_cdx` — licence: Internet Archive — public; attribution required: False. Source configuration:
      `extract/sources/wayback_cdx.yml`.'
    hideFrame: false
    title: Wayback cdx observation
