tiles:
- h: 6
  properties:
    content: 'Physical observation fact for the Texas Lottery scratch-ticket prize inventory feed. Each
      row is the latest retained raw record for one prize record at one feed observation timestamp, preserving
      the game, prize level, claim counts, publisher date, and raw load lineage. The model does not estimate
      remaining prizes or infer ticket sales.


      **Grain:** source_system, prize_id, observed_at


      **What changes here:** how claimed-prize levels change across publisher updates and which games
      and ticket prices carry the inventory.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `texas_scratch_prizes` — licence: Texas Lottery terms; attribution required: True. Source configuration:
      `extract/sources/texas_scratch_prizes.yml`.'
    hideFrame: false
    title: Texas scratch prize observation
