tiles:
- h: 6
  properties:
    content: 'Hourly latest epidemiological surveillance observations from the Infodengue city-alerts
      feed. The physical incremental fact retains one row at the source relation and provider record identifier
      grain, choosing the latest loaded replay for each identifier while preserving raw-load lineage and
      typed epidemiological measures.


      **Grain:** source_relation, record_id


      **What changes here:** how dengue incidence and case estimates move across epidemiological weeks
      and risk levels.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `infodengue` — licence: InfoDengue — attribution required; attribution required: True. Source
      configuration: `extract/sources/infodengue.yml`.'
    hideFrame: false
    title: Infodengue epidemiology
