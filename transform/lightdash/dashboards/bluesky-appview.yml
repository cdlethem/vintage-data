tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical observation fact for posts returned by the Bluesky AppView feed. Each
      row represents one post URI at one extractor observation timestamp, retaining the engagement snapshot,
      post text metadata, and raw-load lineage. The incremental table preserves the append-only observation
      history without rescanning prior raw snapshots on each 15-minute load. Repeated raw copies of the
      same observation are reduced to the latest loaded row.


      **Grain:** source_name, post_uri, observed_at


      **What changes here:** how the observed Bluesky catalogue and engagement levels change across posts''
      creation dates and polling days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `bluesky_appview` — licence: Bluesky/AT Protocol — public posts; attribution required: False.
      Source configuration: `extract/sources/bluesky_appview.yml`.'
    hideFrame: false
    title: Bluesky appview post observation
