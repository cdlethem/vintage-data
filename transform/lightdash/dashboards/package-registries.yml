tiles:
- h: 6
  properties:
    content: 'Physical history of package releases observed from the package registry. Each row represents
      one registry source, package, version, and observation timestamp, with the latest insert-only copy
      retained when a load is replayed. Package metadata and raw-load lineage are typed for dependable
      release discovery and audit.


      **Grain:** source_name, package_name, package_version, observed_at


      **What changes here:** how the observed package and release catalogue levels move and which packages
      and authors account for the latest publication bursts.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `package_registries` — licence: PyPI / crates.io public feeds; attribution required: False. Source
      configuration: `extract/sources/package_registries.yml`.'
    hideFrame: false
    title: Package registry release observation
