tiles:
- h: 6
  properties:
    content: 'Daily physical observation fact for the U.S. Transportation Security Administration passenger-throughput
      table. Each row represents one TSA throughput date from one extractor fetch, retaining passenger
      totals, the publisher''s update marker, and raw-load lineage. Repeated ingestion of the same source,
      identifier, date, and observation timestamp is reduced to the latest loaded record.


      **Grain:** source, throughput_id, throughput_date, observed_at


      **What changes here:** weekly passenger throughput levels and the publisher snapshots that revise
      them.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `tsa_throughput` — licence: US federal public data; attribution required: False. Source configuration:
      `extract/sources/tsa_throughput.yml`.'
