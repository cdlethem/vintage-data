tiles:
- h: 6
  properties:
    content: 'Hourly physical history of Codeforces recent-submission observations. Each row represents
      one submission from the Codeforces feed at one extractor observation timestamp; repeated ingestion
      of the same observation is reduced to the latest loaded row while status changes across observations
      remain visible. Raw-load lineage is retained for replay and audit.


      **Grain:** source, submission_id, observed_at


      **What changes here:** how submission activity, judge outcomes, and participating users change across
      the recent Codeforces feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `codeforces` — licence: Codeforces API — keyless, public; attribution required: False. Source
      configuration: `extract/sources/codeforces.yml`.'
    hideFrame: false
    title: Codeforces submission observation
