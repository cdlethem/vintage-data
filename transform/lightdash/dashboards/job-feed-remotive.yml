tiles:
- h: 6
  properties:
    content: 'Daily historical observations of jobs returned by the Remotive remote-jobs feed. Each row
      represents one job identifier observed at one extractor timestamp; repeated raw ingestion of an
      identical observation is reduced to the latest loaded copy while prior observations remain available
      for history.


      **Grain:** source_name, job_id, observed_at


      **What changes here:** how the four-day Remotive catalogue level and sparse publication mix change
      across companies and departments.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_remotive` — licence: public Remotive API; attribution required: True. Source configuration:
      `extract/sources/job_feed_remotive.yml`.'
    hideFrame: false
    title: Job feed remotive
