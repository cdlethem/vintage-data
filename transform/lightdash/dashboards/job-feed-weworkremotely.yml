tiles:
- h: 6
  properties:
    content: 'Deduplicated job observations published by the We Work Remotely feed. Each row represents
      one source job at one feed observation timestamp; repeated loads of the same source, job, and observation
      are reduced to the latest loaded row while ingestion lineage is retained.


      **Grain:** source, job_id, fetched_at


      **What changes here:** how the feed''s posted-job flow and observed catalogue change across departments,
      employers, and locations.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_feed_weworkremotely` — licence: public We Work Remotely RSS feed; attribution required: True.
      Source configuration: `extract/sources/job_feed_weworkremotely.yml`.'
