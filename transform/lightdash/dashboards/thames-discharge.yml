tiles:
- h: 6
  properties:
    content: 'Twice-hourly incremental physical history of Thames Water discharge observations. Each row
      represents one discharge location identifier at one extractor observation timestamp, with the reported
      status, location and alert timing retained alongside raw-load lineage. Repeated insert-only raw
      copies of the same observation are reduced to the latest loaded copy.


      **Grain:** source_system, discharge_id, observed_at


      **What changes here:** how reported discharge-status changes and alert activity move across statuses
      and watercourses.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `thames_discharge` — licence: Thames Water open-data terms; attribution required: True. Source
      configuration: `extract/sources/thames_discharge.yml`.'
