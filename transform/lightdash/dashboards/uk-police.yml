tiles:
- h: 6
  properties:
    content: 'Daily incremental physical fact of UK Police street-level crime snapshots for the Leicester-area
      API extract. Each row records one crime identifier from one publishing source at one extractor fetch
      timestamp, preserving the source''s monthly crime period and outcome status. The append-only raw
      loads are deduplicated by this observation grain, retaining the latest loaded copy and complete
      load lineage so later outcome revisions remain queryable as observations rather than overwriting
      history. Coordinates are anonymised nearby map points supplied by the publisher, not precise crime
      addresses.


      **Grain:** source, crime_id, observed_at


      **What changes here:** how recorded crime volume and outcome mix change across source crime months.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `uk_police` — licence: Open Government Licence — attribution required; attribution required: True.
      Source configuration: `extract/sources/uk_police.yml`.'
