tiles:
- h: 6
  properties:
    content: 'Deduplicated observations of published New Zealand visa processing waits. Each row records
      one visa type from an endpoint observation timestamp and retains the source text alongside wait
      durations normalized to days.


      **Grain:** source, visa_type_key, observed_at


      **What changes here:** how many visa categories the feed reports each day and whether published
      wait durations are available to track.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `nz_visa_wait_times` — licence: Immigration NZ public data; attribution required: True. Source
      configuration: `extract/sources/nz_visa_wait_times.yml`.'
    hideFrame: false
    title: Nz visa wait times
