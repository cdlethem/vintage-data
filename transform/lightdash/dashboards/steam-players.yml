tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of concurrent Steam player counts. Each row represents one
      game at one Steam feed observation timestamp for the source, retaining the request status, player
      count, and raw-load lineage. Repeated insert-only raw records for the same source, game, and observation
      time are reduced to the latest loaded copy.


      **Grain:** source, game_id, observed_at


      **What changes here:** how the monitored Steam games'' player levels rise and fall across each observation
      day.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `steam_players` — licence: unstated; attribution required: False. Source configuration: `extract/sources/steam_players.yml`.'
