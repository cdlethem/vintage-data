tiles:
- h: 6
  properties:
    content: 'Physical fact of UK Ministry of Justice prison-estate observations. Each row records one
      metric and population group for one source snapshot and reporting period. The source does not expose
      an individual establishment identifier; observation_id is the extractor''s composite period, metric,
      and group key. Numeric source values are available in measure_value and the original source text
      is retained in measure_value_text for nonnumeric source markers.


      **Grain:** source, observation_id, observed_at


      **What changes here:** how prison population, capacity, and headroom measures move across reporting
      periods and population groups.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `uk_prison_estate` — licence: Open Government Licence; attribution required: True. Source configuration:
      `extract/sources/uk_prison_estate.yml`.'
