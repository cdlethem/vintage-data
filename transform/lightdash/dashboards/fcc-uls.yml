tiles:
- h: 6
  properties:
    content: 'Physical daily observation fact for FCC Universal Licensing System amateur-radio license
      records. Each row records one FCC license identifier at one extractor observation timestamp, retaining
      the published license attributes and raw-load lineage. Repeated copies of the same source license
      and observation timestamp retain the latest loaded row; personally identifying fields are redacted
      by the extractor before loading.


      **Grain:** source_name, license_id, observed_at


      **What changes here:** how FCC license grants accumulate and how their status and operator-class
      mix changes.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `fcc_uls` — licence: US Government work, public domain; attribution required: False. Source configuration:
      `extract/sources/fcc_uls.yml`.'
