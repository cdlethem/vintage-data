tiles:
- h: 6
  properties:
    content: 'Daily physical history of Project Gutenberg book records returned by the Gutendex feed.
      Each row represents one book identifier observed at one fetched_at timestamp, retaining catalog
      metadata and raw-load lineage; repeated ingestion of the same source, book, and observation timestamp
      is reduced to the latest loaded copy.


      **Grain:** source, book_id, fetched_at


      **What changes here:** how the size and reported download level of the Gutendex catalog change across
      fetch days.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gutendex` — licence: the catalog metadata is Gutendex''s own; the underlying texts are Project
      Gutenberg public domain; attribution required: False. Source configuration: `extract/sources/gutendex.yml`.'
    hideFrame: false
    title: Gutendex book snapshot
