tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot of Food Hygiene Rating Scheme records for Westminster businesses.
      Each row is one source business identifier at one source fetch timestamp; repeated copies of the
      same observation grain are resolved to the latest loaded file row. Published rating and component
      scores are exposed as typed values, with original nested scores and geocode JSON retained alongside
      source lineage.


      **Grain:** source, business_id, fetched_at


      **What changes here:** how Westminster rating activity and reported hygiene scores shift across
      business types over rating history.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings_westminster` — see dbt raw-source lineage.'
