tiles:
- h: 6
  properties:
    content: 'Daily physical snapshot of Birmingham food-hygiene ratings. Each row is one food business
      from one publisher snapshot, identified by source, business_id, and observed_at. The six duplicate
      source rows observed in the initial load are reduced deterministically by source load lineage; source
      business attributes and the three nested FHRS scores are exposed as typed columns while loader lineage
      is retained.


      **Grain:** source, business_id, observed_at


      **What changes here:** how Birmingham food-business inspection volume and component scores change
      across rating history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `food_hygiene_ratings_birmingham` — see dbt raw-source lineage.'
