tiles:
- h: 7
  properties:
    content: "Hourly append-only observation history of UK Parliament BusinessItem procedural records. Each row is one raw source relation, procedural item, and extractor observation timestamp; repeat deliveries at that grain retain the latest load.\n\n**Grain:** source_relation, procedural_item_id, observed_at\n\n**Interpretation:** `observed_at` is UTC extractor observation time. `laying_at`, `first_business_item_at`, and `last_business_item_at` are UTC Parliamentary business timestamps. This is neither a current snapshot nor SCD2 history: revisions remain as separate rows. Distinct-item measures de-duplicate only inside their selected group, and items with multiple scheduled dates can fall in overlapping categories; do not add categories or time buckets as if they were disjoint flows.\n\n**Windows:** ranked and record tiles cover the latest 30 observed UTC days. Event trend tiles cover the latest 365 days on their stated business-date axis. Empty buckets mean no matching retained observations, not proof that no Parliamentary event occurred.\n\n**Source and attribution:** UK Parliament BusinessItem OData feed. Contains Parliamentary information licensed under the Open Parliament Licence v3.0. Source configuration: `extract/sources/uk_parliament_procedural_activity.yml`."
    hideFrame: false
    title: UK Parliament procedural activity — observation history
