tiles:
- h: 6
  properties:
    content: 'Hourly append-only observation history of UK Parliament procedural BusinessItems. Replayed
      raw copies of the same observation are reduced deterministically to the latest loaded lineage record;
      all distinct extractor observation times remain as versions. Raw `BusinessItemDate` JSON is retained,
      while malformed individual schedule dates become null summaries rather than rejecting the observation.


      **Grain:** source_relation, procedural_item_id, observed_at


      **Interpretation:** item charts count distinct procedural items within each group. Version charts count
      retained observations and are non-additive across overlapping windows. The average is observation-weighted:
      every retained version contributes equally, so frequently revised items can contribute repeatedly. It
      is not an average over one current snapshot.


      **Time:** `observed_at` is collector observation time; `laid_at`, `first_scheduled_at`, and
      `last_scheduled_at` are publisher business times. All filters are bounded UTC windows stated on each chart.


      **Provenance:** UK Parliament API, Open Parliament Licence v3.0; attribution required. Source configuration:
      `extract/sources/uk_parliament_procedural_activity.yml`.'
