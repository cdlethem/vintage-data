tiles:
- h: 6
  properties:
    content: 'Daily physical history of job observations returned by Greenhouse applicant tracking system
      boards. Each row represents one upstream source, job identifier, and extractor observation timestamp;
      repeated raw copies of an observation are reduced to the latest loaded lineage record while listing
      attributes and load metadata remain available for audit and replay. A table materialization preserves
      the append-only observation history for the daily feed without rescanning raw records at query time.


      **Grain:** source, job_id, observed_at


      **What changes here:** how Greenhouse hiring demand and employer mix change across the publication
      history.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `job_boards_greenhouse` — licence: public ATS board endpoints; attribution required: False. Source
      configuration: `extract/sources/job_boards_greenhouse.yml`.'
