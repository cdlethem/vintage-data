tabs: []
tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of changes published by the Open Library change feed. Each
      row represents one change identifier from the Open Library source at one extractor observation time.
      Insert-only copies of the same source, identifier, and observation timestamp are reduced to the
      latest loaded copy while raw-load lineage is retained for replay and audit.


      **Grain:** source_name, change_id, observed_at


      **What changes here:** Open Library change volume rises and falls by operation kind while changed-key
      depth shows how substantial each burst is.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `open_library` — licence: unstated (Internet Archive project); attribution required: False. Source
      configuration: `extract/sources/open_library.yml`.'
