tiles:
- h: 6
  properties:
    content: 'Daily physical history of avalanche forecast observations published by avalanche.org. Each
      row is one forecast zone identified by its upstream source and identifier at an extractor observation
      timestamp, with the published danger, season dates, travel guidance, and raw-load lineage retained
      for audit and replay.


      **Grain:** source_name, forecast_id, observed_at


      **What changes here:** how forecast-zone coverage and the sparse published season schedule change
      across observations.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `avalanche_forecasts` — licence: varies per EAWS member service; several require attribution to
      issuing warning service; attribution required: True. Source configuration: `extract/sources/avalanche_forecasts.yml`.'
    hideFrame: false
    title: Avalanche forecasts
