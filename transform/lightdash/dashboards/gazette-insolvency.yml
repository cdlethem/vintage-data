tiles:
- h: 6
  properties:
    content: 'Hourly physical observation fact for UK Gazette insolvency notices. Each row records one
      notice identifier at one source fetch timestamp, retaining the notice publication fields, feed metadata,
      and raw-load lineage. Repeated copies of the same source, notice, and observation timestamp retain
      the latest loaded row.


      **Grain:** source_name, notice_id, observed_at


      **What changes here:** how the published notice catalogue and reported feed size move across the
      latest four observation days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `gazette_insolvency` — licence: notice-specific reuse rights; attribution required: True. Source
      configuration: `extract/sources/gazette_insolvency.yml`.'
    hideFrame: false
    title: Gazette insolvency notice observation
