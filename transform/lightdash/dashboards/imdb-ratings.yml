tiles:
- h: 6
  properties:
    content: 'Daily incremental history of IMDb title rating observations. Each row is one title at one
      upstream fetch timestamp, preserving the reported rating, vote count, change metadata, and raw-load
      lineage. Replayed copies of the same title and observation timestamp are reduced to the latest loaded
      row; this model does not infer title metadata or fill omitted publisher values.


      **Grain:** title_id, observed_at


      **What changes here:** how IMDb title coverage, ratings, and voting activity change across the four
      observed snapshot days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `imdb_ratings` — licence: IMDb non-commercial-use terms; attribution required: True. Source configuration:
      `extract/sources/imdb_ratings.yml`.'
    hideFrame: false
    title: Imdb rating observation
