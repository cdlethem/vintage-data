tiles:
- h: 6
  properties:
    content: 'Physical daily snapshot fact for Launch Library launch records. Each row represents one
      launch identifier from one upstream feed at one fetched_at observation timestamp. Repeated observations
      preserve changing launch status, schedule, and source-update attributes, while duplicate raw rows
      for the same source, launch, and observation timestamp are reduced to the latest loaded record and
      load lineage is retained.


      **Grain:** source, launch_id, fetched_at


      **What changes here:** how the launch catalogue''s status mix and publisher revisions change over
      time.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `launch_library` — licence: unstated; attribution required: False. Source configuration: `extract/sources/launch_library.yml`.'
    hideFrame: false
    title: Launch library
