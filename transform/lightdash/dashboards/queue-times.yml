tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of theme-park attraction queue observations. Each row records
      one ride''s reported wait at a source snapshot, including park, land, operating status, update timestamp,
      and raw-load lineage. Repeated insert-only raw records for the same source, ride, and observation
      timestamp are reduced to the latest loaded record.


      **Grain:** source, park_id, land_id, ride_id, observed_at


      **What changes here:** how reported queue levels change across rides and park lands during each
      observation day, while source updates reveal short-term movement.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `queue_times` — licence: Queue-Times.com — free, attribution required; attribution required: True.
      Source configuration: `extract/sources/queue_times.yml`.'
