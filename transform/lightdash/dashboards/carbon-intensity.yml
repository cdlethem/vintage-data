tiles:
- h: 6
  properties:
    content: 'Incremental history of national carbon-intensity interval forecasts and actual values, retaining
      one observation per source interval and extractor timestamp. Repeated raw rows for the same observation
      are reduced to the latest loaded copy while raw-load lineage is preserved for replay and audit.


      **Grain:** source, interval_id, observed_at


      **What changes here:** how forecast and actual carbon intensity move across the publisher''s recent
      interval feed.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `carbon_intensity` — licence: CC BY 4.0 + formal Terms of Use; attribution required: True. Source
      configuration: `extract/sources/carbon_intensity.yml`.'
