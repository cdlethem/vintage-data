tiles:
- h: 6
  properties:
    content: 'Daily physical fact of Chess.com archive games from the chess_archives extraction. Each
      row is one player and game identifier; repeated append-only copies are reduced to the latest loaded
      record while game attributes and raw-load lineage remain available for audit.


      **Grain:** player_user, game_id


      **What changes here:** how recorded chess volume, time controls, results, and player strength shift
      over game history.


      **Window:** ranked and record tiles cover the past 30 days of `fetched_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `chess_archives` — licence: chess.com public API; attribution required: False. Source configuration:
      `extract/sources/chess_archives.yml`.'
    hideFrame: false
    title: Chess archives games
