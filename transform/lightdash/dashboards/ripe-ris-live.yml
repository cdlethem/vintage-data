name: Ripe Ris Live
slug: ripe-ris-live
spaceSlug: vintage-marts
tabs: []
tiles:
- h: 6
  properties:
    content: 'Twice-hourly physical history of BGP UPDATE messages observed by the RIPE RIS live collector.
      Each row represents one source, update identifier, and observation timestamp, with the route path,
      announcement and withdrawal sets preserved as JSON and raw-load lineage retained for audit and replay.
      Insert-only copies of the same observation are reduced to the latest loaded copy using the append-only
      load timestamp and file position.


      **Grain:** source, update_id, observed_at


      **What changes here:** how BGP update volume and route-change payloads vary by source event day
      and collector across the seven observed event days.


      **Window:** ranked and record tiles cover the past 30 days of `observed_at` (UTC); trend tiles state
      their own axis and window. Empty charts mean no matching published observations; they do not establish
      that no events occurred.


      **Provenance**

      - `ripe_ris_live` — licence: unstated (RIPE NCC public service); attribution required: False. Source
      configuration: `extract/sources/ripe_ris_live.yml`.'
    hideFrame: false
    title: Ripe ris live bgp update
