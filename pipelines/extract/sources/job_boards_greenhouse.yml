name: job_boards_greenhouse
dag_factory: job_boards
provider: greenhouse
script: fetch_job_boards.py
args: ["--providers", "greenhouse", "--max-per-board", "10000"]
schedule: "15 6 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 60
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "Named-company Greenhouse boards; each catalog token was live-verified with open postings on 2026-09-04. Runs as one independent task in the job-boards provider TaskGroup. Hiring changes slowly; poll daily."
rate_limit: "public board endpoint; bounded concurrency; daily polling"
licence: "public ATS board endpoints"
attribution_required: false
