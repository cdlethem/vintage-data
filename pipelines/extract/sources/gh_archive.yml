name: gh_archive
script: fetch_gh_archive.py
args: []
schedule: "20 * * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "genuinely continuous; hourly archive files plus a live tail with near-real-time events"
rate_limit: "60 req/hour unauthenticated for the live endpoint; the archive is static files, fetch each hour once and cache"
licence: "unstated (GitHub public event data, redistributed by GH Archive)"
attribution_required: false
