name: certificate_transparency
script: fetch_certificate_transparency.py
args: []
schedule: "40 4 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
# Rescheduled 2026-09-03: crt.sh is a per-domain SEARCH api, not a firehose --
# the watched domain (wikipedia.org) gains new certs ~monthly, so 15-min polling
# re-downloaded identical history. Daily is the honest cadence.
cadence_note: "certificates issue continuously; polling a watched domain every few minutes to hours is reasonable"
rate_limit: "unpublished but a single operator (Sectigo-run) that blocks heavy scripted use; self-impose a few requests per minute"
licence: "unstated"
attribution_required: false
