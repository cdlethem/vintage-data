name: fcc_uls
script: fetch_fcc_uls.py
args: ["records", "am"]
schedule: "30 14 * * *"  # UTC
enabled: true
retries: 1
timeout_minutes: 10
sink: local

# Vetting metadata (documentation only, not read by the DAG factory)
cadence_note: "daily weekday file overwritten weekly (rolling 7-day window only); fetch once/day after ~08:00 ET publish; dow left unset so the script picks today's weekday file"
rate_limit: "no published limit; large gov files, fetch each weekday file once/day at most"
licence: "US Government work, public domain"
attribution_required: false
